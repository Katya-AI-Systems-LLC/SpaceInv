## Multi-Cloud Configuration

### Global Configuration
```yaml
# global-config.yml
global:
  # Application Configuration
  application:
    name: "space-invaders-enhanced"
    version: "2.1.0"
    environment: "${ENVIRONMENT}"
    
  # Monitoring Configuration
  monitoring:
    enabled: true
    metrics_collection: true
    log_aggregation: true
    alerting: true
    health_checks: true
    
  # Security Configuration
  security:
    encryption_at_rest: true
    encryption_in_transit: true
    access_logging: true
    audit_logging: true
    compliance_standards:
      - "GDPR"
      - "Russian Federal Law #152-FZ"
      - "ISO 27001"
      
  # Performance Configuration
  performance:
    caching_enabled: true
    cdn_enabled: true
    compression_enabled: true
    minification_enabled: true
    
  # Backup Configuration
  backup:
    enabled: true
    schedule: "0 3 * * *"  # Daily at 3 AM
    retention_days: 30
    multi_region: true
    encryption: true
    
  # DNS Configuration
  dns:
    primary_domain: "space-invaders.com"
    cdn_domain: "cdn.space-invaders.com"
    api_domain: "api.space-invaders.com"
    ttl: 300
    
  # CDN Configuration
  cdn:
    enabled: true
    providers:
      - "yandex"
      - "vk"
      - "selectel"
    cache_ttl: 3600
    compression: true
    https_only: true
```

