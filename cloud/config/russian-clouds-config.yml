# Russian Cloud Configuration for Space Invaders Enhanced Edition

## Russian Cloud Providers Configuration

### Yandex Cloud Configuration
```yaml
# yandex-cloud-config.yml
yandex_cloud:
  # Account Configuration
  account:
    folder_id: "${YC_FOLDER_ID}"
    service_account_key: "${YC_SERVICE_ACCOUNT_KEY}"
    cloud_id: "${YC_CLOUD_ID}"
    
  # Storage Configuration
  storage:
    bucket_name: "${YC_BUCKET_NAME}"
    storage_class: "standard"
    access_mode: "public-read"
    versioning: true
    encryption: "AES256"
    lifecycle_rules:
      - id: "delete_old_versions"
        status: "Enabled"
        expiration:
          days: 30
        noncurrent_version_expiration:
          noncurrent_days: 7
  
  # Functions Configuration
  functions:
    name: "space-invaders-function"
    runtime: "nodejs16"
    memory: "512MB"
    timeout: "10s"
    environment_variables:
      ENVIRONMENT: "${ENVIRONMENT}"
      LOG_LEVEL: "info"
    concurrency: 10
    execution_timeout: "10s"
    
  # API Gateway Configuration
  api_gateway:
    name: "space-invaders-api"
    domain: "space-invaders.yandexcloud.net"
    spec_file: "api-gateway-spec.yaml"
    
  # Network Configuration
  network:
    name: "space-invaders-network"
    subnet_name: "space-invaders-subnet"
    zone: "ru-central1-a"
    v4_cidr_blocks: ["10.0.0.0/24"]
    
  # Security Configuration
  security:
    iam_policies:
      - role: "storage.admin"
        resource: "bucket"
        members: ["serviceAccount:${SERVICE_ACCOUNT_ID}"]
      - role: "functions.invoker"
        resource: "function"
        members: ["allUsers"]
    network_security_groups:
      - name: "space-invaders-nsg"
        rules:
          - direction: "ingress"
            protocol: "TCP"
            port: 80
            cidr_blocks: ["0.0.0.0/0"]
          - direction: "ingress"
            protocol: "TCP"
            port: 443
            cidr_blocks: ["0.0.0.0/0"]
```

### VK Cloud Configuration
```yaml
# vk-cloud-config.yml
vk_cloud:
  # Account Configuration
  account:
    username: "${VK_CLOUD_USERNAME}"
    password: "${VK_CLOUD_PASSWORD}"
    token: "${VK_CLOUD_TOKEN}"
    project_id: "${VK_CLOUD_PROJECT_ID}"
    
  # Container Registry Configuration
  registry:
    url: "${VK_CLOUD_REGISTRY}"
    namespace: "space-invaders"
    image_name: "space-invaders"
    tag: "latest"
    credentials:
      username: "${VK_CLOUD_USERNAME}"
      password: "${VK_CLOUD_PASSWORD}"
    
  # Storage Configuration
  storage:
    endpoint: "${VK_CLOUD_STORAGE_URL}"
    container_name: "space-invaders"
    access_level: "public"
    cors_rules:
      - allowed_origins: ["*"]
        allowed_methods: ["GET", "POST", "PUT", "DELETE"]
        allowed_headers: ["*"]
        max_age_seconds: 3600
        
  # Database Configuration
  database:
    type: "postgresql"
    version: "13"
    instance_name: "space-invaders-db"
    size: "small"
    storage_size: "100GB"
    backup_retention: 7
    connection_pool_size: 10
    
  # Compute Configuration
  compute:
    instance_type: "small"
    image: "ubuntu-20.04"
    disk_size: "50GB"
    network_type: "public"
    security_groups:
      - "space-invaders-sg"
      
  # Network Configuration
  network:
    name: "space-invaders-network"
    subnet_cidr: "192.168.1.0/24"
    gateway: "192.168.1.1"
    dns_servers: ["8.8.8.8", "8.8.4.4"]
    
  # Security Configuration
  security:
    firewall_rules:
      - direction: "ingress"
        protocol: "TCP"
        port: 80
        source: "0.0.0.0/0"
      - direction: "ingress"
        protocol: "TCP"
        port: 443
        source: "0.0.0.0/0"
      - direction: "ingress"
        protocol: "TCP"
        port: 22
        source: "10.0.0.0/8"
```

