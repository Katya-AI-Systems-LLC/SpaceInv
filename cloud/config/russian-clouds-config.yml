    name: "space-invaders-network"
    subnet_cidr: "10.0.1.0/24"
    gateway: "10.0.1.1"
    dns_servers: ["8.8.8.8", "8.8.4.4"]
    
  # Security Configuration
  security:
    security_groups:
      - name: "space-invaders-sg"
        rules:
          - direction: "ingress"
            protocol: "TCP"
            port: 80
            cidr: "0.0.0.0/0"
          - direction: "ingress"
            protocol: "TCP"
            port: 443
            cidr: "0.0.0.0/0"
          - direction: "ingress"
            protocol: "TCP"
            port: 22
            cidr: "10.0.0.0/8"
            
  # Backup Configuration
