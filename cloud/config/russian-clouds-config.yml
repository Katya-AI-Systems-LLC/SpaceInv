## Usage Instructions

### Setup and Configuration
```bash
# 1. Install dependencies
pip install pyyaml asyncio

# 2. Copy configuration template
cp russian-clouds-config.yml.template russian-clouds-config.yml
cp .env.template .env

# 3. Fill in your actual values
# Edit russian-clouds-config.yml with your cloud provider details
# Edit .env with your environment variables

# 4. Validate configuration
python config_validator.py

# 5. Deploy to Russian clouds
python multi_cloud_orchestrator.py

# 6. Monitor deployments
python multi_cloud_orchestrator.py --monitor

# 7. Perform health checks
python multi_cloud_orchestrator.py --health-check
```

### Integration with CI/CD
```yaml
# Example integration in GitHub Actions
- name: Deploy to Russian Clouds
  run: |
    python multi_cloud_orchestrator.py \
      --config russian-clouds-config.yml \
      --environment ${{ github.event.inputs.environment }} \
      --parallel ${{ github.event.inputs.parallel_deploy }}
```

This comprehensive configuration system provides complete integration with Russian cloud providers, including Yandex Cloud, VK Cloud, and Selectel, with automated deployment, monitoring, and compliance features.
