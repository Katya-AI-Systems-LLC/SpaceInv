## Integration Scripts

### Multi-Cloud Deployment Orchestrator
```python
# multi_cloud_orchestrator.py
import yaml
import json
import subprocess
import asyncio
from typing import Dict, List, Optional

class MultiCloudOrchestrator:
    def __init__(self, config_file: str):
        self.config = self.load_config(config_file)
        self.providers = self.config.get('providers', {})
        
    def load_config(self, config_file: str) -> Dict:
        """Load configuration from YAML file"""
        with open(config_file, 'r') as f:
            return yaml.safe_load(f)
    
    async def deploy_to_provider(self, provider: str, environment: str) -> bool:
        """Deploy to a specific cloud provider"""
        print(f"🚀 Deploying to {provider}...")
        
        try:
            if provider == "yandex":
                return await self.deploy_to_yandex(environment)
            elif provider == "vk":
                return await self.deploy_to_vk(environment)
            elif provider == "selectel":
                return await self.deploy_to_selectel(environment)
            else:
                print(f"❌ Unknown provider: {provider}")
                return False
        except Exception as e:
            print(f"❌ Deployment to {provider} failed: {e}")
            return False
    
    async def deploy_to_yandex(self, environment: str) -> bool:
        """Deploy to Yandex Cloud"""
        config = self.providers.get('yandex', {})
        
        # Setup Yandex Cloud CLI
        subprocess.run(['yc', 'config', 'profile', 'create', 'sa-profile'], check=True)
        subprocess.run(['yc', 'config', 'set', 'service-account-key', config['service_account_key']], check=True)
        subprocess.run(['yc', 'config', 'set', 'folder-id', config['folder_id']], check=True)
        
        # Deploy to storage
        bucket_name = config['storage']['bucket_name']
        subprocess.run([
            'yc', 'storage', 's3', 'cp',
            '--recursive',
            '--endpoint-url=https://storage.yandexcloud.net',
            'build/web/',
            f's3://{bucket_name}/'
        ], check=True)
        
        print(f"✅ Yandex Cloud deployment completed")
        return True
    
    async def deploy_to_vk(self, environment: str) -> bool:
        """Deploy to VK Cloud"""
        config = self.providers.get('vk', {})
        
        # Build and push Docker image
        subprocess.run(['docker', 'build', '-t', 'space-invaders:latest', '.'], check=True)
        subprocess.run(['docker', 'tag', 'space-invaders:latest', f"{config['registry']['url']}/space-invaders:latest"], check=True)
        subprocess.run(['docker', 'login', config['registry']['url'], '-u', config['account']['username'], '--password-stdin'], 
                      input=config['account']['password'].encode(), check=True)
        subprocess.run(['docker', 'push', f"{config['registry']['url']}/space-invaders:latest"], check=True)
        
        print(f"✅ VK Cloud deployment completed")
        return True
    
    async def deploy_to_selectel(self, environment: str) -> bool:
        """Deploy to Selectel"""
        config = self.providers.get('selectel', {})
        
        # Deploy to storage
        subprocess.run(['selectel-storage', 'upload',
                       '--source', 'build/web/',
                       '--destination', '/',
                       '--recursive'], check=True)
        
        print(f"✅ Selectel deployment completed")
        return True
    
    async def deploy_all(self, environment: str, parallel: bool = False) -> Dict[str, bool]:
        """Deploy to all configured providers"""
        providers = list(self.providers.keys())
        results = {}
        
        if parallel:
            # Deploy to all providers in parallel
            tasks = [self.deploy_to_provider(provider, environment) for provider in providers]
            results_list = await asyncio.gather(*tasks)
            results = dict(zip(providers, results_list))
        else:
            # Deploy to providers sequentially
            for provider in providers:
                results[provider] = await self.deploy_to_provider(provider, environment)
        
        return results
    
    async def health_check_provider(self, provider: str) -> bool:
        """Perform health check on a specific provider"""
        try:
            if provider == "yandex":
                url = f"https://{self.providers['yandex']['storage']['bucket_name']}.storage.yandexcloud.net/health"
            elif provider == "vk":
                url = "https://space-invaders.vkcloud.com/health"
            elif provider == "selectel":
                url = f"https://{self.providers['selectel']['storage']['container_name']}.selcdn.ru/health"
            else:
                return False
            
            response = subprocess.run(['curl', '-f', url], capture_output=True, text=True)
            return response.returncode == 0
        except Exception:
            return False
    
    async def health_check_all(self) -> Dict[str, bool]:
        """Perform health checks on all providers"""
        results = {}
        for provider in self.providers.keys():
            results[provider] = await self.health_check_provider(provider)
        return results
    
    def generate_deployment_report(self, results: Dict[str, bool]) -> Dict:
        """Generate deployment report"""
        return {
            "deployment": {
                "timestamp": datetime.utcnow().isoformat(),
                "providers": results,
                "success_count": sum(results.values()),
                "total_count": len(results),
                "overall": "success" if all(results.values()) else "partial" if any(results.values()) else "failed"
            }
        }

# Usage example
async def main():
    orchestrator = MultiCloudOrchestrator('russian-clouds-config.yml')
    
    # Deploy to all providers in parallel
    results = await orchestrator.deploy_all('production', parallel=True)
    
    # Generate report
    report = orchestrator.generate_deployment_report(results)
    print(json.dumps(report, indent=2))
    
    # Perform health checks
    health_results = await orchestrator.health_check_all()
    print(f"Health check results: {health_results}")

if __name__ == "__main__":
    asyncio.run(main())
```

### Configuration Validator
```python
# config_validator.py
import yaml
import json
from typing import Dict, List, Optional
from dataclasses import dataclass

@dataclass
class ValidationResult:
    valid: bool
    errors: List[str]
    warnings: List[str]

class RussianCloudConfigValidator:
    def __init__(self):
        self.required_fields = {
            'yandex': ['folder_id', 'service_account_key', 'bucket_name'],
            'vk': ['username', 'password', 'token', 'project_id'],
            'selectel': ['username', 'password', 'container_name']
        }
    
    def validate_config(self, config_file: str) -> ValidationResult:
        """Validate Russian Cloud configuration"""
        try:
            with open(config_file, 'r') as f:
                config = yaml.safe_load(f)
        except Exception as e:
            return ValidationResult(False, [f"Failed to load config: {e}"], [])
        
        errors = []
        warnings = []
        
        # Validate each provider
        for provider, required_fields in self.required_fields.items():
            if provider in config.get('providers', {}):
                provider_config = config['providers'][provider]
                
                # Check required fields
                for field in required_fields:
                    if field not in provider_config:
                        errors.append(f"{provider}: Missing required field '{field}'")
                
                # Check for sensitive data in plain text
                for field in ['password', 'token', 'service_account_key']:
                    if field in provider_config and isinstance(provider_config[field], str):
                        if len(provider_config[field]) > 10 and not provider_config[field].startswith('${'):
                            warnings.append(f"{provider}: Field '{field}' appears to be in plain text")
        
        # Validate global configuration
        global_config = config.get('global', {})
        
        if 'application' not in global_config:
            errors.append("Missing global application configuration")
        
        if 'monitoring' not in global_config:
            warnings.append("Missing global monitoring configuration")
        
        if 'security' not in global_config:
            warnings.append("Missing global security configuration")
        
        return ValidationResult(len(errors) == 0, errors, warnings)

# Usage example
def main():
    validator = RussianCloudConfigValidator()
    result = validator.validate_config('russian-clouds-config.yml')
    
    if result.valid:
        print("✅ Configuration is valid")
    else:
        print("❌ Configuration has errors:")
        for error in result.errors:
            print(f"  - {error}")
    
    if result.warnings:
        print("⚠️ Configuration has warnings:")
        for warning in result.warnings:
            print(f"  - {warning}")

if __name__ == "__main__":
    main()
```

