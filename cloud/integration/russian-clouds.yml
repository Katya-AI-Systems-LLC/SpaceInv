```

### VK Cloud Database
```yaml
# vk-cloud-database.yml
name: Deploy to VK Cloud Database
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup VK Cloud CLI
        run: |
          curl -sSL https://vk.com/cloud/cli/install.sh | bash
          echo 'export PATH=$PATH:$HOME/vk-cloud/bin' >> $HOME/.bashrc
          source $HOME/.bashrc

      - name: Configure VK Cloud
        run: |
          vk-cloud auth login \
            --token ${{ secrets.VK_CLOUD_TOKEN }} \
            --project-id ${{ secrets.VK_CLOUD_PROJECT_ID }}

      - name: Deploy Database Schema
        run: |
          vk-cloud database create \
            --name space-invaders-db \
            --engine postgres \
            --size small \
            --version 15

      - name: Run Migrations
        run: |
          vk-cloud database execute \
            --name space-invaders-db \
            --file migrations/schema.sql
```

## Selectel Integration

### Selectel Cloud Storage
```yaml
# selectel-storage.yml
name: Deploy to Selectel Cloud Storage
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build Web App
        run: |
          flutter build web --web-renderer canvaskit --release

      - name: Upload to Selectel Storage
        run: |
          pip install selectel-storage-cli
          mkdir -p ~/.config/selectel
          cat > ~/.config/selectel/config.yaml << EOF
          auth_url: https://api.selcdn.ru
          username: ${{ secrets.SELECTEL_USERNAME }}
          password: ${{ secrets.SELECTEL_PASSWORD }}
          container_name: ${{ secrets.SELECTEL_CONTAINER }}
          EOF
          
          selectel-storage upload \
            --source build/web/ \
            --destination / \
            --recursive

      - name: Setup CDN
        run: |
          curl -X POST "https://api.selcdn.ru/v1/containers/${{ secrets.SELECTEL_CONTAINER }}/cdn/invalidate" \
            -H "X-Auth-Token: ${{ secrets.SELECTEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"paths": ["/*"]}'
```

### Selectel Cloud Servers
```yaml
# selectel-servers.yml
name: Deploy to Selectel Cloud Servers
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.5.0
        with:
          ssh-private-key: ${{ secrets.SELECTEL_SSH_KEY }}

      - name: Deploy to Server
        run: |
          ssh ${{ secrets.SELECTEL_SSH_USER }}@${{ secrets.SELECTEL_SERVER_IP }} << 'EOF'
            cd /var/www/space-invaders
            git pull origin main
            flutter pub get
            flutter build web --web-renderer canvaskit --release
            sudo systemctl reload nginx
          EOF

      - name: Health Check
        run: |
          curl -f https://${{ secrets.SELECTEL_SERVER_IP }}/health || exit 1
```

## Mail.Ru Integration

### Mail.Ru Cloud Storage
```yaml
# mailru-cloud-storage.yml
name: Deploy to Mail.Ru Cloud Storage
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build Web App
        run: |
          flutter build web --web-renderer canvaskit --release

      - name: Upload to Mail.Ru Cloud
        run: |
          curl -X PUT "https://cloud.mail.ru/api/v1/storage/file" \
            -H "Authorization: Bearer ${{ secrets.MAILRU_TOKEN }}" \
            -H "X-Storage-Name: ${{ secrets.MAILRU_STORAGE_NAME }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @build/web/index.html \
            --data-binary @build/web/main.dart.js
```

