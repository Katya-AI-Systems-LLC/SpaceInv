# Russian Cloud Integration Templates for Space Invaders Enhanced Edition

## Yandex Cloud Integration

### Yandex Cloud Functions
```yaml
# yandex-cloud-function.yml
name: Deploy to Yandex Cloud Functions
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo 'export PATH=$PATH:$HOME/yandex-cloud/bin' >> $HOME/.bashrc
          source $HOME/.bashrc

      - name: Configure Yandex Cloud
        run: |
          yc config profile create sa-profile
          yc config set service-account-key ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Build Function
        run: |
          npm run build:function

      - name: Deploy Function
        run: |
          yc serverless function create \
            --name space-invaders-function \
            --runtime nodejs16 \
            --entrypoint index.js \
            --memory 512m \
            --execution-timeout 10s

      - name: Update Function Code
        run: |
          yc serverless function version create \
            --function-name space-invaders-function \
            --runtime nodejs16 \
            --entrypoint index.js \
            --memory 512m \
            --execution-timeout 10s \
            --source-path build/
```

### Yandex Cloud Storage
```yaml
# yandex-cloud-storage.yml
name: Deploy to Yandex Cloud Storage
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo 'export PATH=$PATH:$HOME/yandex-cloud/bin' >> $HOME/.bashrc
          source $HOME/.bashrc

      - name: Configure Yandex Cloud
        run: |
          yc config profile create sa-profile
          yc config set service-account-key ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Build Web App
        run: |
          flutter build web --web-renderer canvaskit --release

      - name: Deploy to Storage
        run: |
          yc storage s3 cp --recursive build/web/ s3://${{ secrets.YC_BUCKET_NAME }}/ --endpoint-url=https://storage.yandexcloud.net

      - name: Setup CDN
        run: |
          yc cdn cache invalidate --folder-id ${{ secrets.YC_FOLDER_ID }} --path "/*"
```

### Yandex Cloud API Gateway
```yaml
# yandex-cloud-api-gateway.yml
name: Deploy to Yandex Cloud API Gateway
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo 'export PATH=$PATH:$HOME/yandex-cloud/bin' >> $HOME/.bashrc
          source $HOME/.bashrc

      - name: Configure Yandex Cloud
        run: |
          yc config profile create sa-profile
          yc config set service-account-key ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}

      - name: Deploy API Gateway
        run: |
          yc api-gateway create \
            --name space-invaders-api \
            --spec 'openapi: 3.0.0\ninfo:\n  title: Space Invaders API\n  version: 1.0.0\npaths:\n  /api/health:\n    get:\n      x-yc-apigateway-integration:\n        type: cloud_function\n        function_id: space-invaders-function'

      - name: Update Gateway
        run: |
          yc api-gateway update \
            --name space-invaders-api \
            --spec 'openapi: 3.0.0\ninfo:\n  title: Space Invaders API\n  version: 1.0.0\npaths:\n  /api/health:\n    get:\n      x-yc-apigateway-integration:\n        type: cloud_function\n        function_id: space-invaders-function'
```

## VK Cloud Integration

### VK Cloud Container Registry
```yaml
# vk-cloud-registry.yml
name: Deploy to VK Cloud Container Registry
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to VK Cloud Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.VK_CLOUD_REGISTRY }}
          username: ${{ secrets.VK_CLOUD_USERNAME }}
          password: ${{ secrets.VK_CLOUD_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.VK_CLOUD_REGISTRY }}/space-invaders:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VK Cloud
        run: |
          curl -X POST "$VK_CLOUD_DEPLOY_URL" -H "Authorization: Bearer $VK_CLOUD_TOKEN" -d '{"image":"${{ secrets.VK_CLOUD_REGISTRY }}/space-invaders:latest"}'
```

