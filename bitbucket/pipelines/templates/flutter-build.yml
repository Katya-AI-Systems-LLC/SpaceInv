# Bitbucket Pipelines Templates for Space Invaders Enhanced Edition

# Flutter Build Template
pipelines:
  default:
    - step:
        name: 'Flutter Build and Test'
        image: cirrusci/flutter:3.16.0
        caches:
          - flutter
          - gradle
        script:
          - flutter channel stable
          - flutter upgrade
          - flutter pub get
          - flutter analyze
          - flutter test --coverage
          - flutter build web --web-renderer canvaskit --release
        artifacts:
          - build/web/**
          - coverage/**
        services:
          - docker
        after-script:
          - pipe: atlassian/slack-notify:0.3.0
            variables:
              WEBHOOK_URL: $SLACK_WEBHOOK_URL
              MESSAGE: 'Build completed for $BITBUCKET_COMMIT'

  branches:
    main:
      - step:
          name: 'Production Build'
          image: cirrusci/flutter:3.16.0
          caches:
            - flutter
            - gradle
          script:
            - flutter channel stable
            - flutter upgrade
            - flutter pub get
            - flutter analyze
            - flutter test --coverage
            - flutter build web --web-renderer canvaskit --release
            - flutter build apk --release
            - flutter build appbundle --release
          artifacts:
            - build/web/**
            - build/app/outputs/flutter-apk/**
            - build/app/outputs/bundle/**
            - coverage/**
          services:
            - docker
          after-script:
            - pipe: atlassian/slack-notify:0.3.0
              variables:
                WEBHOOK_URL: $SLACK_WEBHOOK_URL
                MESSAGE: 'Production build completed for $BITBUCKET_COMMIT'
      - step:
          name: 'Deploy to Production'
          image: alpine:latest
          deployment: production
          script:
            - echo "Deploying to production environment"
            - apk add --no-cache curl
            - curl -X POST "$PRODUCTION_DEPLOY_URL" -H "Authorization: Bearer $DEPLOY_TOKEN"
          after-script:
            - pipe: atlassian/slack-notify:0.3.0
              variables:
                WEBHOOK_URL: $SLACK_WEBHOOK_URL
                MESSAGE: 'Deployed to production: $BITBUCKET_COMMIT'

    develop:
      - step:
          name: 'Development Build'
          image: cirrusci/flutter:3.16.0
          caches:
            - flutter
            - gradle
          script:
            - flutter channel stable
            - flutter upgrade
            - flutter pub get
            - flutter analyze
            - flutter test --coverage
            - flutter build web --web-renderer canvaskit --release
          artifacts:
            - build/web/**
            - coverage/**
          services:
            - docker
          after-script:
            - pipe: atlassian/slack-notify:0.3.0
              variables:
                WEBHOOK_URL: $SLACK_WEBHOOK_URL
                MESSAGE: 'Development build completed for $BITBUCKET_COMMIT'
      - step:
          name: 'Deploy to Staging'
          image: alpine:latest
          deployment: staging
          script:
            - echo "Deploying to staging environment"
            - apk add --no-cache curl
            - curl -X POST "$STAGING_DEPLOY_URL" -H "Authorization: Bearer $DEPLOY_TOKEN"
          after-script:
            - pipe: atlassian/slack-notify:0.3.0
              variables:
                WEBHOOK_URL: $SLACK_WEBHOOK_URL
                MESSAGE: 'Deployed to staging: $BITBUCKET_COMMIT'

  pull-requests:
    - step:
        name: 'PR Build and Test'
        image: cirrusci/flutter:3.16.0
        caches:
          - flutter
          - gradle
        script:
          - flutter channel stable
          - flutter upgrade
          - flutter pub get
          - flutter analyze
          - flutter test --coverage
          - flutter build web --web-renderer canvaskit --release
        artifacts:
          - build/web/**
          - coverage/**
        services:
          - docker
        after-script:
          - pipe: atlassian/slack-notify:0.3.0
              variables:
                WEBHOOK_URL: $SLACK_WEBHOOK_URL
                MESSAGE: 'PR build completed for $BITBUCKET_PR_ID'
    - step:
        name: 'Security Scan'
        image: owasp/zap2docker-stable
        script:
          - mkdir -p /zap/wrk/
          - /zap/zap-baseline.py -t build/web/ -J gl-sast-report.json || true
        artifacts:
          - gl-sast-report.json
        after-script:
          - pipe: atlassian/slack-notify:0.3.0
              variables:
                WEBHOOK_URL: $SLACK_WEBHOOK_URL
                MESSAGE: 'Security scan completed for $BITBUCKET_PR_ID'

# Custom Templates
definitions:
  caches:
    flutter:
      key: flutter-$BITBUCKET_COMMIT
      paths:
        - .flutter/
        - .pub-cache/
    gradle:
      key: gradle-$BITBUCKET_COMMIT
      paths:
        - android/.gradle/
        - android/.gradle/wrapper/
        - android/gradlew
        - android/gradlew.bat

  services:
    docker:
      image: docker:20.10.16

  scripts:
    - &setup-flutter |
      flutter channel stable
      flutter upgrade
      flutter pub get
    - &build-web |
      flutter build web --web-renderer canvaskit --release
    - &build-android |
      flutter build apk --release
      flutter build appbundle --release
    - &test-flutter |
      flutter analyze
      flutter test --coverage
    - &notify-slack |
      pipe: atlassian/slack-notify:0.3.0
        variables:
          WEBHOOK_URL: $SLACK_WEBHOOK_URL
          MESSAGE: '$BITBUCKET_PIPELINE_STATE: $BITBUCKET_COMMIT'

# Security Pipeline
security-scan:
  - step:
      name: 'Security Scan'
      image: owasp/zap2docker-stable
      script:
        - mkdir -p /zap/wrk/
        - /zap/zap-baseline.py -t build/web/ -J gl-sast-report.json || true
      artifacts:
        - gl-sast-report.json
      services:
        - docker
      after-script:
        - pipe: atlassian/slack-notify:0.3.0
          variables:
            WEBHOOK_URL: $SLACK_WEBHOOK_URL
            MESSAGE: 'Security scan completed'

# Performance Pipeline
performance-test:
  - step:
      name: 'Performance Test'
      image: cirrusci/flutter:3.16.0
      caches:
        - flutter
      script:
        - *setup-flutter
        - *build-web
        - python3 scripts/performance_analyzer.py build/web/
      artifacts:
        - performance-results.json
        - performance-report.html
      services:
        - docker
      after-script:
        - pipe: atlassian/slack-notify:0.3.0
          variables:
            WEBHOOK_URL: $SLACK_WEBHOOK_URL
            MESSAGE: 'Performance test completed'

# Accessibility Pipeline
accessibility-test:
  - step:
      name: 'Accessibility Test'
      image: cirrusci/flutter:3.16.0
      caches:
        - flutter
      script:
        - *setup-flutter
        - *build-web
        - npm install -g axe-cli
        - axe build/web/ --tags wcag2a,wcag2aa
      artifacts:
        - accessibility-report.json
        - accessibility-report.html
      services:
        - docker
      after-script:
        - pipe: atlassian/slack-notify:0.3.0
          variables:
            WEBHOOK_URL: $SLACK_WEBHOOK_URL
            MESSAGE: 'Accessibility test completed'

# Multi-Platform Build Pipeline
multi-platform:
  - parallel:
      - step:
          name: 'Web Build'
          image: cirrusci/flutter:3.16.0
          caches:
            - flutter
          script:
            - *setup-flutter
            - *build-web
          artifacts:
            - build/web/**
          after-script:
            - pipe: atlassian/slack-notify:0.3.0
              variables:
                WEBHOOK_URL: $SLACK_WEBHOOK_URL
                MESSAGE: 'Web build completed'

      - step:
          name: 'Android Build'
          image: cirrusci/flutter:3.16.0
          caches:
            - flutter
            - gradle
          script:
            - *setup-flutter
            - *build-android
          artifacts:
            - build/app/outputs/flutter-apk/**
            - build/app/outputs/bundle/**
          after-script:
            - pipe: atlassian/slack-notify:0.3.0
              variables:
                WEBHOOK_URL: $SLACK_WEBHOOK_URL
                MESSAGE: 'Android build completed'

      - step:
          name: 'Windows Build'
          image: cirrusci/flutter:3.16.0
          caches:
            - flutter
          script:
            - *setup-flutter
            - flutter config --enable-windows-desktop
            - flutter build windows --release
          artifacts:
            - build/windows/runner/Release/**
          after-script:
            - pipe: atlassian/slack-notify:0.3.0
              variables:
                WEBHOOK_URL: $SLACK_WEBHOOK_URL
                MESSAGE: 'Windows build completed'

# Release Pipeline
release:
  - step:
      name: 'Release Build'
      image: cirrusci/flutter:3.16.0
      caches:
        - flutter
        - gradle
      script:
        - *setup-flutter
        - *test-flutter
        - *build-web
        - *build-android
        - flutter config --enable-windows-desktop
        - flutter build windows --release
      artifacts:
        - build/web/**
        - build/app/outputs/flutter-apk/**
        - build/app/outputs/bundle/**
        - build/windows/runner/Release/**
        - coverage/**
      services:
        - docker
      after-script:
        - pipe: atlassian/slack-notify:0.3.0
          variables:
            WEBHOOK_URL: $SLACK_WEBHOOK_URL
            MESSAGE: 'Release build completed'

  - step:
      name: 'Create Release'
      image: alpine:latest
      script:
        - apk add --no-cache curl jq
        - VERSION=${BITBUCKET_TAG#v}
        - echo "Creating release $VERSION"
        - curl -X POST "$RELEASE_API_URL" -H "Authorization: Bearer $API_TOKEN" -H "Content-Type: application/json" -d "{\"tag_name\":\"$BITBUCKET_TAG\",\"name\":\"Release $VERSION\",\"description\":\"Release $VERSION of Space Invaders Enhanced Edition\"}"
      after-script:
        - pipe: atlassian/slack-notify:0.3.0
          variables:
            WEBHOOK_URL: $SLACK_WEBHOOK_URL
            MESSAGE: 'Release created: $BITBUCKET_TAG'

# Deployment Pipeline
deploy:
  - step:
      name: 'Deploy to Production'
      image: alpine:latest
      deployment: production
      script:
        - echo "Deploying to production environment"
        - apk add --no-cache curl
        - curl -X POST "$PRODUCTION_DEPLOY_URL" -H "Authorization: Bearer $DEPLOY_TOKEN"
      after-script:
        - pipe: atlassian/slack-notify:0.3.0
          variables:
            WEBHOOK_URL: $SLACK_WEBHOOK_URL
            MESSAGE: 'Deployed to production'

# Notification Pipeline
notify:
  - step:
      name: 'Send Notifications'
      image: alpine:latest
      script:
        - echo "Sending notifications"
        - curl -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"text\":\"Pipeline $BITBUCKET_PIPELINE_SOURCE for $BITBUCKET_BRANCH completed with status: $BITBUCKET_PIPELINE_STATE\"}"
        - curl -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"content\":\"Pipeline $BITBUCKET_PIPELINE_SOURCE for $BITBUCKET_BRANCH completed with status: $BITBUCKET_PIPELINE_STATE\"}"
      after-script:
        - pipe: atlassian/slack-notify:0.3.0
          variables:
            WEBHOOK_URL: $SLACK_WEBHOOK_URL
            MESSAGE: 'Pipeline completed'

# Cleanup Pipeline
cleanup:
  - step:
      name: 'Cleanup'
      image: alpine:latest
      script:
        - echo "Cleaning up artifacts"
        - echo "Cleaning up temporary files"
      after-script:
        - pipe: atlassian/slack-notify:0.3.0
          variables:
            WEBHOOK_URL: $SLACK_WEBHOOK_URL
            MESSAGE: 'Cleanup completed'

# Integration Test Pipeline
integration-test:
  - step:
      name: 'Integration Tests'
      image: cirrusci/flutter:3.16.0
      caches:
        - flutter
      script:
        - *setup-flutter
        - *build-web
        - flutter test integration_test/
      artifacts:
        - integration-test-results.json
      services:
        - docker
      after-script:
        - pipe: atlassian/slack-notify:0.3.0
          variables:
            WEBHOOK_URL: $SLACK_WEBHOOK_URL
            MESSAGE: 'Integration tests completed'

# Code Quality Pipeline
code-quality:
  - step:
      name: 'Code Quality Check'
      image: cirrusci/flutter:3.16.0
      caches:
        - flutter
      script:
        - *setup-flutter
        - flutter analyze
        - dart format --set-exit-if-changed .
        - dart analyze --fatal-infos .
      after-script:
        - pipe: atlassian/slack-notify:0.3.0
          variables:
            WEBHOOK_URL: $SLACK_WEBHOOK_URL
            MESSAGE: 'Code quality check completed'

# Documentation Pipeline
documentation:
  - step:
      name: 'Generate Documentation'
      image: cirrusci/flutter:3.16.0
      caches:
        - flutter
      script:
        - *setup-flutter
        - dart doc
        - dart doc --format=html
      artifacts:
        - doc/api/**
      after-script:
        - pipe: atlassian/slack-notify:0.3.0
          variables:
            WEBHOOK_URL: $SLACK_WEBHOOK_URL
            MESSAGE: 'Documentation generated'

# Backup Pipeline
backup:
  - step:
      name: 'Backup Repository'
      image: alpine:latest
      script:
        - echo "Creating backup"
        - tar -czf backup-$BITBUCKET_COMMIT_SHORT.tar.gz .
        - curl -X POST "$BACKUP_URL" -F "backup-$BITBUCKET_COMMIT_SHORT.tar.gz"
      artifacts:
        - backup-$BITBUCKET_COMMIT_SHORT.tar.gz
      after-script:
        - pipe: atlassian/slack-notify:0.3.0
          variables:
            WEBHOOK_URL: $SLACK_WEBHOOK_URL
            MESSAGE: 'Backup created'

# Health Check Pipeline
health-check:
  - step:
      name: 'Health Check'
      image: alpine:latest
      script:
        - echo "Performing health check"
        - curl -f https://space-invaders.com/health || exit 1
        - curl -f https://api.space-invaders.com/health || exit 1
      after-script:
        - pipe: atlassian/slack-notify:0.3.0
          variables:
            WEBHOOK_URL: $SLACK_WEBHOOK_URL
            MESSAGE: 'Health check completed'

# Monitoring Pipeline
monitoring:
  - step:
      name: 'Monitoring Check'
      image: alpine:latest
      script:
        - echo "Checking monitoring metrics"
        - curl -f https://monitoring.space-invaders.com/metrics || exit 1
        - curl -f https://logs.space-invaders.com/health || exit 1
      after-script:
        - pipe: atlassian/slack-notify:0.3.0
          variables:
            WEBHOOK_URL: $SLACK_WEBHOOK_URL
            MESSAGE: 'Monitoring check completed'
