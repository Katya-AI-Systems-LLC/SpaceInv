stages:
  - test
  - build
  - deploy

variables:
  FLUTTER_VERSION: "3.10.0"

before_script:
  - apt update
  - apt install -y curl unzip
  - curl -L https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz | tar -xJ -C /opt
  - export PATH="$PATH:/opt/flutter/bin"
  - flutter doctor
  - flutter pub get

test:
  stage: test
  script:
    - flutter test
  artifacts:
    reports:
      junit: build/reports/tests/test-results.xml

build_web:
  stage: build
  script:
    - flutter build web --release
  artifacts:
    paths:
      - build/web/

deploy_pages:
  stage: deploy
  script:
    - echo "Deploying to GitLab Pages"
  after_script:
    - echo "Deployment finished"
  artifacts:
    paths:
      - build/web/
  only:
    - main