# Scalability Testing
scalability-testing:
  stage: performance-testing
  image: python:3.11-slim
  <<: *cache_configuration
  needs: performance-setup
  artifacts:
    reports:
      junit: scalability-testing/junit.xml
    paths:
      - scalability-*.html
      - scalability-*.csv
      - scalability-test-metrics.json
    expire_in: 1 week
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  services:
    - name: docker:24.0.5-dind
      command: ["--tls=false"]
  before_script:
    - apt-get update -qq && apt-get install -y docker.io
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install locust pytest matplotlib seaborn pandas
  script:
    - echo "Starting scalability testing..."
    
    # Download test configuration
    - cp performance-setup/performance-test-config.json .
    - cp performance-setup/scalability-test-locustfile.py .
    
    # Start application services
    - docker-compose -f docker-compose.test.yml up -d
    - sleep 30
    
    # Test with different user levels
    - |
      for users in 50 100 200 500 1000; do
        echo "Testing with $users users..."
        locust -f scalability-test-locustfile.py \
          --host $(python -c "import json; print(json.load(open('performance-test-config.json'))['target_url'])") \
          --users $users \
          --spawn-rate $(python -c "import json; print(int(json.load(open('performance-test-config.json'))['concurrent_users']) // 10)") \
          --run-time 300 \
          --html scalability-report-$users.html \
          --csv scalability-results-$users.csv \
          --headless \
          --exit-code-on-error 1 || true
      done
    
    # Combine scalability results
    - |
      python scripts/performance/combine-scalability-results.py \
        --user-levels 50 100 200 500 1000 \
        --output scalability-test-results.csv
    
    # Extract metrics
    - |
      python scripts/performance/extract-locust-metrics.py \
        --csv-file scalability-test-results.csv \
        --output scalability-test-metrics.json
    
    # Stop application services
    - docker-compose -f docker-compose.test.yml down
  rules:
    - if: $TEST_TYPE == "scalability"
    - when: manual
      allow_failure: true

# Performance Analysis
performance-analysis:
  stage: performance-analysis
  image: python:3.11-slim
  <<: *cache_configuration
  needs: [load-testing, stress-testing, spike-testing, endurance-testing, scalability-testing]
  artifacts:
    reports:
      junit: performance-analysis/junit.xml
    paths:
      - performance-analysis.json
      - performance-summary.json
      - performance-report.html
      - performance-report.pdf
    expire_in: 3 months
  before_script:
    - apt-get update -qq && apt-get install -y git
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install matplotlib seaborn pandas jinja2 weasyprint
    - pip install -r requirements.txt || true
  script:
    - echo "Analyzing performance results..."
    
    # Download all test results
    - mkdir -p test-results
    - cp load-testing/* test-results/ 2>/dev/null || true
    - cp stress-testing/* test-results/ 2>/dev/null || true
    - cp spike-testing/* test-results/ 2>/dev/null || true
    - cp endurance-testing/* test-results/ 2>/dev/null || true
    - cp scalability-testing/* test-results/ 2>/dev/null || true
    
    # Analyze performance results
    - |
      python scripts/performance/analyze-performance-results.py \
        --results-dir test-results/ \
        --test-type $TEST_TYPE \
        --output performance-analysis.json
    
    # Generate summary
    - |
      python scripts/performance/generate-performance-summary.py \
        --analysis-file performance-analysis.json \
        --output performance-summary.json
    
    # Generate performance report
    - |
      python scripts/performance/generate-performance-report.py \
        --analysis-file performance-analysis.json \
        --template templates/performance-report.html \
        --output performance-report.html
    
    # Generate PDF report
    - |
      python scripts/performance/generate-pdf-report.py \
        --html-file performance-report.html \
        --output performance-report.pdf
  rules:
    - if: $CREATE_REPORT == "true"
    - when: manual
      allow_failure: true

# Performance Gate
performance-gate:
  stage: performance-gate
  image: python:3.11-slim
  <<: *cache_configuration
  needs: [performance-analysis]
  before_script:
    - apt-get update -qq && apt-get install -y git
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install -r requirements.txt || true
  script:
    - echo "Evaluating performance gate..."
    
    # Download performance analysis
    - cp performance-analysis/performance-analysis.json .
    - cp performance-setup/performance-thresholds.json .
    
    # Evaluate performance gate
    - |
      python scripts/performance/evaluate-performance-gate.py \
        --analysis-file performance-analysis.json \
        --thresholds performance-thresholds.json \
        --output performance-gate-result.json
    
    # Check gate result
    - |
      GATE_STATUS=$(python -c "import json; print(json.load(open('performance-gate-result.json')).get('gate_status', 'FAILED'))")
      if [ "$GATE_STATUS" != "PASSED" ]; then
        echo "Performance gate failed!"
        cat performance-gate-result.json
        exit 1
      fi
      
      echo "Performance gate passed!"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual

# Notification
notification:
  stage: notification
  image: alpine:latest
  needs: [performance-analysis, performance-gate]
  if: always()
  before_script:
    - apk add --no-cache curl jq
  script:
    - echo "Sending performance notifications..."
    
    # Download performance results
    - mkdir -p performance-results
    - cp performance-analysis/* performance-results/ 2>/dev/null || true
    - cp performance-gate/* performance-results/ 2>/dev/null || true
    
    # Extract metrics
    - |
      TOTAL_VULNS=$(python -c "import json; print(json.load(open('performance-results/performance-summary.json')).get('total_vulnerabilities', 0))" || echo "0")
      CRITICAL_VULNS=$(python -c "import json; print(json.load(open('performance-results/performance-summary.json')).get('critical_vulnerabilities', 0))" || echo "0")
      COMPLIANCE_STATUS=$(python -c "import json; print(json.load(open('performance-results/performance-summary.json')).get('compliance_status', 'FAILED'))" || echo "FAILED")
      GATE_STATUS=$(python -c "import json; print(json.load(open('performance-results/performance-gate-result.json')).get('gate_status', 'FAILED'))" || echo "FAILED")
    
    # Send Slack notification
    - |
      curl -X POST -H 'Content-type: application/json' \
        --data "{\"text\":\"Performance Test Results ($TEST_TYPE):\n- Environment: $ENVIRONMENT\n- Concurrent Users: $CONCURRENT_USERS\n- Test Duration: $TEST_DURATIONs\n- Performance Gate: $GATE_STATUS\"}" \
        "$SLACK_PERFORMANCE_WEBHOOK" || true
    
    # Send email notification
    - |
      curl -X POST "https://api.mailgun.net/v3/$MAILGUN_DOMAIN/messages" \
        -F "from=GitLab CI/CD <ci@$MAILGUN_DOMAIN>" \
        -F "to=$PERFORMANCE_EMAIL" \
        -F "subject=Performance Test Results - $CI_PROJECT_NAME" \
        -F "text=Performance Test Results ($TEST_TYPE):\n\nRepository: $CI_PROJECT_NAME\nBranch: $CI_COMMIT_REF_NAME\nCommit: $CI_COMMIT_SHA\n\nTest Configuration:\n- Environment: $ENVIRONMENT\n- Test Type: $TEST_TYPE\n- Concurrent Users: $CONCURRENT_USERS\n- Test Duration: $TEST_DURATIONs\n- Ramp Up Time: $RAMP_UP_TIMEs\n\nResults:\n- Performance Gate: $GATE_STATUS\n\nReports are available in the artifacts." \
        -F "api-key=$MAILGUN_API_KEY" || true
    
    # Create performance issue if gate failed
    - |
      if [ "$GATE_STATUS" != "PASSED" ]; then
        curl -X POST "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/issues" \
          -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"title\": \"Performance Gate Failed - $(date -u +%Y-%m-%dT%H:%M:%SZ)\",
            \"description\": \"## Performance Gate Failed\n\n**Repository**: $CI_PROJECT_NAME\n**Branch**: $CI_COMMIT_REF_NAME\n**Commit**: $CI_COMMIT_SHA\n\n### Test Configuration:\n- **Test Type**: $TEST_TYPE\n- **Environment**: $ENVIRONMENT\n- **Concurrent Users**: $CONCURRENT_USERS\n- **Test Duration**: $TEST_DURATIONs\n- **Ramp Up Time**: $RAMP_UP_TIMEs\n\n### Performance Results:\n- **Total Vulnerabilities**: $TOTAL_VULNS\n- **Critical Vulnerabilities**: $CRITICAL_VULNS\n- **Compliance Status**: $COMPLIANCE_STATUS\n\n### Gate Results:\n\`\`\`json\n$(cat performance-gate-result.json)\n\`\`\`\n\n### Action Required:\nPlease review the performance results and address the performance issues before merging.\n\n**Performance Reports**: Available in the pipeline artifacts.\",
            \"labels\": [\"performance\", \"scalability\", \"high-priority\"]
          }" || true
      fi
  rules:
    - if: always()
  when: manual
      allow_failure: true
