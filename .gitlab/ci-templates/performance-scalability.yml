# Spike Testing
spike-testing:
  stage: performance-testing
  image: python:3.11-slim
  <<: *cache_configuration
  needs: performance-setup
  artifacts:
    reports:
      junit: spike-testing/junit.xml
    paths:
      - spike-*.html
      - spike-*.csv
      - spike-test-metrics.json
    expire_in: 1 week
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  services:
    - name: docker:24.0.5-dind
      command: ["--tls=false"]
  before_script:
    - apt-get update -qq && apt-get install -y docker.io
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install locust pytest matplotlib seaborn pandas
  script:
    - echo "Starting spike testing..."
    
    # Download test configuration
    - cp performance-setup/performance-test-config.json .
    - cp performance-setup/spike-test-locustfile.py .
    
    # Start application services
    - docker-compose -f docker-compose.test.yml up -d
    - sleep 30
    
    # Run spike test with varying user count
    - |
      echo "Starting baseline load..."
      locust -f spike-test-locustfile.py \
        --host $(python -c "import json; print(json.load(open('performance-test-config.json'))['target_url'])") \
        --users 50 \
        --spawn-rate 10 \
        --run-time 60 \
        --html spike-baseline.html \
        --csv spike-baseline.csv \
        --headless \
        --exit-code-on-error 1 || true
      
      echo "Starting spike load..."
      SPIKE_USERS=$(python -c "import json; print(int(json.load(open('performance-test-config.json'))['concurrent_users']) * 3)")
      locust -f spike-test-locustfile.py \
        --host $(python -c "import json; print(json.load(open('performance-test-config.json'))['target_url'])") \
        --users $SPIKE_USERS \
        --spawn-rate $(python -c "import json; print(json.load(open('performance-test-config.json'))['concurrent_users'])") \
        --run-time 120 \
        --html spike-spike.html \
        --csv spike-spike.csv \
        --headless \
        --exit-code-on-error 1 || true
      
      echo "Returning to baseline..."
      locust -f spike-test-locustfile.py \
        --host $(python -c "import json; print(json.load(open('performance-test-config.json'))['target_url'])") \
        --users 50 \
        --spawn-rate 10 \
        --run-time 60 \
        --html spike-recovery.html \
        --csv spike-recovery.csv \
        --headless \
        --exit-code-on-error 1 || true
      
      # Combine results
      - |
        python scripts/performance/combine-spike-results.py \
          --baseline-file spike-baseline.csv \
          --spike-file spike-spike.csv \
          --recovery-file spike-recovery.csv \
          --output spike-test-results.csv
      
      # Extract metrics
      - |
        python scripts/performance/extract-locust-metrics.py \
          --csv-file spike-test-results.csv \
          --output spike-test-metrics.json
    
    # Stop application services
    - docker-compose -f docker-compose.test.yml down
  rules:
    - if: $TEST_TYPE == "spike"
    - when: manual
      allow_failure: true

