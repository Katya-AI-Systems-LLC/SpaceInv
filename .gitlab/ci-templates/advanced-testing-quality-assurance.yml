      --junitxml=selectel-integration-results.xml \
      --html=selectel-integration-report.html \
      --self-contained-html \
      --tb=short \
      -v
    
    # Test multi-cloud orchestration
    - echo "🎼 Testing multi-cloud orchestration..."
