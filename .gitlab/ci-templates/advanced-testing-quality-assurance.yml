      - russian-cloud-integration-report.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Performance and Load Testing Pipeline
performance-load-testing:
  stage: test
  image: python:3.11
  services:
    - postgres:15
    - redis:7
  variables:
    POSTGRES_DB: space_invaders_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/space_invaders_test"
    REDIS_URL: "redis://redis:6379"
  before_script:
    - pip install locust pytest pytest-asyncio
    - pip install httpx aiohttp
    - pip install -r requirements.txt
    - npm install -g lighthouse
  script:
    - echo "⚡ Starting performance and load testing..."
    
    # Wait for services
    - until pg_isready -h postgres -p 5432 -U postgres; do
        echo "Waiting for PostgreSQL..."
        sleep 2
      done
    - until redis-cli -h redis ping; do
        echo "Waiting for Redis..."
        sleep 2
      done
    
    # Setup test environment
    - export DATABASE_URL=$DATABASE_URL
    - export REDIS_URL=$REDIS_URL
    
    # Start application
    - echo "🚀 Starting application for performance testing..."
    - uvicorn api.main:app --host 0.0.0.0 --port 8000 &
    - sleep 10
    
    # Build web application
    - echo "🌐 Building web application for performance testing..."
    - flutter build web --release
    
    # Start web server
    - cd build/web && python -m http.server 8080 &
    - sleep 5
    
    # Run API load testing
    - echo "🔌 Running API load testing..."
    - locust -f tests/performance/api/locustfile.py \
      --headless \
      --users 500 \
      --spawn-rate 50 \
      --run-time 300s \
      --host http://localhost:8000 \
      --html api-load-test-report.html \
      --csv api-load-test-results.csv
    
    # Run web performance testing
    - echo "🌐 Running web performance testing..."
    - npx lighthouse http://localhost:8080 \
      --output=json \
      --output-path=web-performance-report.json \
      --chrome-flags="--headless"
    
    # Run database performance testing
    - echo "🗄️ Running database performance testing..."
    - pytest tests/performance/database/ \
      --junitxml=database-performance-results.xml \
      --html=database-performance-report.html \
      --self-contained-html \
      --tb=short \
      -v
    
    # Run mobile performance testing
    - echo "📱 Running mobile performance testing..."
    - flutter test integration_test/performance/ \
      --reporter=json \
      --reporter=html \
      --junit-report=mobile-performance-results.xml
    
    # Generate performance report
    - echo "📊 Generating performance report..."
    - python scripts/generate_performance_report.py \
      --api-results api-load-test-results.csv \
      --web-results web-performance-report.json \
      --database-results database-performance-results.xml \
      --mobile-results mobile-performance-results.xml \
      --output comprehensive-performance-report.json
  artifacts:
    reports:
      junit: comprehensive-performance-report.json
    paths:
      - api-load-test-report.html
      - api-load-test-results.csv
      - web-performance-report.json
      - database-performance-results.xml
      - database-performance-report.html
      - mobile-performance-results.xml
      - comprehensive-performance-report.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

