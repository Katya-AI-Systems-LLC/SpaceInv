      --junitxml=multi-cloud-integration-results.xml \
      --html=multi-cloud-integration-report.html \
      --self-contained-html \
      --tb=short \
      -v
    
    # Test Russian data residency
    - echo "🏛️ Testing Russian data residency compliance..."
    - pytest tests/compliance/russian_data_residency/ \
      --junitxml=russian-data-residency-results.xml \
      --html=russian-data-residency-report.html \
