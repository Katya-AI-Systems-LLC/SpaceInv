# GitLab CI/CD Templates for Space Invaders Enhanced Edition

# Code Quality and Review Automation Pipeline
code-quality-review-automation:
  stage: test
  image: python:3.11
  services:
    - postgres:15
    - redis:7
  variables:
    POSTGRES_DB: space_invaders_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/space_invaders_test"
    REDIS_URL: "redis://redis:6379"
  before_script:
    - pip install black isort flake8 mypy bandit safety
    - pip install pylint pydocstyle pycodestyle
    - pip install pre-commit gitpython requests
    - npm install -g eslint prettier jshint
    - flutter pub get
  script:
    - echo "🔍 Starting code quality and review automation..."
    
    # Code formatting checks
    - echo "📝 Checking code formatting..."
    - black --check --diff .
    - isort --check-only --diff .
    
    # Linting
    - echo "🔍 Running linting checks..."
    - flake8 --format=json --output-file=flake8-report.json .
    - pylint --output-format=json . > pylint-report.json || true
    - mypy --json-report mypy-report . || true
    
    # Security analysis
    - echo "🔒 Running security analysis..."
    - bandit -r . -f json -o bandit-quality-report.json
    - safety check --json --output safety-quality-report.json
    
    # JavaScript/TypeScript checks
    - echo "📜 Running JavaScript/TypeScript checks..."
    - eslint --format=json --output-file=eslint-report.json . || true
    - jshint --reporter=json . > jshint-report.json || true
    - prettier --check --format=json . > prettier-report.json || true
    
    # Flutter checks
    - echo "🐦 Running Flutter checks..."
    - flutter analyze --format=json > flutter-analysis.json || true
    - dart format --set-exit-if-changed .
    - flutter analyze --fatal-infos > flutter-lint-report.txt || true
    
    # Documentation checks
    - echo "📚 Checking documentation quality..."
    - pydocstyle --match='(?!test_).*\.py' . > pydocstyle-report.txt || true
    - find . -name "*.md" -exec markdownlint {} \; > markdownlint-report.txt || true
    
    # Generate comprehensive code quality report
    - echo "📊 Generating comprehensive code quality report..."
    - python scripts/generate_code_quality_report.py \
      --flake8 flake8-report.json \
      --pylint pylint-report.json \
      --mypy mypy-report/mypy-report.json \
      --bandit bandit-quality-report.json \
      --safety safety-quality-report.json \
      --eslint eslint-report.json \
      --jshint jshint-report.json \
      --prettier prettier-report.json \
      --flutter flutter-analysis.json \
      --output comprehensive-code-quality-report.json
    
    # Analyze code changes for review
    - echo "🔍 Analyzing code changes..."
    - python scripts/analyze_code_changes.py \
      --base-branch $CI_MERGE_REQUEST_TARGET_BRANCH_NAME \
      --head-branch $CI_COMMIT_REF_NAME \
      --output code-changes-analysis.json
    
    # Generate automated review comments
    - echo "💬 Generating automated review comments..."
    - python scripts/generate_automated_review.py \
      --code-changes code-changes-analysis.json \
      --quality-report comprehensive-code-quality-report.json \
      --output automated-review-comments.json
  artifacts:
    reports:
      junit: comprehensive-code-quality-report.json
    paths:
      - flake8-report.json
      - pylint-report.json
      - mypy-report/mypy-report.json
      - bandit-quality-report.json
      - safety-quality-report.json
      - eslint-report.json
      - jshint-report.json
      - prettier-report.json
      - flutter-analysis.json
      - pydocstyle-report.txt
      - markdownlint-report.txt
      - comprehensive-code-quality-report.json
      - code-changes-analysis.json
      - automated-review-comments.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Advanced Testing and Quality Assurance Pipeline
advanced-testing-quality-assurance:
  stage: test
  image: python:3.11
  services:
    - postgres:15
    - redis:7
  variables:
    POSTGRES_DB: space_invaders_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/space_invaders_test"
    REDIS_URL: "redis://redis:6379"
  before_script:
    - pip install pytest pytest-cov pytest-mock pytest-asyncio
    - pip install pytest-xdist pytest-html
    - pip install locust httpx aiohttp
    - npm install -g jest cypress lighthouse
    - flutter pub get
  script:
    - echo "🧪 Starting advanced testing and quality assurance..."
    
    # Wait for services
    - until pg_isready -h postgres -p 5432 -U postgres; do
        echo "Waiting for PostgreSQL..."
        sleep 2
      done
    - until redis-cli -h redis ping; do
        echo "Waiting for Redis..."
        sleep 2
      done
    
    # Setup test environment
    - export DATABASE_URL=$DATABASE_URL
    - export REDIS_URL=$REDIS_URL
    - export TEST_ENVIRONMENT="ci"
    
    # Run unit tests
    - echo "🔬 Running unit tests..."
    - pytest tests/unit/ \
      --cov=. \
      --cov-report=json \
      --cov-report=html \
      --cov-report=xml \
      --junitxml=python-unit-test-results.xml \
      --html=python-unit-test-report.html \
      --self-contained-html \
      --tb=short \
      -v
    
    # Run JavaScript unit tests
    - echo "📜 Running JavaScript unit tests..."
    - npm test -- --coverage --coverageReporters=json --coverageReporters=html
    - npm test -- --reporter=junit --outputFile=javascript-unit-test-results.xml
    
    # Run Flutter unit tests
    - echo "🐦 Running Flutter unit tests..."
    - flutter test --coverage \
      --coverage-json=flutter-unit-coverage.json \
      --coverage-html=flutter-unit-coverage.html \
      --reporter=json \
      --reporter=html \
      --junit-report=flutter-unit-test-results.xml
    
    # Run integration tests
    - echo "🔗 Running integration tests..."
    - pytest tests/integration/ \
      --junitxml=python-integration-test-results.xml \
      --html=python-integration-test-report.html \
      --self-contained-html \
      --tb=short \
      -v
    
    # Start API server for integration tests
    - echo "🚀 Starting API server for integration tests..."
    - uvicorn api.main:app --host 0.0.0.0 --port 8000 &
    - sleep 10
    
    # Run API integration tests
    - echo "🔌 Running API integration tests..."
    - pytest tests/api/integration/ \
      --junitxml=api-integration-test-results.xml \
      --html=api-integration-test-report.html \
      --self-contained-html \
      --tb=short \
      -v
    
    # Build web application for E2E tests
    - echo "🌐 Building web application for E2E tests..."
    - flutter build web --release
    
    # Start web server
    - cd build/web && python -m http.server 8080 &
    - sleep 5
    
    # Run Cypress E2E tests
    - echo "🌐 Running Cypress E2E tests..."
    - npx cypress run \
      --browser chrome \
      --headless \
      --reporter junit \
      --reporter-options mochaFile=cypress-e2e-test-results.xml
    
    # Run performance tests
    - echo "⚡ Running performance tests..."
    - locust -f tests/performance/locustfile.py \
      --headless \
      --users 100 \
      --spawn-rate 10 \
      --run-time 60s \
      --host http://localhost:8000 \
      --html locust-performance-report.html \
      --csv locust-performance-results.csv
    
    - npx lighthouse http://localhost:8080 \
      --output=json \
      --output-path=lighthouse-performance-report.json \
      --chrome-flags="--headless"
    
    # Run security tests
    - echo "🔒 Running security tests..."
    - docker run -t owasp/zap2docker-stable zap-baseline.py \
      -t http://localhost:8000 \
      -J zap-security-report.json \
      -I zap-security-report.html
    
    - pytest tests/security/ \
      --junitxml=security-test-results.xml \
      --html=security-test-report.html \
      --self-contained-html \
      --tb=short \
      -v
    
    # Run accessibility tests
    - echo "♿ Running accessibility tests..."
    - npm run test:accessibility \
      -- --reporter=json \
      --outputFile=axe-accessibility-report.json
    
    - npx lighthouse http://localhost:8080 \
      --output=json \
      --output-path=lighthouse-accessibility-report.json \
      --chrome-flags="--headless" \
      --only-categories=accessibility
    
    # Run localization tests
    - echo "🌍 Running localization tests..."
    - flutter test test/localization/ \
      --reporter=json \
      --reporter=html \
      --junit-report=flutter-localization-test-results.xml
    
    - npm run test:i18n \
      -- --reporter=json \
      --outputFile=i18n-test-results.json
    
    # Generate comprehensive test report
    - echo "📊 Generating comprehensive test report..."
    - python scripts/generate_comprehensive_test_report.py \
      --unit-results python-unit-test-results.xml \
      --integration-results python-integration-test-results.xml \
      --api-results api-integration-test-results.xml \
      --e2e-results cypress-e2e-test-results.xml \
      --performance-results locust-performance-results.csv \
      --security-results security-test-results.xml \
      --accessibility-results axe-accessibility-report.json \
      --localization-results flutter-localization-test-results.xml \
      --output comprehensive-test-report.json
    
    # Generate test coverage report
    - echo "📈 Generating test coverage report..."
    - python scripts/generate_test_coverage_report.py \
      --python-coverage coverage.json \
      --flutter-coverage flutter-unit-coverage.json \
      --javascript-coverage coverage/coverage-final.json \
      --output test-coverage-report.json
  artifacts:
    reports:
      junit: comprehensive-test-report.json
    paths:
      - python-unit-test-results.xml
      - javascript-unit-test-results.xml
      - flutter-unit-test-results.xml
      - python-integration-test-results.xml
      - api-integration-test-results.xml
      - cypress-e2e-test-results.xml
      - locust-performance-report.html
      - locust-performance-results.csv
      - lighthouse-performance-report.json
      - zap-security-report.json
      - zap-security-report.html
      - security-test-results.xml
      - axe-accessibility-report.json
      - lighthouse-accessibility-report.json
      - flutter-localization-test-results.xml
      - i18n-test-results.json
      - comprehensive-test-report.json
      - test-coverage-report.json
      - coverage.json
      - coverage.html
      - flutter-unit-coverage.json
      - flutter-unit-coverage.html
      - python-unit-test-report.html
      - python-integration-test-report.html
      - api-integration-test-report.html
      - security-test-report.html
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "schedule"

