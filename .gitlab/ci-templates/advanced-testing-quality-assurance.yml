    # Test Yandex Cloud integration
    - echo "🇷🇺 Testing Yandex Cloud integration..."
    - pytest tests/integration/yandex_cloud/ \
      --junitxml=yandex-cloud-integration-results.xml \
      --html=yandex-cloud-integration-report.html \
      --self-contained-html \
      --tb=short \
