# GitLab CI/CD Templates for Space Invaders Enhanced Edition

# Security and Compliance Pipeline
security-compliance:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - docker info
  script:
    - echo "Running security and compliance checks..."
    
    # Container security scan
    - docker run --rm -v $(pwd):/app clair-scanner:latest -w /app -r /app/clair-report.json /app
    
    # Dependency vulnerability scan
    - docker run --rm -v $(pwd):/app owasp/dependency-check:latest --project SpaceInvaders --scan /app
    
    # Static application security testing
    - docker run --rm -v $(pwd):/app securecodewarrior/docker-sast:latest /app
    
    # Infrastructure as code security scan
    - docker run --rm -v $(pwd):/app tfsec/tfsec:latest /app/terraform/
    
    # Compliance checks
    - docker run --rm -v $(pwd):/app compliance-scanner:latest --framework gdpr --framework pci-dss /app
  artifacts:
    reports:
      sast: gl-sast-report.json
      dependency_scanning: gl-dependency-scanning-report.json
      container_scanning: gl-container-scanning-report.json
    paths:
      - clair-report.json
      - dependency-check-report.html
      - tfsec-report.json
      - compliance-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Performance Testing Pipeline
performance-testing:
  stage: test
  image: cirrusci/flutter:3.16.0
  cache:
    - key: performance-$CI_COMMIT_REF_SLUG
      paths:
        - .flutter/
        - .pub-cache/
  before_script:
    - flutter channel stable
    - flutter upgrade
    - flutter pub get
  script:
    - echo "Running performance tests..."
    
    # Build for performance testing
    - flutter build web --web-renderer canvaskit --release --profile
    
    # Performance benchmarks
    - flutter test integration_test/performance_test.dart --profile
    
    # Memory leak detection
    - flutter test integration_test/memory_leak_test.dart
    
    # CPU usage profiling
    - flutter test integration_test/cpu_profile_test.dart
    
    # Network performance testing
    - flutter test integration_test/network_performance_test.dart
    
    # Generate performance report
    - python3 scripts/performance_analyzer.py build/web/ --output performance-report.json
  artifacts:
    reports:
      performance: performance-report.json
    paths:
      - performance-report.json
      - performance-report.html
      - memory-heap-snapshot.json
      - cpu-profile.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# Accessibility Testing Pipeline
accessibility-testing:
  stage: test
  image: node:18
  before_script:
    - npm install -g @axe-core/cli pa11y lighthouse
  script:
    - echo "Running accessibility tests..."
    
    # Build web application
    - flutter build web --web-renderer canvaskit --release
    
    # Automated accessibility testing
    - axe build/web/ --tags wcag2a,wcag2aa,wcag21aa --exit
    
    # Accessibility audit
    - pa11y build/web/ --standard WCAG2AA --reporter json --reporter html
    
    # Lighthouse accessibility audit
    - lighthouse build/web/ --chrome-flags="--headless" --output=json --output=html --only-categories=accessibility
    
    # Screen reader testing
    - python3 scripts/screen_reader_tester.py build/web/
    
    # Keyboard navigation testing
    - python3 scripts/keyboard_navigation_tester.py build/web/
  artifacts:
    reports:
      accessibility: accessibility-report.json
    paths:
      - accessibility-report.json
      - accessibility-report.html
      - lighthouse-accessibility.json
      - lighthouse-accessibility.html
      - screen-reader-report.json
      - keyboard-navigation-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# Localization Testing Pipeline
localization-testing:
  stage: test
  image: node:18
  before_script:
    - npm install -g i18next-scanner gettext
  script:
    - echo "Running localization tests..."
    
    # Extract translatable strings
    - i18next-scanner 'lib/**/*.dart' --output locales/en/
    
    # Check for missing translations
    - python3 scripts/localization_checker.py locales/
    
    # Test text rendering in different languages
    - flutter test integration_test/localization_test.dart
    
    # Right-to-left language testing
    - flutter test integration_test/rtl_test.dart
    
    # Font rendering testing
    - python3 scripts/font_tester.py locales/
    
    # Cultural appropriateness checking
    - python3 scripts/cultural_checker.py locales/
  artifacts:
    reports:
      localization: localization-report.json
    paths:
      - localization-report.json
      - missing-translations.json
      - font-rendering-report.json
      - cultural-appropriateness-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# Multi-Platform Testing Pipeline
multi-platform-testing:
  stage: test
  image: cirrusci/flutter:3.16.0
  cache:
    - key: multi-platform-$CI_COMMIT_REF_SLUG
      paths:
        - .flutter/
        - .pub-cache/
  parallel:
    matrix:
      - PLATFORM: [web, android, windows, ios]
  before_script:
    - flutter channel stable
    - flutter upgrade
    - flutter pub get
  script:
    - echo "Running tests for $PLATFORM platform..."
    
    case "$PLATFORM" in
      "web")
        flutter build web --web-renderer canvaskit --release
        flutter test integration_test/web_test.dart
        ;;
      "android")
        flutter build apk --release
        flutter test integration_test/android_test.dart
        ;;
      "windows")
        flutter config --enable-windows-desktop
        flutter build windows --release
        flutter test integration_test/windows_test.dart
        ;;
      "ios")
        flutter build ios --release
        flutter test integration_test/ios_test.dart
        ;;
    esac
    
    # Platform-specific tests
    - flutter test integration_test/${PLATFORM}_specific_test.dart
    
    # Cross-platform compatibility tests
    - flutter test integration_test/cross_platform_test.dart
  artifacts:
    reports:
      junit: test-results-${PLATFORM}.xml
    paths:
      - test-results-${PLATFORM}.json
      - platform-report-${PLATFORM}.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# Load Testing Pipeline
load-testing:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker info
  script:
    - echo "Running load tests..."
    
    # Start application
    - docker-compose -f docker-compose.test.yml up -d
    - sleep 30
    
    # Run load tests
    - docker run --rm --network host -v $(pwd):/tests grafana/k6:latest run /tests/load-test.js
    
    # Stress testing
    - docker run --rm --network host -v $(pwd):/tests grafana/k6:latest run --vus 1000 --duration 5m /tests/stress-test.js
    
    # Spike testing
    - docker run --rm --network host -v $(pwd):/tests grafana/k6:latest run /tests/spike-test.js
    
    # Generate load test report
    - docker-compose -f docker-compose.test.yml down
  artifacts:
    reports:
      load_test: load-test-report.json
    paths:
      - load-test-report.json
      - load-test-report.html
      - stress-test-report.json
      - spike-test-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Chaos Engineering Pipeline
chaos-engineering:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker info
  script:
    - echo "Running chaos engineering tests..."
    
    # Deploy application
    - docker-compose -f docker-compose.chaos.yml up -d
    - sleep 30
    
    # Install chaos engineering tools
    - docker run --rm --privileged --pid=host alpine:latest sh -c "apk add --no-cache curl && curl -sSL https://mirrors.chaos-mesh.org/latest/install.sh | sh"
    
    # Network chaos experiments
    - docker run --rm --network host chaosmesh/chaos-mesh:latest network chaos --target-container app --latency --duration 60s
    
    # Pod chaos experiments
    - docker run --rm --network host chaosmesh/chaos-mesh:latest pod chaos --target-container app --kill --duration 60s
    
    # DNS chaos experiments
    - docker run --rm --network host chaosmesh/chaos-mesh:latest dns chaos --target-container app --fault --duration 60s
    
    # Generate chaos report
    - docker-compose -f docker-compose.chaos.yml down
  artifacts:
    reports:
      chaos_engineering: chaos-report.json
    paths:
      - chaos-report.json
      - chaos-report.html
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Compliance Audit Pipeline
compliance-audit:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - echo "Running compliance audit..."
    
    # GDPR compliance check
    - curl -sSL https://raw.githubusercontent.com/gdpr-compliance-checker/gdpr-checker/main/check.sh | sh
    
    # PCI-DSS compliance check
    - curl -sSL https://raw.githubusercontent.com/pci-dss-checker/pci-checker/main/check.sh | sh
    
    # HIPAA compliance check
    - curl -sSL https://raw.githubusercontent.com/hipaa-compliance-checker/hipaa-checker/main/check.sh | sh
    
    # ISO 27001 compliance check
    - curl -sSL https://raw.githubusercontent.com/iso27001-checker/iso-checker/main/check.sh | sh
    
    # Generate compliance report
    - python3 scripts/compliance_report_generator.py
  artifacts:
    reports:
      compliance: compliance-report.json
    paths:
      - gdpr-report.json
      - pci-dss-report.json
      - hipaa-report.json
      - iso27001-report.json
      - compliance-summary.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Data Privacy Pipeline
data-privacy:
  stage: test
  image: python:3.9
  before_script:
    - pip install pandas numpy cryptography
  script:
    - echo "Running data privacy checks..."
    
    # PII detection
    - python3 scripts/pii_detector.py --directory lib/ --output pii-report.json
    
    # Data encryption verification
    - python3 scripts/encryption_checker.py --directory lib/ --output encryption-report.json
    
    # Data retention policy check
    - python3 scripts/retention_checker.py --directory lib/ --output retention-report.json
    
    # Consent management verification
    - python3 scripts/consent_checker.py --directory lib/ --output consent-report.json
    
    # Generate privacy report
    - python3 scripts/privacy_report_generator.py
  artifacts:
    reports:
      data_privacy: privacy-report.json
    paths:
      - pii-report.json
      - encryption-report.json
      - retention-report.json
      - consent-report.json
      - privacy-summary.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# Documentation Testing Pipeline
documentation-testing:
  stage: test
  image: node:18
  before_script:
    - npm install -g markdownlint-cli markdown-link-check
  script:
    - echo "Running documentation tests..."
    
    # Markdown linting
    - markdownlint **/*.md
    
    # Link checking
    - find . -name "*.md" -exec markdown-link-check {} \;
    
    # API documentation validation
    - python3 scripts/api_doc_validator.py docs/api/
    
    # Code documentation coverage
    - dart doc --report=lib/ > doc-coverage.json
    
    # Documentation accessibility
    - python3 scripts/doc_accessibility_checker.py docs/
  artifacts:
    reports:
      documentation: documentation-report.json
    paths:
      - documentation-report.json
      - doc-coverage.json
      - link-check-report.json
      - doc-accessibility-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# Backup and Recovery Testing Pipeline
backup-recovery-testing:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker info
  script:
    - echo "Running backup and recovery tests..."
    
    # Create test data
    - docker run --rm -v $(pwd):/data alpine:latest sh -c "echo 'test data' > /data/test-file.txt"
    
    # Test backup process
    - docker run --rm -v $(pwd):/backup alpine:latest tar -czf /backup/test-backup.tar.gz test-file.txt
    
    # Simulate data loss
    - rm test-file.txt
    
    # Test recovery process
    - docker run --rm -v $(pwd):/data alpine:latest tar -xzf /backup/test-backup.tar.gz -C /data/
    
    # Verify recovery
    - if [ ! -f test-file.txt ]; then exit 1; fi
    
    # Test backup integrity
    - docker run --rm -v $(pwd):/backup alpine:latest tar -tzf /backup/test-backup.tar.gz
    
    # Generate backup report
    - python3 scripts/backup_report_generator.py
  artifacts:
    reports:
      backup_recovery: backup-report.json
    paths:
      - backup-report.json
      - test-backup.tar.gz
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Disaster Recovery Testing Pipeline
disaster-recovery-testing:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker info
  script:
    - echo "Running disaster recovery tests..."
    
    # Deploy primary environment
    - docker-compose -f docker-compose.primary.yml up -d
    - sleep 30
    
    # Create disaster scenario
    - docker-compose -f docker-compose.primary.yml down
    
    # Deploy backup environment
    - docker-compose -f docker-compose.backup.yml up -d
    - sleep 30
    
    # Test failover
    - curl -f http://localhost:8080/health || exit 1
    
    # Test data consistency
    - python3 scripts/data_consistency_checker.py
    
    # Test recovery time
    - python3 scripts/recovery_time_analyzer.py
    
    # Cleanup
    - docker-compose -f docker-compose.backup.yml down
    
    # Generate disaster recovery report
    - python3 scripts/disaster_recovery_report_generator.py
  artifacts:
    reports:
      disaster_recovery: dr-report.json
    paths:
      - dr-report.json
      - recovery-time-metrics.json
      - data-consistency-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
