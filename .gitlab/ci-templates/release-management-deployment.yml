# GitLab CI/CD Templates for Space Invaders Enhanced Edition

# Release Management and Deployment Pipeline
release-management-deployment:
  stage: deploy
  image: python:3.11
  services:
    - postgres:15
    - redis:7
  variables:
    POSTGRES_DB: space_invaders_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/space_invaders_test"
    REDIS_URL: "redis://redis:6379"
  before_script:
    - pip install semver
    - pip install gitpython
    - pip install ansible
    - pip install terraform
    - pip install -r requirements.txt
    - npm install -g
    - flutter pub get
  script:
    - echo "🚀 Starting release management and deployment..."
    
    # Determine version information
    - python scripts/determine_release_version.py \
      --tag "$CI_COMMIT_TAG" \
      --branch "$CI_COMMIT_REF_NAME" \
      --output version-info.json
    
    # Read version information
    - VERSION_INFO=$(cat version-info.json)
    - export VERSION=$(echo $VERSION_INFO | jq -r '.version')
    - export RELEASE_TYPE=$(echo $VERSION_INFO | jq -r '.release_type')
    - export PREVIOUS_VERSION=$(echo $VERSION_INFO | jq -r '.previous_version')
    - export IS_PRERELEASE=$(echo $VERSION_INFO | jq -r '.is_prerelease')
    
    # Generate release plan
    - python scripts/generate_release_plan.py \
      --version "$VERSION" \
      --release-type "$RELEASE_TYPE" \
      --previous-version "$PREVIOUS_VERSION" \
      --output release-plan.json
    
    # Build artifacts for all platforms
    - echo "🔨 Building release artifacts..."
    
    # Build web application
    - flutter build web --release --web-renderer canvaskit
    - npm run build:prod
    
    # Build API
    - npm run build:api
    - pip install -r requirements.txt
    - python -m PyInstaller --onefile api/main.py
    
    # Build Windows application
    - flutter build windows --release
    
    # Build macOS application
    - flutter build macos --release
    
    # Build iOS application
    - flutter build ios --release --no-codesign
    
    # Build Android application
    - flutter build apk --release
    - flutter build appbundle --release
    
    # Package artifacts
    - python scripts/package_release_artifacts.py \
      --version "$VERSION" \
      --build-dir build/ \
      --output-dir artifacts/
    
    # Run security and quality checks
    - echo "🔒 Running security and quality checks..."
    - bandit -r . -f json -o bandit-release-scan.json
    - safety check --json --output safety-release-scan.json
    - semgrep --config=auto --json --output=semgrep-release-scan.json .
    - npm audit --json > npm-audit-release-scan.json || true
    - flutter analyze --format=json > flutter-release-analysis.json
    
    # Run integration tests
    - echo "🧪 Running integration tests..."
    
    # Wait for services
    - until pg_isready -h postgres -p 5432 -U postgres; do
        echo "Waiting for PostgreSQL..."
        sleep 2
      done
    - until redis-cli -h redis ping; do
        echo "Waiting for Redis..."
        sleep 2
      done
    
    # Setup test environment
    - export DATABASE_URL=$DATABASE_URL
    - export REDIS_URL=$REDIS_URL
    - export RELEASE_VERSION=$VERSION
    
    # Start API server
    - uvicorn api.main:app --host 0.0.0.0 --port 8000 &
    - sleep 10
    
    # Start web server
    - cd artifacts/web && python -m http.server 8080 &
    - sleep 5
    
    # Run integration tests
    - pytest tests/integration/ \
      --junitxml=integration-test-results.xml \
      --html=integration-test-report.html \
      --self-contained-html \
      --tb=short \
      -v
    
    # Run end-to-end tests
    - pytest tests/e2e/ \
      --junitxml=e2e-test-results.xml \
      --html=e2e-test-report.html \
      --self-contained-html \
      --tb=short \
      -v
    
    # Generate release notes
    - echo "📝 Generating release notes..."
    - python scripts/generate_release_notes.py \
      --version "$VERSION" \
      --release-plan release-plan.json \
      --output release-notes.md
    
    # Create GitLab release
    - echo "📦 Creating GitLab release..."
    - |
      if [ "$CI_COMMIT_TAG" ]; then
        # Create GitLab release using API
        curl --request POST \
          --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
          --header "Content-Type: application/json" \
          --data "{\"tag_name\":\"$CI_COMMIT_TAG\",\"description\":\"$(cat release-notes.md)\",\"assets\":{\"links\":[{\"name\":\"Web Application\",\"url\":\"$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_JOB_ID/download?job=release-management-deployment\"}]}}" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      fi
    
    # Deploy to staging environment
    - echo "🚀 Deploying to staging environment..."
    - python scripts/deploy_to_staging.py \
      --version "$VERSION" \
      --artifacts-dir artifacts/ \
      --environment staging
    
    # Run smoke tests
    - python scripts/run_smoke_tests.py \
      --environment staging \
      --version "$VERSION"
    
    # Deploy to production environment (if on main branch)
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ] && [ "$CI_COMMIT_TAG" ]; then
        echo "🚀 Deploying to production environment..."
        python scripts/deploy_to_production.py \
          --version "$VERSION" \
          --artifacts-dir artifacts/ \
          --environment production
        
        # Run production smoke tests
        python scripts/run_smoke_tests.py \
          --environment production \
          --version "$VERSION"
        
        # Deploy to app stores
        echo "📱 Deploying to app stores..."
        python scripts/deploy_to_app_store.py \
          --store google-play \
          --version "$VERSION" \
          --artifacts-dir artifacts/ \
          --release-notes release-notes.md
        
        python scripts/deploy_to_app_store.py \
          --store apple-app-store \
          --version "$VERSION" \
          --artifacts-dir artifacts/ \
          --release-notes release-notes.md
      fi
    
    # Update documentation
    - echo "📚 Updating documentation..."
    - python scripts/update_documentation.py \
      --version "$VERSION" \
      --release-plan release-plan.json
    
    # Deploy documentation
    - python scripts/deploy_documentation.py \
      --version "$VERSION"
    
    # Generate post-release analysis
    - echo "📊 Generating post-release analysis..."
    - python scripts/generate_post_release_analysis.py \
      --version "$VERSION" \
      --reports-dir reports/ \
      --output post-release-analysis.json
  artifacts:
    reports:
      junit: integration-test-results.xml
    paths:
      - version-info.json
      - release-plan.json
      - release-notes.md
      - artifacts/
      - bandit-release-scan.json
      - safety-release-scan.json
      - semgrep-release-scan.json
      - npm-audit-release-scan.json
      - flutter-release-analysis.json
      - integration-test-results.xml
      - integration-test-report.html
      - e2e-test-results.xml
      - e2e-test-report.html
      - post-release-analysis.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# DevOps Infrastructure Management Pipeline
devops-infrastructure-management:
  stage: deploy
  image: python:3.11
  before_script:
    - pip install terraform
    - pip install ansible
    - pip install ansible-lint
    - pip install terraform-docs
    - pip install -r requirements.txt
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - install -o root -g root kubectl /usr/local/bin/kubectl
    - curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    - chmod 700 get_helm.sh
    - ./get_helm.sh
  script:
    - echo "🔧 Starting DevOps infrastructure management..."
    
    # Validate Terraform configuration
    - echo "🔍 Validating Terraform configuration..."
    - cd terraform/environments/$CI_ENVIRONMENT_NAME
    - terraform init -backend=false
    - terraform fmt -check -recursive
    - terraform validate
    - terraform plan -out=tfplan
    - terraform show -json tfplan > terraform-plan.json
    
    # Validate Ansible playbooks
    - echo "🔍 Validating Ansible playbooks..."
    - cd ../../ansible
    - ansible-lint .
    - ansible-playbook --syntax-check *.yml
    - ansible-playbook --check *.yml
    
    # Validate Docker configuration
    - echo "🔍 Validating Docker configuration..."
    - cd ../docker
    - docker compose config
    - docker compose config > docker-compose-config.json
    
    # Validate Kubernetes manifests
    - echo "🔍 Validating Kubernetes manifests..."
    - cd ../kubernetes
    - kubectl apply --dry-run=client -f .
    - kubeval .
    - kube-score score . --output-format json > kubernetes-score.json
    
    # Plan infrastructure changes
    - echo "📋 Planning infrastructure changes..."
    - cd ../terraform/environments/$CI_ENVIRONMENT_NAME
    - terraform plan -out=tfplan-$CI_ENVIRONMENT_NAME
    - terraform show -json tfplan-$CI_ENVIRONMENT_NAME > terraform-plan-$CI_ENVIRONMENT_NAME.json
    
    # Generate infrastructure documentation
    - terraform-docs . > infrastructure-docs-$CI_ENVIRONMENT_NAME.md
    
    # Analyze infrastructure costs
    - python scripts/analyze_infrastructure_costs.py \
      --environment "$CI_ENVIRONMENT_NAME" \
      --plan-file terraform-plan-$CI_ENVIRONMENT_NAME.json \
      --output infrastructure-costs-$CI_ENVIRONMENT_NAME.json
    
    # Generate infrastructure report
    - python scripts/generate_infrastructure_report.py \
      --environment "$CI_ENVIRONMENT_NAME" \
      --plan-file terraform-plan-$CI_ENVIRONMENT_NAME.json \
      --costs-file infrastructure-costs-$CI_ENVIRONMENT_NAME.json \
      --output infrastructure-report-$CI_ENVIRONMENT_NAME.json
    
    # Deploy infrastructure (if not in dry run)
    - |
      if [ "$CI_ENVIRONMENT_NAME" != "production" ] || [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        echo "🚀 Deploying infrastructure to $CI_ENVIRONMENT_NAME..."
        
        # Deploy infrastructure with Terraform
        cd terraform/environments/$CI_ENVIRONMENT_NAME
        terraform apply -auto-approve tfplan-$CI_ENVIRONMENT_NAME
        
        # Deploy configurations with Ansible
        cd ../../ansible
        ansible-playbook -i inventory/$CI_ENVIRONMENT_NAME playbook.yml
        
        # Deploy Docker containers
        cd ../docker
        docker compose -f docker-compose.$CI_ENVIRONMENT_NAME.yml up -d
        
        # Deploy Kubernetes manifests
        cd ../kubernetes
        kubectl apply -f manifests/$CI_ENVIRONMENT_NAME/
        
        # Verify deployment
        python scripts/verify_deployment.py \
          --environment "$CI_ENVIRONMENT_NAME" \
          --output deployment-verification-$CI_ENVIRONMENT_NAME.json
        
        # Run post-deployment tests
        python scripts/run_post_deployment_tests.py \
          --environment "$CI_ENVIRONMENT_NAME" \
          --output post-deployment-tests-$CI_ENVIRONMENT_NAME.json
      fi
    
    # Setup monitoring
    - echo "📊 Setting up monitoring..."
    - cd ../monitoring
    - docker compose up -d
    
    # Configure Prometheus
    - python scripts/configure_prometheus.py \
      --config-file prometheus.yml \
      --output prometheus-config.json
    
    # Configure Grafana
    - python scripts/configure_grafana.py \
      --config-file grafana/dashboards/ \
      --output grafana-config.json
    
    # Setup alerting rules
    - python scripts/setup_alerting_rules.py \
      --rules-file alerting-rules.yml \
      --output alerting-config.json
    
    # Test monitoring setup
    - python scripts/test_monitoring_setup.py \
      --output monitoring-test-results.json
    
    # Run infrastructure tests
    - echo "🧪 Running infrastructure tests..."
    
    # Performance tests
    - python scripts/run_infrastructure_tests.py \
      --test-type performance \
      --environment "$CI_ENVIRONMENT_NAME" \
      --output infrastructure-test-performance.json
    
    # Security tests
    - python scripts/run_infrastructure_tests.py \
      --test-type security \
      --environment "$CI_ENVIRONMENT_NAME" \
      --output infrastructure-test-security.json
    
    # Reliability tests
    - python scripts/run_infrastructure_tests.py \
      --test-type reliability \
      --environment "$CI_ENVIRONMENT_NAME" \
      --output infrastructure-test-reliability.json
    
    # Scalability tests
    - python scripts/run_infrastructure_tests.py \
      --test-type scalability \
      --environment "$CI_ENVIRONMENT_NAME" \
      --output infrastructure-test-scalability.json
    
    # Generate test reports
    - python scripts/generate_infrastructure_test_report.py \
      --test-type performance \
      --test-results infrastructure-test-performance.json \
      --output infrastructure-test-report-performance.json
    
    - python scripts/generate_infrastructure_test_report.py \
      --test-type security \
      --test-results infrastructure-test-security.json \
      --output infrastructure-test-report-security.json
    
    - python scripts/generate_infrastructure_test_report.py \
      --test-type reliability \
      --test-results infrastructure-test-reliability.json \
      --output infrastructure-test-report-reliability.json
    
    - python scripts/generate_infrastructure_test_report.py \
      --test-type scalability \
      --test-results infrastructure-test-scalability.json \
      --output infrastructure-test-report-scalability.json
    
    # Manage Russian cloud infrastructure
    - echo "☁️ Managing Russian cloud infrastructure..."
    
    # Yandex Cloud
    - python scripts/manage_yandex_cloud_infrastructure.py \
      --action plan \
      --environment "$CI_ENVIRONMENT_NAME" \
      --output yandex-cloud-infrastructure.json
    
    - python scripts/verify_yandex_cloud_setup.py \
      --output yandex-cloud-verification.json
    
    # VK Cloud
    - python scripts/manage_vk_cloud_infrastructure.py \
      --action plan \
      --environment "$CI_ENVIRONMENT_NAME" \
      --output vk-cloud-infrastructure.json
    
    - python scripts/verify_vk_cloud_setup.py \
      --output vk-cloud-verification.json
    
    # Selectel
    - python scripts/manage_selectel_infrastructure.py \
      --action plan \
      --environment "$CI_ENVIRONMENT_NAME" \
      --output selectel-infrastructure.json
    
    - python scripts/verify_selectel_setup.py \
      --output selectel-verification.json
    
    # Generate comprehensive infrastructure report
    - echo "📊 Generating comprehensive infrastructure report..."
    - python scripts/generate_comprehensive_infrastructure_report.py \
      --input-dir reports/ \
      --output comprehensive-infrastructure-report.json
  artifacts:
    reports:
      junit: integration-test-results.xml
    paths:
      - terraform-plan.json
      - docker-compose-config.json
      - kubernetes-score.json
      - infrastructure-docs-$CI_ENVIRONMENT_NAME.md
      - infrastructure-costs-$CI_ENVIRONMENT_NAME.json
      - infrastructure-report-$CI_ENVIRONMENT_NAME.json
      - deployment-verification-$CI_ENVIRONMENT_NAME.json
      - post-deployment-tests-$CI_ENVIRONMENT_NAME.json
      - prometheus-config.json
      - grafana-config.json
      - alerting-config.json
      - monitoring-test-results.json
      - infrastructure-test-performance.json
      - infrastructure-test-security.json
      - infrastructure-test-reliability.json
      - infrastructure-test-scalability.json
      - infrastructure-test-report-performance.json
      - infrastructure-test-report-security.json
      - infrastructure-test-report-reliability.json
      - infrastructure-test-report-scalability.json
      - yandex-cloud-infrastructure.json
      - yandex-cloud-verification.json
      - vk-cloud-infrastructure.json
      - vk-cloud-verification.json
      - selectel-infrastructure.json
      - selectel-verification.json
      - comprehensive-infrastructure-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH =~ /^infrastructure\//
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Backup and Recovery Pipeline
backup-recovery:
  stage: deploy
  image: python:3.11
  before_script:
    - pip install boto3
    - pip install -r requirements.txt
  script:
    - echo "💾 Starting backup and recovery operations..."
    
    # Backup databases
    - python scripts/backup_infrastructure.py \
      --component databases \
      --environment "$CI_ENVIRONMENT_NAME" \
      --output backup-databases.json
    
    # Backup configurations
    - python scripts/backup_infrastructure.py \
      --component configurations \
      --environment "$CI_ENVIRONMENT_NAME" \
      --output backup-configurations.json
    
    # Backup logs
    - python scripts/backup_infrastructure.py \
      --component logs \
      --environment "$CI_ENVIRONMENT_NAME" \
      --output backup-logs.json
    
    # Backup metrics
    - python scripts/backup_infrastructure.py \
      --component metrics \
      --environment "$CI_ENVIRONMENT_NAME" \
      --output backup-metrics.json
    
    # Verify backup integrity
    - python scripts/verify_backup_integrity.py \
      --backup-file backup-databases.json \
      --output backup-verification-databases.json
    
    - python scripts/verify_backup_integrity.py \
      --backup-file backup-configurations.json \
      --output backup-verification-configurations.json
    
    - python scripts/verify_backup_integrity.py \
      --backup-file backup-logs.json \
      --output backup-verification-logs.json
    
    - python scripts/verify_backup_integrity.py \
      --backup-file backup-metrics.json \
      --output backup-verification-metrics.json
    
    # Test recovery procedures
    - python scripts/test_recovery_procedures.py \
      --environment "$CI_ENVIRONMENT_NAME" \
      --output recovery-test-results.json
  artifacts:
    paths:
      - backup-databases.json
      - backup-configurations.json
      - backup-logs.json
      - backup-metrics.json
      - backup-verification-databases.json
      - backup-verification-configurations.json
      - backup-verification-logs.json
      - backup-verification-metrics.json
      - recovery-test-results.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Infrastructure Cleanup Pipeline
infrastructure-cleanup:
  stage: deploy
  image: python:3.11
  before_script:
    - pip install -r requirements.txt
  script:
    - echo "🧹 Starting infrastructure cleanup..."
    
    # Cleanup unused resources
    - python scripts/cleanup_infrastructure.py \
      --environment "$CI_ENVIRONMENT_NAME" \
      --dry-run false \
      --output cleanup-results.json
    
    # Verify cleanup
    - python scripts/verify_cleanup.py \
      --cleanup-results cleanup-results.json \
      --output cleanup-verification.json
  artifacts:
    paths:
      - cleanup-results.json
      - cleanup-verification.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
