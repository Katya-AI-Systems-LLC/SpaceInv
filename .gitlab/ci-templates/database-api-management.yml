  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Multi-Cloud Database Backup
multi-cloud-database-backup:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq python3 py3-pip postgresql-client
    - pip3 install psycopg2-binary
  script:
    - echo "💾 Starting Multi-Cloud Database Backup..."
    
    # Create backup
    - echo "📦 Creating database backup..."
    - TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    - BACKUP_FILE="space_invaders_backup_${TIMESTAMP}.sql"
    - pg_dump $DATABASE_URL > $BACKUP_FILE
    - gzip $BACKUP_FILE
    
    # Upload to all Russian cloud providers
    - echo "☁️ Uploading to Russian Cloud providers..."
    
    # Upload to Yandex Cloud
    - |
      if [ -n "$YC_SERVICE_ACCOUNT_KEY" ]; then
        curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
        export PATH=$PATH:$HOME/yandex-cloud/bin
        
        yc config profile create sa-profile
        yc config set service-account-key "$YC_SERVICE_ACCOUNT_KEY"
        yc config set folder-id "$YC_FOLDER_ID"
        
        yc storage s3 cp \
          --endpoint-url=https://storage.yandexcloud.net \
          ${BACKUP_FILE}.gz \
          s3://space-invaders-backups/
        
        echo "✅ Backup uploaded to Yandex Cloud"
      fi
    
    # Upload to VK Cloud
    - |
      if [ -n "$VK_CLOUD_TOKEN" ]; then
        curl -X POST "$VK_CLOUD_STORAGE_URL" \
          -H "Authorization: Bearer $VK_CLOUD_TOKEN" \
          -F "file=@${BACKUP_FILE}.gz"
        
        echo "✅ Backup uploaded to VK Cloud"
      fi
    
    # Upload to Selectel
    - |
      if [ -n "$SELECTEL_USERNAME" ]; then
        pip3 install selectel-storage-cli
        
        mkdir -p ~/.config/selectel
        cat > ~/.config/selectel/config.yaml << EOF
        auth_url: https://api.selcdn.ru
        username: $SELECTEL_USERNAME
        password: $SELECTEL_PASSWORD
        container_name: space-invaders-backups
        EOF
        
        selectel-storage upload \
          --source ${BACKUP_FILE}.gz \
          --destination /backups/
        
        echo "✅ Backup uploaded to Selectel"
      fi
    
    # Cleanup local backup
    - rm ${BACKUP_FILE}.gz
    
    # Generate backup report
    - echo "📊 Generating backup report..."
    - |
      cat > multi-cloud-backup-report.json << EOF
      {
        "backup": {
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "backup_file": "${BACKUP_FILE}.gz",
          "yandex_cloud": $([ -n "$YC_SERVICE_ACCOUNT_KEY" ] && echo "uploaded" || echo "skipped"),
          "vk_cloud": $([ -n "$VK_CLOUD_TOKEN" ] && echo "uploaded" || echo "skipped"),
          "selectel": $([ -n "$SELECTEL_USERNAME" ] && echo "uploaded" || echo "skipped"),
          "overall": "success"
        }
      }
      EOF
  artifacts:
    reports:
      junit: multi-cloud-backup-report.json
    paths:
      - multi-cloud-backup-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Database Security Scan
database-security-scan:
  stage: test
  image: python:3.11
  before_script:
    - pip install bandit safety
    - pip install psycopg2-binary
    - pip install -r requirements.txt
  script:
    - echo "🔒 Starting Database Security Scan..."
    
    # Scan database code
    - echo "🔍 Scanning database code..."
    - bandit -r database/ -f json -o database-bandit-report.json
    - safety check --json --output database-safety-report.json
    
    # Check database permissions
    - echo "👥 Checking database permissions..."
    - python3 scripts/check_database_permissions.py --output database-permissions-report.json
    
    # Audit database access
    - echo "📋 Auditing database access..."
    - python3 scripts/audit_database_access.py --output database-access-report.json
    
    # Check encryption settings
    - echo "🔐 Checking encryption settings..."
    - python3 scripts/check_database_encryption.py --output database-encryption-report.json
    
    # Generate security report
    - echo "📊 Generating security report..."
    - |
      cat > database-security-report.json << EOF
      {
        "security": {
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "code_scan": "completed",
          "permissions_check": "completed",
          "access_audit": "completed",
          "encryption_check": "completed",
          "overall": "secure"
        }
      }
      EOF
  artifacts:
    reports:
      junit: database-security-report.json
    paths:
      - database-security-report.json
      - database-bandit-report.json
      - database-safety-report.json
      - database-permissions-report.json
      - database-access-report.json
      - database-encryption-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
