    - python scripts/devops/log-cleanup.py --log-paths monitoring/log-paths.json --retention-days 30
    - python scripts/devops/backup-cleanup.py --storage-provider "$BACKUP_STORAGE_PROVIDER" --storage-credentials "$BACKUP_STORAGE_CREDENTIALS" --retention-days 90
