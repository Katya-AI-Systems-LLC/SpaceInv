    - python scripts/devops/telegram-notification.py --alerts alerts/correlated-alerts.json --bot-token $TELEGRAM_BOT_TOKEN --chat-id $TELEGRAM_CHAT_ID
    - python scripts/devops/email-notification.py --alerts alerts/correlated-alerts.json --to $NOTIFICATION_EMAIL
