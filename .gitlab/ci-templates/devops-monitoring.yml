# GitLab CI/CD Template for DevOps Monitoring and Automation
# Provides comprehensive monitoring, alerting, and automation capabilities

stages:
  - monitor
  - analyze
  - alert
  - automate
  - report

variables:
  MONITORING_ENABLED: "true"
  ALERT_ENABLED: "true"
  AUTOMATION_ENABLED: "true"
  ENVIRONMENT: "production"
  SLACK_WEBHOOK: "$SLACK_WEBHOOK"
  TELEGRAM_BOT_TOKEN: "$TELEGRAM_BOT_TOKEN"
  TELEGRAM_CHAT_ID: "$TELEGRAM_CHAT_ID"
  PROMETHEUS_URL: "$PROMETHEUS_URL"
  GRAFANA_URL: "$GRAFANA_URL"

# Health Monitoring
monitor:health:
  stage: monitor
  image: python:3.11-slim
  before_script:
    - apt-get update -qq && apt-get install -y curl wget
    - pip install requests psutil prometheus-client
    - pip install -r requirements.txt
  script:
    - python scripts/devops/health-monitor.py --environment $ENVIRONMENT --output monitoring/health-report.json
    - python scripts/devops/app-health-monitor.py --environment $ENVIRONMENT --endpoints monitoring/endpoints.json --output monitoring/app-health.json
    - python scripts/devops/db-health-monitor.py --environment $ENVIRONMENT --connection-string "$DB_CONNECTION_STRING" --output monitoring/db-health.json
    - python scripts/devops/infra-health-monitor.py --environment $ENVIRONMENT --cloud-provider "$CLOUD_PROVIDER" --credentials "$CLOUD_CREDENTIALS" --output monitoring/infra-health.json
    - python scripts/devops/generate-health-dashboard.py --reports-dir monitoring/ --output monitoring/health-dashboard.html
  artifacts:
    reports:
      junit: monitoring/junit.xml
    paths:
      - monitoring/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true

# Performance Monitoring
monitor:performance:
  stage: monitor
  image: python:3.11-slim
  before_script:
    - apt-get update -qq && apt-get install -y curl
    - pip install matplotlib pandas numpy seaborn plotly requests
    - pip install -r requirements.txt
  script:
    - python scripts/devops/performance-collector.py --environment $ENVIRONMENT --duration 300 --output monitoring/performance-metrics.json
    - python scripts/devops/performance-analyzer.py --metrics monitoring/performance-metrics.json --output monitoring/performance-analysis.json
    - python scripts/devops/performance-reporter.py --analysis monitoring/performance-analysis.json --output monitoring/performance-report.html
    - python scripts/devops/performance-alerting.py --analysis monitoring/performance-analysis.json --thresholds monitoring/performance-thresholds.json --slack-webhook $SLACK_WEBHOOK
  artifacts:
    reports:
      junit: monitoring/junit.xml
    paths:
      - monitoring/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true

# Security Monitoring
monitor:security:
  stage: monitor
  image: python:3.11-slim
  before_script:
    - apt-get update -qq && apt-get install -y curl wget
    - pip install requests cryptography
    - wget -O trivy https://github.com/aquasecurity/trivy/releases/latest/download/trivy-linux-amd64
    - chmod +x trivy
    - mv trivy /usr/local/bin/
  script:
    - trivy image --format json --output monitoring/container-security.json spaceinvaders/space-invaders:latest
    - trivy config --format json --output monitoring/infra-security.json .
    - trivy fs --format json --output monitoring/fs-security.json .
    - python scripts/devops/network-security-monitor.py --environment $ENVIRONMENT --output monitoring/network-security.json
    - python scripts/devops/access-log-analyzer.py --log-path /var/log/nginx/access.log --output monitoring/access-analysis.json
    - python scripts/devops/security-alerting.py --reports-dir monitoring/ --thresholds monitoring/security-thresholds.json --slack-webhook $SLACK_WEBHOOK
  artifacts:
    reports:
      junit: monitoring/junit.xml
    paths:
      - monitoring/
    expire_in: 1 month
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true

# Log Monitoring
monitor:logs:
  stage: monitor
  image: python:3.11-slim
  before_script:
    - apt-get update -qq && apt-get install -y curl
    - pip install elasticsearch-py logstash asyncio aiohttp
    - pip install -r requirements.txt
  script:
    - python scripts/devops/log-collector.py --environment $ENVIRONMENT --sources monitoring/log-sources.json --output monitoring/logs/
    - python scripts/devops/error-pattern-analyzer.py --log-dir monitoring/logs/ --output monitoring/error-patterns.json
    - python scripts/devops/log-anomaly-detector.py --log-dir monitoring/logs/ --output monitoring/log-anomalies.json
    - python scripts/devops/log-reporter.py --patterns monitoring/error-patterns.json --anomalies monitoring/log-anomalies.json --output monitoring/log-report.html
    - python scripts/devops/log-alerting.py --patterns monitoring/error-patterns.json --anomalies monitoring/log-anomalies.json --slack-webhook $SLACK_WEBHOOK
  artifacts:
    reports:
      junit: monitoring/junit.xml
    paths:
      - monitoring/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true

