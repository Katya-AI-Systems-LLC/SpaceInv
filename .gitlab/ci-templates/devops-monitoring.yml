    - python scripts/devops/alert-prioritizer.py --alerts alerts/aggregated-alerts.json --thresholds monitoring/alert-thresholds.json --output alerts/prioritized-alerts.json
    - python scripts/devops/alert-correlation.py --alerts alerts/prioritized-alerts.json --output alerts/correlated-alerts.json
  artifacts:
    reports:
      junit: alerts/junit.xml
    paths:
      - alerts/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true

# Alert Notification
alert:notify:
  stage: alert
  image: python:3.11-slim
