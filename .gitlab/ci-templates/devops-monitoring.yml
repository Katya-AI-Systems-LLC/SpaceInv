    - python scripts/devops/config-backup.py --environment $ENVIRONMENT --config-paths monitoring/config-paths.json --storage-provider "$BACKUP_STORAGE_PROVIDER" --storage-credentials "$BACKUP_STORAGE_CREDENTIALS"
    - python scripts/devops/backup-verification.py --storage-provider "$BACKUP_STORAGE_PROVIDER" --storage-credentials "$BACKUP_STORAGE_CREDENTIALS"
