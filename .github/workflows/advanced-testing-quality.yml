name: Advanced Testing and Quality Assurance

on:
  push:
    branches: [ main, develop, staging, production ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 1 * * *'  # Daily at 1 AM
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - unit
        - integration
        - widget
        - performance
        - accessibility
        - security
        - compatibility
      test_environment:
        description: 'Test environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - development
        - staging
        - production
      device_matrix:
        description: 'Device matrix'
        required: true
        default: 'standard'
        type: choice
        options:
        - minimal
        - standard
        - comprehensive
      generate_report:
        description: 'Generate comprehensive report'
        required: true
        default: true
        type: boolean

env:
  TEST_SUITE: ${{ github.event.inputs.test_suite || 'all' }}
  TEST_ENV: ${{ github.event.inputs.test_environment || 'staging' }}
  DEVICE_MATRIX: ${{ github.event.inputs.device_matrix || 'standard' }}
  GENERATE_REPORT: ${{ github.event.inputs.generate_report || 'true' }}
  FLUTTER_VERSION: '3.16.0'
  NODE_VERSION: '18'

jobs:
  # Unit Tests
  unit-tests:
    runs-on: ubuntu-latest
    if: contains(env.TEST_SUITE, 'all') || contains(env.TEST_SUITE, 'unit')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Install dependencies
      run: |
        flutter pub get
        flutter pub global activate coverage

    - name: Run unit tests with coverage
      run: |
        echo "🧪 Running unit tests..."
        flutter test --coverage --reporter=json > test-results.json || true
        flutter test --coverage --reporter=expanded > test-results.txt || true

    - name: Generate coverage report
      run: |
        echo "📊 Generating coverage report..."
        genhtml coverage/lcov.info -o coverage/html || true
        lcov --summary coverage/lcov.info || true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: |
          test-results.*
          coverage/
        retention-days: 30

    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const testResults = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
            const totalTests = testResults.tests.length;
            const passedTests = testResults.tests.filter(t => t.result === 'success').length;
            const failedTests = testResults.tests.filter(t => t.result === 'error').length;
            
            const comment = `## 🧪 Unit Test Results
            
            **Total Tests:** ${totalTests}
            **Passed:** ${passedTests} ✅
            **Failed:** ${failedTests} ❌
            **Success Rate:** ${((passedTests/totalTests)*100).toFixed(1)}%
            
            ${failedTests > 0 ? '### ❌ Failed Tests\n' + testResults.tests.filter(t => t.result === 'error').map(t => `- ${t.name}: ${t.error}`).join('\n') : '### ✅ All tests passed!'}
            
            ---
            *Results generated by unit test workflow*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not parse test results:', error.message);
          }

  # Integration Tests
  integration-tests:
    runs-on: ${{ matrix.os }}
    if: contains(env.TEST_SUITE, 'all') || contains(env.TEST_SUITE, 'integration')
    strategy:
      matrix:
        os: [ubuntu-latest]
        flutter-version: ['3.16.0', '3.15.0']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ matrix.flutter-version }}
        channel: 'stable'

    - name: Install dependencies
      run: |
        flutter pub get

    - name: Start integration test services
      run: |
        echo "🚀 Starting integration test services..."
        # Start mock services, databases, etc.
        docker-compose -f docker-compose.test.yml up -d || true

    - name: Run integration tests
      run: |
        echo "🧪 Running integration tests..."
        flutter test integration_test/ --reporter=json > integration-test-results.json || true
        flutter test integration_test/ --reporter=expanded > integration-test-results.txt || true

    - name: Stop test services
      if: always()
      run: |
        echo "🛑 Stopping test services..."
        docker-compose -f docker-compose.test.yml down || true

    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results-${{ matrix.os }}-${{ matrix.flutter-version }}
        path: |
          integration-test-results.*
          test/
        retention-days: 30

  # Widget Tests
  widget-tests:
    runs-on: ubuntu-latest
    if: contains(env.TEST_SUITE, 'all') || contains(env.TEST_SUITE, 'widget')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Install dependencies
      run: |
        flutter pub get

    - name: Run widget tests
      run: |
        echo "🧪 Running widget tests..."
        flutter test test/widget/ --reporter=json > widget-test-results.json || true
        flutter test test/widget/ --reporter=expanded > widget-test-results.txt || true

    - name: Upload widget test results
      uses: actions/upload-artifact@v4
      with:
        name: widget-test-results
        path: |
          widget-test-results.*
        retention-days: 30

  # Performance Tests
  performance-tests:
    runs-on: ubuntu-latest
    if: contains(env.TEST_SUITE, 'all') || contains(env.TEST_SUITE, 'performance')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Install dependencies
      run: |
        flutter pub get
        npm install -g lighthouse-cli

    - name: Build application for performance testing
      run: |
        flutter build web --release --web-renderer canvaskit

    - name: Run Lighthouse performance audit
      run: |
        echo "🚀 Running Lighthouse performance audit..."
        # Start web server
        python3 -m http.server 8080 --directory build/web &
        SERVER_PID=$!
        sleep 5
        
        # Run Lighthouse
        lighthouse http://localhost:8080 \
          --output=json \
          --output-path=lighthouse-report.json \
          --chrome-flags="--headless" \
          --quiet || true
        
        lighthouse http://localhost:8080 \
          --output=html \
          --output-path=lighthouse-report.html \
          --chrome-flags="--headless" \
          --quiet || true
        
        # Stop server
        kill $SERVER_PID

    - name: Run Flutter performance tests
      run: |
        echo "🧪 Running Flutter performance tests..."
        flutter test test/performance/ --reporter=json > performance-test-results.json || true

    - name: Analyze performance metrics
      run: |
        python3 << 'EOF'
        import json
        import os
        
        def analyze_performance():
            if os.path.exists('lighthouse-report.json'):
                with open('lighthouse-report.json', 'r') as f:
                    lighthouse_data = json.load(f)
                
                performance_score = lighthouse_data.get('categories', {}).get('performance', {}).get('score', 0) * 100
                
                print(f"Performance Score: {performance_score}")
                print(f"First Contentful Paint: {lighthouse_data.get('audits', {}).get('first-contentful-paint', {}).get('numericValue', 'N/A')}")
                print(f"Largest Contentful Paint: {lighthouse_data.get('audits', {}).get('largest-contentful-paint', {}).get('numericValue', 'N/A')}")
                print(f"Time to Interactive: {lighthouse_data.get('audits', {}).get('interactive', {}).get('numericValue', 'N/A')}")
                
                # Create performance summary
                summary = {
                    "performance_score": performance_score,
                    "fcp": lighthouse_data.get('audits', {}).get('first-contentful-paint', {}).get('numericValue'),
                    "lcp": lighthouse_data.get('audits', {}).get('largest-contentful-paint', {}).get('numericValue'),
                    "tti": lighthouse_data.get('audits', {}).get('interactive', {}).get('numericValue')
                }
                
                with open('performance-summary.json', 'w') as f:
                    json.dump(summary, f, indent=2)
        
        analyze_performance()
        EOF

    - name: Upload performance test results
      uses: actions/upload-artifact@v4
      with:
        name: performance-test-results
        path: |
          lighthouse-report.*
          performance-test-results.*
          performance-summary.json
        retention-days: 30

  # Accessibility Tests
  accessibility-tests:
    runs-on: ubuntu-latest
    if: contains(env.TEST_SUITE, 'all') || contains(env.TEST_SUITE, 'accessibility')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Install accessibility tools
      run: |
        npm install -g axe-cli
        npm install -g pa11y-ci
        pip3 install axe-selenium

    - name: Build application for accessibility testing
      run: |
        flutter build web --release

    - name: Run axe accessibility tests
      run: |
        echo "♿ Running axe accessibility tests..."
        # Start web server
        python3 -m http.server 8080 --directory build/web &
        SERVER_PID=$!
        sleep 5
        
        # Run axe tests
        axe http://localhost:8080 --tags wcag2a,wcag2aa,wcag21aa --format json > axe-report.json || true
        axe http://localhost:8080 --tags wcag2a,wcag2aa,wcag21aa --format html > axe-report.html || true
        
        # Run pa11y tests
        pa11y-ci http://localhost:8080 --reporter json > pa11y-report.json || true
        pa11y-ci http://localhost:8080 --reporter html > pa11y-report.html || true
        
        # Stop server
        kill $SERVER_PID

    - name: Run Flutter accessibility tests
      run: |
        echo "🧪 Running Flutter accessibility tests..."
        flutter test test/accessibility/ --reporter=json > accessibility-test-results.json || true

    - name: Analyze accessibility compliance
      run: |
        python3 << 'EOF'
        import json
        import os
        
        def analyze_accessibility():
            violations = []
            
            if os.path.exists('axe-report.json'):
                with open('axe-report.json', 'r') as f:
                    axe_data = json.load(f)
                
                for violation in axe_data.get('violations', []):
                    violations.append({
                        "tool": "axe",
                        "impact": violation.get('impact', 'unknown'),
                        "description": violation.get('description', ''),
                        "help": violation.get('help', ''),
                        "count": len(violation.get('nodes', []))
                    })
            
            if os.path.exists('pa11y-report.json'):
                with open('pa11y-report.json', 'r') as f:
                    pa11y_data = json.load(f)
                
                for issue in pa11y_data:
                    violations.append({
                        "tool": "pa11y",
                        "type": issue.get('type', 'unknown'),
                        "message": issue.get('message', ''),
                        "context": issue.get('context', ''),
                        "selector": issue.get('selector', '')
                    })
            
            # Create accessibility summary
            summary = {
                "total_violations": len(violations),
                "critical_issues": len([v for v in violations if v.get('impact') == 'critical']),
                "serious_issues": len([v for v in violations if v.get('impact') == 'serious']),
                "moderate_issues": len([v for v in violations if v.get('impact') == 'moderate']),
                "minor_issues": len([v for v in violations if v.get('impact') == 'minor']),
                "violations": violations
            }
            
            with open('accessibility-summary.json', 'w') as f:
                json.dump(summary, f, indent=2)
            
            print(f"Total Accessibility Violations: {summary['total_violations']}")
            print(f"Critical Issues: {summary['critical_issues']}")
            print(f"Serious Issues: {summary['serious_issues']}")
        
        analyze_accessibility()
        EOF

    - name: Upload accessibility test results
      uses: actions/upload-artifact@v4
      with:
        name: accessibility-test-results
        path: |
          axe-report.*
          pa11y-report.*
          accessibility-test-results.*
          accessibility-summary.json
        retention-days: 30

  # Compatibility Tests
  compatibility-tests:
    runs-on: ${{ matrix.os }}
    if: contains(env.TEST_SUITE, 'all') || contains(env.TEST_SUITE, 'compatibility')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        flutter-version: ['3.16.0', '3.15.0']
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ matrix.flutter-version }}
        channel: 'stable'

    - name: Install dependencies
      run: |
        flutter pub get

    - name: Run compatibility tests
      run: |
        echo "🧪 Running compatibility tests on ${{ matrix.platform }} with Flutter ${{ matrix.flutter-version }}..."
        flutter test test/compatibility/ --reporter=json > compatibility-test-results-${{ matrix.platform }}-${{ matrix.flutter-version }}.json || true

    - name: Upload compatibility test results
      uses: actions/upload-artifact@v4
      with:
        name: compatibility-test-results-${{ matrix.platform }}-${{ matrix.flutter-version }}
        path: |
          compatibility-test-results-*
        retention-days: 30

  # Cross-Platform Device Testing
  device-testing:
    runs-on: macos-latest
    if: env.DEVICE_MATRIX == 'comprehensive' || env.DEVICE_MATRIX == 'standard'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'

    - name: Install dependencies
      run: |
        flutter pub get

    - name: Setup iOS Simulator
      run: |
        echo "📱 Setting up iOS Simulator..."
        xcrun simctl create "iPhone 14" "iPhone 14" || true
        xcrun simctl create "iPhone 14 Pro" "iPhone 14 Pro" || true
        xcrun simctl create "iPad Air" "iPad Air (5th generation)" || true

    - name: Setup Android Emulator
      run: |
        echo "🤖 Setting up Android Emulator..."
        echo "y" | $ANDROID_HOME/tools/bin/sdkmanager --install "system-images;android-33;google_apis;x86_64"
        echo "no" | $ANDROID_HOME/tools/bin/avdmanager create avd -n test_emulator -k "system-images;android-33;google_apis;x86_64"
        $ANDROID_HOME/emulator/emulator -avd test_emulator -no-audio -no-window &
        adb wait-for-device

    - name: Run device tests
      run: |
        echo "🧪 Running device tests..."
        
        # iOS tests
        flutter test -d "iPhone 14" test/device/ --reporter=json > ios-device-test-results.json || true
        flutter test -d "iPhone 14 Pro" test/device/ --reporter=json > ios-pro-device-test-results.json || true
        flutter test -d "iPad Air" test/device/ --reporter=json > ipad-device-test-results.json || true
        
        # Android tests
        flutter test -d android test/device/ --reporter=json > android-device-test-results.json || true

    - name: Upload device test results
      uses: actions/upload-artifact@v4
      with:
        name: device-test-results
        path: |
          *-device-test-results.json
        retention-days: 30

  # Comprehensive Quality Report
  quality-report:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, widget-tests, performance-tests, accessibility-tests, compatibility-tests, device-testing]
    if: always() && env.GENERATE_REPORT == 'true'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Generate comprehensive quality report
      run: |
        python3 << 'EOF'
        import json
        import os
        from datetime import datetime
        
        def generate_quality_report():
            report = {
                "report_date": datetime.now().isoformat(),
                "repository": "${{ github.repository }}",
                "commit": "${{ github.sha }}",
                "branch": "${{ github.ref }}",
                "test_suite": "${{ env.TEST_SUITE }}",
                "test_environment": "${{ env.TEST_ENV }}",
                "device_matrix": "${{ env.DEVICE_MATRIX }}",
                "results": {}
            }
            
            # Collect unit test results
            if os.path.exists('unit-test-results'):
                unit_results = {}
                if os.path.exists('unit-test-results/test-results.json'):
                    with open('unit-test-results/test-results.json', 'r') as f:
                        test_data = json.load(f)
                        unit_results["total_tests"] = len(test_data.get('tests', []))
                        unit_results["passed_tests"] = len([t for t in test_data.get('tests', []) if t.get('result') == 'success'])
                        unit_results["failed_tests"] = len([t for t in test_data.get('tests', []) if t.get('result') == 'error'])
                
                if os.path.exists('unit-test-results/coverage/lcov.info'):
                    # Parse coverage
                    with open('unit-test-results/coverage/lcov.info', 'r') as f:
                        coverage_content = f.read()
                        lines_found = coverage_content.count('LF:')
                        lines_hit = coverage_content.count('LH:')
                        if lines_found > 0:
                            unit_results["coverage_percentage"] = round((lines_hit / lines_found) * 100, 2)
                
                report["results"]["unit_tests"] = unit_results
            
            # Collect performance results
            if os.path.exists('performance-test-results'):
                perf_results = {}
                if os.path.exists('performance-test-results/performance-summary.json'):
                    with open('performance-test-results/performance-summary.json', 'r') as f:
                        perf_data = json.load(f)
                        perf_results.update(perf_data)
                
                report["results"]["performance"] = perf_results
            
            # Collect accessibility results
            if os.path.exists('accessibility-test-results'):
                a11y_results = {}
                if os.path.exists('accessibility-test-results/accessibility-summary.json'):
                    with open('accessibility-test-results/accessibility-summary.json', 'r') as f:
                        a11y_data = json.load(f)
                        a11y_results.update(a11y_data)
                
                report["results"]["accessibility"] = a11y_results
            
            # Calculate overall quality score
            quality_score = 100
            if "unit_tests" in report["results"]:
                unit_score = (report["results"]["unit_tests"].get("passed_tests", 0) / max(report["results"]["unit_tests"].get("total_tests", 1)) * 100)
                quality_score = min(quality_score, unit_score)
            
            if "performance" in report["results"]:
                perf_score = report["results"]["performance"].get("performance_score", 0)
                quality_score = min(quality_score, perf_score)
            
            if "accessibility" in report["results"]:
                a11y_violations = report["results"]["accessibility"].get("total_violations", 0)
                a11y_score = max(0, 100 - (a11y_violations * 5))
                quality_score = min(quality_score, a11y_score)
            
            report["overall_quality_score"] = round(quality_score, 2)
            
            # Save report
            with open('comprehensive-quality-report.json', 'w') as f:
                json.dump(report, f, indent=2)
            
            # Generate HTML report
            html_report = f"""
            <!DOCTYPE html>
            <html>
            <head>
                <title>Quality Report - ${{ github.repository }}</title>
                <style>
                    body {{ font-family: Arial, sans-serif; margin: 20px; }}
                    .header {{ background: #f0f0f0; padding: 20px; border-radius: 5px; }}
                    .section {{ margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }}
                    .score {{ font-size: 24px; font-weight: bold; color: {"green" if quality_score >= 80 else "orange" if quality_score >= 60 else "red"}; }}
                    .metric {{ margin: 10px 0; }}
                </style>
            </head>
            <body>
                <div class="header">
                    <h1>Quality Report</h1>
                    <p><strong>Repository:</strong> ${{ github.repository }}</p>
                    <p><strong>Commit:</strong> ${{ github.sha }}</p>
                    <p><strong>Branch:</strong> ${{ github.ref }}</p>
                    <p><strong>Date:</strong> {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}</p>
                </div>
                
                <div class="section">
                    <h2>Overall Quality Score</h2>
                    <div class="score">{quality_score}%</div>
                </div>
                
                <div class="section">
                    <h2>Unit Tests</h2>
                    <div class="metric">Total Tests: {report["results"].get("unit_tests", {}).get("total_tests", "N/A")}</div>
                    <div class="metric">Passed: {report["results"].get("unit_tests", {}).get("passed_tests", "N/A")}</div>
                    <div class="metric">Failed: {report["results"].get("unit_tests", {}).get("failed_tests", "N/A")}</div>
                    <div class="metric">Coverage: {report["results"].get("unit_tests", {}).get("coverage_percentage", "N/A")}%</div>
                </div>
                
                <div class="section">
                    <h2>Performance</h2>
                    <div class="metric">Performance Score: {report["results"].get("performance", {}).get("performance_score", "N/A")}</div>
                    <div class="metric">First Contentful Paint: {report["results"].get("performance", {}).get("fcp", "N/A")}ms</div>
                    <div class="metric">Largest Contentful Paint: {report["results"].get("performance", {}).get("lcp", "N/A")}ms</div>
                    <div class="metric">Time to Interactive: {report["results"].get("performance", {}).get("tti", "N/A")}ms</div>
                </div>
                
                <div class="section">
                    <h2>Accessibility</h2>
                    <div class="metric">Total Violations: {report["results"].get("accessibility", {}).get("total_violations", "N/A")}</div>
                    <div class="metric">Critical Issues: {report["results"].get("accessibility", {}).get("critical_issues", "N/A")}</div>
                    <div class="metric">Serious Issues: {report["results"].get("accessibility", {}).get("serious_issues", "N/A")}</div>
                </div>
            </body>
            </html>
            """
            
            with open('quality-report.html', 'w') as f:
                f.write(html_report)
            
            print("✅ Comprehensive quality report generated!")
            print(f"Overall Quality Score: {quality_score}%")
            return report
        
        generate_quality_report()
        EOF

    - name: Upload comprehensive quality report
      uses: actions/upload-artifact@v4
      with:
        name: comprehensive-quality-report
        path: |
          comprehensive-quality-report.json
          quality-report.html
        retention-days: 90

    - name: Create quality issue on low scores
      if: contains(github.event.head_commit.message, '[quality-check]')
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const report = JSON.parse(fs.readFileSync('comprehensive-quality-report.json', 'utf8'));
            const qualityScore = report.overall_quality_score;
            
            if (qualityScore < 70) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Low Quality Score Detected - ${qualityScore}%`,
                body: `## Quality Score Alert
                
                **Repository:** ${context.repo.owner}/${context.repo.repo}
                **Commit:** ${context.sha}
                **Branch:** ${context.ref}
                **Quality Score:** ${qualityScore}%
                
                ### Test Results Summary
                ${JSON.stringify(report.results, null, 2)}
                
                ### Action Required
                The quality score is below the acceptable threshold (70%). Please review the detailed quality report and address the issues.
                
                ### Quality Report
                Download the comprehensive quality report from the workflow artifacts for detailed analysis.
                
                ---
                *This issue was automatically created by the Advanced Testing and Quality Assurance workflow.*`,
                labels: ['quality', 'low-score', 'automated-check']
              });
            }
          } catch (error) {
            console.log('Could not create quality issue:', error.message);
          }

    - name: Notify quality team
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `🔴 Quality Tests Failed - ${new Date().toISOString().split('T')[0]}`,
