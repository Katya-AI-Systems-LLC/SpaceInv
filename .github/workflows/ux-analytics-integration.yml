# GitHub Workflow Templates for Space Invaders Enhanced Edition

name: User Experience and Analytics Integration
on:
  push:
    branches: [main, develop, feature/*, hotfix/*]
    paths:
      - 'lib/ui/**'
      - 'lib/ux/**'
      - 'assets/ui/**'
      - 'web/**'
      - 'analytics/**'
      - 'test/ui/**'
      - 'test/ux/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'lib/ui/**'
      - 'lib/ux/**'
      - 'assets/ui/**'
      - 'web/**'
      - 'analytics/**'
      - 'test/ui/**'
      - 'test/ux/**'
  workflow_dispatch:
    inputs:
      ux_action:
        description: 'UX action to perform'
        required: true
        type: choice
        options:
          - 'test'
          - 'audit'
          - 'accessibility'
          - 'performance'
          - 'analytics'
          - 'all'
      analytics_action:
        description: 'Analytics action to perform'
        required: true
        type: choice
        options:
          - 'tracking'
          - 'reporting'
          - 'analysis'
          - 'dashboard'
          - 'validation'
          - 'all'
      target_platform:
        description: 'Target platform'
        required: true
        type: choice
        options:
          - 'all'
          - 'web'
          - 'mobile'
          - 'desktop'

jobs:
  ux-testing:
    runs-on: ubuntu-latest
    if: github.event.inputs.ux_action == 'test' || github.event.inputs.ux_action == 'all' || github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      matrix:
        platform: [web, mobile, desktop]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Setup Node.js
        if: matrix.platform == 'web'
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install UX testing dependencies
        run: |
          flutter pub get
          if [ "${{ matrix.platform }}" = "web" ]; then
            npm install
            npm install --save-dev axe-core
            npm install --save-dev lighthouse
            npm install --save-dev pa11y
          fi
          pip install pytest pytest-asyncio
          pip install selenium
          pip install -r requirements.txt

      - name: Build application for testing
        run: |
          if [ "${{ matrix.platform }}" = "web" ]; then
            flutter build web --release
          elif [ "${{ matrix.platform }}" = "mobile" ]; then
            flutter build apk --debug
          elif [ "${{ matrix.platform }}" = "desktop" ]; then
            flutter build linux --debug
          fi

      - name: Run UX unit tests
        run: |
          flutter test test/ux/unit/ \
            --reporter=json \
            --reporter=html \
            --junit-report=ux-unit-test-results-${{ matrix.platform }}.xml

      - name: Run UX integration tests
        run: |
          flutter test test/ux/integration/ \
            --reporter=json \
            --reporter=html \
            --junit-report=ux-integration-test-results-${{ matrix.platform }}.xml

      - name: Run UX widget tests
        run: |
          flutter test test/ux/widget/ \
            --reporter=json \
            --reporter=html \
            --junit-report=ux-widget-test-results-${{ matrix.platform }}.xml

      - name: Start web server for UX testing
        if: matrix.platform == 'web'
        run: |
          cd build/web && python -m http.server 8080 &
          sleep 5

      - name: Run accessibility testing
        if: matrix.platform == 'web'
        run: |
          # Run axe-core accessibility tests
          npm run test:accessibility \
            -- --reporter=json \
            --outputFile=axe-accessibility-results-${{ matrix.platform }}.json
          
          # Run Lighthouse accessibility audit
          npx lighthouse http://localhost:8080 \
            --output=json \
            --output-path=lighthouse-accessibility-${{ matrix.platform }}.json \
            --chrome-flags="--headless" \
            --only-categories=accessibility
          
          # Run Pa11y accessibility testing
          npx pa11y http://localhost:8080 \
            --reporter=json \
            --output=pa11y-results-${{ matrix.platform }}.json

      - name: Run UX performance testing
        if: matrix.platform == 'web'
        run: |
          # Run Lighthouse performance audit
          npx lighthouse http://localhost:8080 \
            --output=json \
            --output-path=lighthouse-performance-${{ matrix.platform }}.json \
            --chrome-flags="--headless" \
            --only-categories=performance
          
          # Run web vitals testing
          npm run test:web-vitals \
            -- --output=web-vitals-${{ matrix.platform }}.json

      - name: Run mobile UX testing
        if: matrix.platform == 'mobile'
        run: |
          # Run mobile UX tests
          python scripts/run_mobile_ux_tests.py \
            --platform "${{ matrix.platform }}" \
            --output mobile-ux-results-${{ matrix.platform }}.json

      - name: Generate UX test report
        run: |
          python scripts/generate_ux_test_report.py \
            --platform "${{ matrix.platform }}" \
            --unit-results ux-unit-test-results-${{ matrix.platform }}.xml \
            --integration-results ux-integration-test-results-${{ matrix.platform }}.xml \
            --widget-results ux-widget-test-results-${{ matrix.platform }}.xml \
            --accessibility-results axe-accessibility-results-${{ matrix.platform }}.json \
            --performance-results lighthouse-performance-${{ matrix.platform }}.json \
            --output ux-test-report-${{ matrix.platform }}.json

      - name: Upload UX test results
        uses: actions/upload-artifact@v3
        with:
          name: ux-test-results-${{ matrix.platform }}
          path: |
            ux-unit-test-results-${{ matrix.platform }}.xml
            ux-integration-test-results-${{ matrix.platform }}.xml
            ux-widget-test-results-${{ matrix.platform }}.xml
            axe-accessibility-results-${{ matrix.platform }}.json
            lighthouse-accessibility-${{ matrix.platform }}.json
            lighthouse-performance-${{ matrix.platform }}.json
            pa11y-results-${{ matrix.platform }}.json
            web-vitals-${{ matrix.platform }}.json
            mobile-ux-results-${{ matrix.platform }}.json
            ux-test-report-${{ matrix.platform }}.json

  ux-audit:
    runs-on: ubuntu-latest
    if: github.event.inputs.ux_action == 'audit' || github.event.inputs.ux_action == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install UX audit tools
        run: |
          flutter pub get
          npm install
          npm install --save-dev eslint-plugin-jsx-a11y
          npm install --save-dev stylelint
          npm install --save-dev html-validate
          pip install -r requirements.txt

      - name: Run UI component audit
        run: |
          python scripts/audit_ui_components.py \
            --component-dir lib/ui/ \
            --output ui-component-audit.json

      - name: Run UX pattern audit
        run: |
          python scripts/audit_ux_patterns.py \
            --pattern-dir lib/ux/ \
            --output ux-pattern-audit.json

      - name: Run design system audit
        run: |
          python scripts/audit_design_system.py \
            --design-system-dir assets/ui/ \
            --output design-system-audit.json

      - name: Run accessibility audit
        run: |
          python scripts/audit_accessibility.py \
            --source-dir lib/ \
            --output accessibility-audit.json

      - name: Run UX consistency audit
        run: |
          python scripts/audit_ux_consistency.py \
            --source-dir lib/ \
            --output ux-consistency-audit.json

      - name: Generate UX audit report
        run: |
          python scripts/generate_ux_audit_report.py \
            --ui-audit ui-component-audit.json \
            --ux-audit ux-pattern-audit.json \
            --design-audit design-system-audit.json \
            --accessibility-audit accessibility-audit.json \
            --consistency-audit ux-consistency-audit.json \
            --output ux-audit-report.json

      - name: Upload UX audit results
        uses: actions/upload-artifact@v3
        with:
          name: ux-audit-results
          path: |
            ui-component-audit.json
            ux-pattern-audit.json
            design-system-audit.json
            accessibility-audit.json
            ux-consistency-audit.json
            ux-audit-report.json

  analytics-implementation:
    runs-on: ubuntu-latest
    if: github.event.inputs.analytics_action == 'tracking' || github.event.inputs.analytics_action == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install analytics dependencies
        run: |
          flutter pub get
          npm install
          pip install -r requirements.txt
          pip install google-analytics-data
          pip install mixpanel-client
          pip install amplitude-analytics

      - name: Validate analytics configuration
        run: |
          python scripts/validate_analytics_config.py \
            --config-dir analytics/ \
            --output analytics-config-validation.json

      - name: Test analytics tracking implementation
        run: |
          python scripts/test_analytics_tracking.py \
            --source-dir lib/ \
            --output analytics-tracking-test.json

      - name: Test event tracking
        run: |
          python scripts/test_event_tracking.py \
            --event-config analytics/events.json \
            --output event-tracking-test.json

      - name: Test user analytics
        run: |
          python scripts/test_user_analytics.py \
            --analytics-config analytics/user-analytics.json \
            --output user-analytics-test.json

      - name: Test game analytics
        run: |
          python scripts/test_game_analytics.py \
            --analytics-config analytics/game-analytics.json \
            --output game-analytics-test.json

      - name: Test performance analytics
        run: |
          python scripts/test_performance_analytics.py \
            --analytics-config analytics/performance-analytics.json \
            --output performance-analytics-test.json

      - name: Generate analytics implementation report
        run: |
          python scripts/generate_analytics_implementation_report.py \
            --config-validation analytics-config-validation.json \
            --tracking-test analytics-tracking-test.json \
            --event-test event-tracking-test.json \
            --user-test user-analytics-test.json \
            --game-test game-analytics-test.json \
            --performance-test performance-analytics-test.json \
            --output analytics-implementation-report.json

      - name: Upload analytics implementation results
        uses: actions/upload-artifact@v3
        with:
          name: analytics-implementation-results
          path: |
            analytics-config-validation.json
            analytics-tracking-test.json
            event-tracking-test.json
            user-analytics-test.json
            game-analytics-test.json
            performance-analytics-test.json
            analytics-implementation-report.json

  analytics-reporting:
    runs-on: ubuntu-latest
    if: github.event.inputs.analytics_action == 'reporting' || github.event.inputs.analytics_action == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install analytics reporting tools
        run: |
          pip install pandas
          pip install matplotlib
          pip install seaborn
          pip install plotly
          pip install jupyter
          pip install -r requirements.txt

      - name: Generate user analytics report
        run: |
          python scripts/generate_user_analytics_report.py \
            --data-source analytics/data/user-data.json \
            --output user-analytics-report.html

      - name: Generate game analytics report
        run: |
          python scripts/generate_game_analytics_report.py \
            --data-source analytics/data/game-data.json \
            --output game-analytics-report.html

      - name: Generate performance analytics report
        run: |
          python scripts/generate_performance_analytics_report.py \
            --data-source analytics/data/performance-data.json \
            --output performance-analytics-report.html

      - name: Generate business analytics report
        run: |
          python scripts/generate_business_analytics_report.py \
            --data-source analytics/data/business-data.json \
            --output business-analytics-report.html

      - name: Generate comprehensive analytics dashboard
        run: |
          python scripts/generate_analytics_dashboard.py \
            --user-data analytics/data/user-data.json \
            --game-data analytics/data/game-data.json \
            --performance-data analytics/data/performance-data.json \
            --business-data analytics/data/business-data.json \
            --output analytics-dashboard.html

      - name: Upload analytics reports
        uses: actions/upload-artifact@v3
        with:
          name: analytics-reports
          path: |
            user-analytics-report.html
            game-analytics-report.html
            performance-analytics-report.html
            business-analytics-report.html
            analytics-dashboard.html

  analytics-validation:
    runs-on: ubuntu-latest
    if: github.event.inputs.analytics_action == 'validation' || github.event.inputs.analytics_action == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install analytics validation tools
        run: |
          pip install -r requirements.txt
          pip install great-expectations
          pip install pandas-profiling

      - name: Validate data quality
        run: |
          python scripts/validate_analytics_data_quality.py \
            --data-source analytics/data/ \
            --output data-quality-validation.json

      - name: Validate tracking accuracy
        run: |
          python scripts/validate_tracking_accuracy.py \
            --tracking-data analytics/tracking/ \
            --output tracking-accuracy-validation.json

      - name: Validate analytics compliance
        run: |
          python scripts/validate_analytics_compliance.py \
            --compliance-config analytics/compliance/ \
            --output analytics-compliance-validation.json

      - name: Validate privacy requirements
        run: |
          python scripts/validate_privacy_requirements.py \
            --privacy-config analytics/privacy/ \
            --output privacy-validation.json

      - name: Generate analytics validation report
        run: |
          python scripts/generate_analytics_validation_report.py \
            --data-quality data-quality-validation.json \
            --tracking-accuracy tracking-accuracy-validation.json \
            --compliance analytics-compliance-validation.json \
            --privacy privacy-validation.json \
            --output analytics-validation-report.json

      - name: Upload analytics validation results
        uses: actions/upload-artifact@v3
        with:
          name: analytics-validation-results
          path: |
            data-quality-validation.json
            tracking-accuracy-validation.json
            analytics-compliance-validation.json
            privacy-validation.json
            analytics-validation-report.json

  comprehensive-ux-analytics-report:
    needs: [ux-testing, ux-audit, analytics-implementation, analytics-reporting, analytics-validation]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all UX and analytics reports
        uses: actions/download-artifact@v3
        with:
          path: reports

      - name: Generate comprehensive UX and analytics report
        run: |
          python scripts/generate_comprehensive_ux_analytics_report.py \
            --input-dir reports \
            --output comprehensive-ux-analytics-report.json

      - name: Generate executive summary
        run: |
          python scripts/generate_executive_summary.py \
            --comprehensive-report comprehensive-ux-analytics-report.json \
            --output executive-summary.json

      - name: Upload comprehensive reports
        uses: actions/upload-artifact@v3
        with:
          name: comprehensive-ux-analytics-reports
          path: |
            comprehensive-ux-analytics-report.json
            executive-summary.json

  notify-ux-analytics-team:
    needs: [comprehensive-ux-analytics-report]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download comprehensive report
        uses: actions/download-artifact@v3
        with:
          name: comprehensive-ux-analytics-reports
          path: report

      - name: Notify UX and analytics team
        uses: actions/github-script@v6
        with:
          script: |
            const webhookUrl = process.env.UX_ANALYTICS_WEBHOOK_URL;
            const uxAction = '${{ github.event.inputs.ux_action || 'automated' }}';
            const analyticsAction = '${{ github.event.inputs.analytics_action || 'automated' }}';
            
            if (webhookUrl) {
              await fetch(webhookUrl, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  text: `🎨📊 UX and Analytics Completed: ${uxAction} / ${analyticsAction}`,
                  attachments: [{
                    color: 'good',
                    fields: [{
                      title: 'UX Action',
                      value: uxAction,
                      short: true
                    }, {
                      title: 'Analytics Action',
                      value: analyticsAction,
                      short: true
                    }, {
                      title: 'Repository',
                      value: '${{ github.repository }}',
                      short: true
                    }, {
                      title: 'Commit',
                      value: '${{ github.sha }}',
                      short: true
                    }, {
                      title: 'Action URL',
                      value: `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
                      short: false
                    }]
                  }]
                })
              });
            }

  create-ux-analytics-issues:
    needs: [comprehensive-ux-analytics-report]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download comprehensive report
        uses: actions/download-artifact@v3
        with:
          name: comprehensive-ux-analytics-reports
          path: report

      - name: Create UX and analytics issues for critical findings
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('report/comprehensive-ux-analytics-report.json', 'utf8'));
            
            // Create issues for critical UX findings
            if (report.critical_ux_issues && report.critical_ux_issues.length > 0) {
              for (const issue of report.critical_ux_issues) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `🎨 UX Issue: ${issue.title}`,
                  body: `## UX Issue\n\n**Description**: ${issue.description}\n\n**Priority**: Critical\n\n**Component**: ${issue.component}\n\n**Platform**: ${issue.platform}\n\n**Impact**: ${issue.impact}\n\n**Recommendation**: ${issue.recommendation}\n\n**Report**: [View Full Report](${context.payload.html_url})`,
                  labels: ['ux', 'critical', 'automated-finding']
                });
              }
            }
            
            // Create issues for critical analytics findings
            if (report.critical_analytics_issues && report.critical_analytics_issues.length > 0) {
              for (const issue of report.critical_analytics_issues) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `📊 Analytics Issue: ${issue.title}`,
                  body: `## Analytics Issue\n\n**Description**: ${issue.description}\n\n**Priority**: Critical\n\n**Component**: ${issue.component}\n\n**Metric**: ${issue.metric}\n\n**Impact**: ${issue.impact}\n\n**Recommendation**: ${issue.recommendation}\n\n**Report**: [View Full Report](${context.payload.html_url})`,
                  labels: ['analytics', 'critical', 'automated-finding']
                });
              }
            }

  update-ux-analytics-dashboard:
    needs: [comprehensive-ux-analytics-report]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download comprehensive report
        uses: actions/download-artifact@v3
        with:
          name: comprehensive-ux-analytics-reports
          path: report

      - name: Update UX and analytics dashboard
        run: |
          echo "Updating UX and analytics dashboard with latest results..."
          # Add dashboard update logic here

      - name: Update UX and analytics metrics
        run: |
          echo "Updating UX and analytics metrics..."
          # Add metrics update logic here

  cleanup:
    needs: [ux-testing, ux-audit, analytics-implementation, analytics-reporting, analytics-validation]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Cleanup UX and analytics artifacts
        run: |
          echo "Cleaning up UX and analytics artifacts..."
          # Add cleanup logic here
