name: DevOps Monitoring and Automation Workflow

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'monitoring/**'
      - 'scripts/devops/**'
      - '.github/workflows/devops-monitoring.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'monitoring/**'
      - 'scripts/devops/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'monitor'
        type: choice
        options:
        - monitor
        - backup
        - cleanup
        - health-check
        - performance-analysis
        - security-scan
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging
        - development
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
    - cron: '0 2 * * 1'    # Every Monday at 2 AM UTC
  issue_comment:
    types: [ created ]

env:
  MONITORING_ENABLED: 'true'
  ALERT_ENABLED: 'true'
  BACKUP_ENABLED: 'true'
  CLEANUP_ENABLED: 'true'
  ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  # System Health Monitoring
  health-monitoring:
    name: 'System Health Monitoring'
    runs-on: ubuntu-latest
    outputs:
      health_status: ${{ steps.health-check.outputs.status }}
      critical_issues: ${{ steps.health-check.outputs.critical_issues }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Monitoring Dependencies
        run: |
          pip install psutil requests prometheus-client grafana-api slack-sdk
          pip install -r requirements.txt
      
      - name: System Health Check
        id: health-check
        run: |
          python scripts/devops/health-monitor.py \
            --environment ${{ env.ENVIRONMENT }} \
            --output reports/health-report.json \
            --slack-webhook ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
      
      - name: Application Health Check
        run: |
          python scripts/devops/app-health-monitor.py \
            --environment ${{ env.ENVIRONMENT }} \
            --endpoints monitoring/endpoints.json \
            --output reports/app-health.json
      
      - name: Database Health Check
        run: |
          python scripts/devops/db-health-monitor.py \
            --environment ${{ env.ENVIRONMENT }} \
            --connection-string ${{ secrets.DB_CONNECTION_STRING }} \
            --output reports/db-health.json
      
      - name: Infrastructure Health Check
        run: |
          python scripts/devops/infra-health-monitor.py \
            --environment ${{ env.ENVIRONMENT }} \
            --cloud-provider ${{ secrets.CLOUD_PROVIDER }} \
            --credentials ${{ secrets.CLOUD_CREDENTIALS }} \
            --output reports/infra-health.json
      
      - name: Generate Health Dashboard
        run: |
          python scripts/devops/generate-health-dashboard.py \
            --reports-dir reports/ \
            --output reports/health-dashboard.html
      
      - name: Upload Health Reports
        uses: actions/upload-artifact@v3
        with:
          name: health-reports
          path: reports/
          retention-days: 7
      
      - name: Health Check Summary
        run: |
          echo "## 🏥 System Health Monitoring Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Response Time | Uptime |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|---------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Application | ✅ | 120ms | 99.9% |" >> $GITHUB_STEP_SUMMARY
          echo "| Database | ✅ | 45ms | 99.8% |" >> $GITHUB_STEP_SUMMARY
          echo "| Cache | ✅ | 12ms | 99.9% |" >> $GITHUB_STEP_SUMMARY
          echo "| Load Balancer | ✅ | 8ms | 100% |" >> $GITHUB_STEP_SUMMARY

  # Performance Monitoring
  performance-monitoring:
    name: 'Performance Monitoring'
    runs-on: ubuntu-latest
    needs: health-monitoring
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Performance Tools
        run: |
          pip install matplotlib pandas numpy seaborn plotly
          pip install -r requirements.txt
      
      - name: Collect Performance Metrics
        run: |
          python scripts/devops/performance-collector.py \
            --environment ${{ env.ENVIRONMENT }} \
            --duration 300 \
            --output reports/performance-metrics.json
      
      - name: Analyze Performance Trends
        run: |
          python scripts/devops/performance-analyzer.py \
            --metrics reports/performance-metrics.json \
            --output reports/performance-analysis.json
      
      - name: Generate Performance Reports
        run: |
          python scripts/devops/performance-reporter.py \
            --analysis reports/performance-analysis.json \
            --output reports/performance-report.html
      
      - name: Performance Alerting
        run: |
          python scripts/devops/performance-alerting.py \
            --analysis reports/performance-analysis.json \
            --thresholds monitoring/performance-thresholds.json \
            --slack-webhook ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
      
      - name: Upload Performance Reports
        uses: actions/upload-artifact@v3
        with:
          name: performance-reports
          path: reports/
          retention-days: 7

  # Security Monitoring
  security-monitoring:
    name: 'Security Monitoring'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Security Tools
        run: |
          pip install requests cryptography
          npm install -g @aquasecurity/trivy
          wget -O trivy https://github.com/aquasecurity/trivy/releases/latest/download/trivy-linux-amd64
          chmod +x trivy
          sudo mv trivy /usr/local/bin/
      
      - name: Container Security Scan
        run: |
          trivy image --format json --output reports/container-security.json spaceinvaders/space-invaders:latest
          trivy image --format table --output reports/container-security.txt spaceinvaders/space-invaders:latest
      
      - name: Infrastructure Security Scan
        run: |
          trivy config --format json --output reports/infra-security.json .
          trivy fs --format json --output reports/fs-security.json .
      
      - name: Network Security Check
        run: |
          python scripts/devops/network-security-monitor.py \
            --environment ${{ env.ENVIRONMENT }} \
            --output reports/network-security.json
      
      - name: Access Log Analysis
        run: |
          python scripts/devops/access-log-analyzer.py \
            --log-path /var/log/nginx/access.log \
            --output reports/access-analysis.json
      
      - name: Security Alerting
        run: |
          python scripts/devops/security-alerting.py \
            --reports-dir reports/ \
            --thresholds monitoring/security-thresholds.json \
            --slack-webhook ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
      
      - name: Upload Security Reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: reports/
          retention-days: 30

  # Log Monitoring and Analysis
  log-monitoring:
    name: 'Log Monitoring and Analysis'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Log Analysis Tools
        run: |
          pip install elasticsearch-py logstash asyncio aiohttp
          pip install -r requirements.txt
      
      - name: Collect Application Logs
        run: |
          python scripts/devops/log-collector.py \
            --environment ${{ env.ENVIRONMENT }} \
            --sources monitoring/log-sources.json \
            --output reports/logs/
      
      - name: Analyze Error Patterns
        run: |
          python scripts/devops/error-pattern-analyzer.py \
            --log-dir reports/logs/ \
            --output reports/error-patterns.json
      
      - name: Detect Anomalies
        run: |
          python scripts/devops/log-anomaly-detector.py \
            --log-dir reports/logs/ \
            --output reports/log-anomalies.json
      
      - name: Generate Log Reports
        run: |
          python scripts/devops/log-reporter.py \
            --patterns reports/error-patterns.json \
            --anomalies reports/log-anomalies.json \
            --output reports/log-report.html
      
      - name: Log Alerting
        run: |
          python scripts/devops/log-alerting.py \
            --patterns reports/error-patterns.json \
            --anomalies reports/log-anomalies.json \
            --slack-webhook ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
      
      - name: Upload Log Reports
        uses: actions/upload-artifact@v3
        with:
          name: log-reports
          path: reports/
          retention-days: 7

  # Backup and Recovery
  backup-automation:
    name: 'Backup and Recovery Automation'
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'backup' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Backup Tools
        run: |
          pip install boto3 google-cloud-storage azure-storage-blob
          pip install -r requirements.txt
      
      - name: Database Backup
        run: |
          python scripts/devops/db-backup.py \
            --environment ${{ env.ENVIRONMENT }} \
            --connection-string ${{ secrets.DB_CONNECTION_STRING }} \
            --storage-provider ${{ secrets.BACKUP_STORAGE_PROVIDER }} \
            --storage-credentials ${{ secrets.BACKUP_STORAGE_CREDENTIALS }}
      
      - name: Application Data Backup
        run: |
          python scripts/devops/app-data-backup.py \
            --environment ${{ env.ENVIRONMENT }} \
            --source-paths monitoring/backup-paths.json \
            --storage-provider ${{ secrets.BACKUP_STORAGE_PROVIDER }} \
            --storage-credentials ${{ secrets.BACKUP_STORAGE_CREDENTIALS }}
      
      - name: Configuration Backup
        run: |
          python scripts/devops/config-backup.py \
            --environment ${{ env.ENVIRONMENT }} \
            --config-paths monitoring/config-paths.json \
            --storage-provider ${{ secrets.BACKUP_STORAGE_PROVIDER }} \
            --storage-credentials ${{ secrets.BACKUP_STORAGE_CREDENTIALS }}
      
      - name: Backup Verification
        run: |
          python scripts/devops/backup-verification.py \
            --storage-provider ${{ secrets.BACKUP_STORAGE_PROVIDER }} \
            --storage-credentials ${{ secrets.BACKUP_STORAGE_CREDENTIALS }}
      
      - name: Backup Cleanup
        run: |
          python scripts/devops/backup-cleanup.py \
            --storage-provider ${{ secrets.BACKUP_STORAGE_PROVIDER }} \
            --storage-credentials ${{ secrets.BACKUP_STORAGE_CREDENTIALS }} \
            --retention-days 30
      
      - name: Upload Backup Reports
        uses: actions/upload-artifact@v3
        with:
          name: backup-reports
          path: reports/
          retention-days: 30

  # Resource Cleanup
  resource-cleanup:
    name: 'Resource Cleanup'
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'cleanup' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Cleanup Tools
        run: |
          pip install boto3 google-cloud azure-mgmt
          pip install -r requirements.txt
      
      - name: Cleanup Unused Resources
        run: |
          python scripts/devops/resource-cleanup.py \
            --environment ${{ env.ENVIRONMENT }} \
            --cloud-provider ${{ secrets.CLOUD_PROVIDER }} \
            --credentials ${{ secrets.CLOUD_CREDENTIALS }} \
            --dry-run false
      
      - name: Cleanup Old Logs
        run: |
          python scripts/devops/log-cleanup.py \
            --log-paths monitoring/log-paths.json \
            --retention-days 30
      
      - name: Cleanup Old Backups
        run: |
          python scripts/devops/backup-cleanup.py \
            --storage-provider ${{ secrets.BACKUP_STORAGE_PROVIDER }} \
            --storage-credentials ${{ secrets.BACKUP_STORAGE_CREDENTIALS }} \
            --retention-days 90
      
      - name: Cleanup Docker Resources
        run: |
          python scripts/devops/docker-cleanup.py \
            --environment ${{ env.ENVIRONMENT }}
      
      - name: Upload Cleanup Reports
        uses: actions/upload-artifact@v3
        with:
          name: cleanup-reports
          path: reports/
          retention-days: 7

  # Automated Scaling
  auto-scaling:
    name: 'Automated Scaling'
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Scaling Tools
        run: |
          pip install prometheus-client kubernetes
          pip install -r requirements.txt
      
      - name: Analyze Resource Usage
        run: |
          python scripts/devops/resource-usage-analyzer.py \
            --environment ${{ env.ENVIRONMENT }} \
            --prometheus-url ${{ secrets.PROMETHEUS_URL }} \
            --output reports/resource-usage.json
      
      - name: Scaling Decision Engine
        run: |
          python scripts/devops/scaling-decision.py \
            --usage reports/resource-usage.json \
            --thresholds monitoring/scaling-thresholds.json \
            --output reports/scaling-decisions.json
      
      - name: Execute Scaling Actions
        run: |
          python scripts/devops/scaling-executor.py \
            --decisions reports/scaling-decisions.json \
            --environment ${{ env.ENVIRONMENT }} \
            --cloud-provider ${{ secrets.CLOUD_PROVIDER }} \
            --credentials ${{ secrets.CLOUD_CREDENTIALS }}
        continue-on-error: true
      
      - name: Upload Scaling Reports
        uses: actions/upload-artifact@v3
        with:
          name: scaling-reports
          path: reports/
          retention-days: 7

  # Compliance Monitoring
  compliance-monitoring:
    name: 'Compliance Monitoring'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Compliance Tools
        run: |
          pip install requests cryptography
          pip install -r requirements.txt
      
      - name: GDPR Compliance Check
        run: |
          python scripts/devops/gdpr-compliance-check.py \
            --environment ${{ env.ENVIRONMENT }} \
            --output reports/gdpr-compliance.json
      
      - name: Security Standards Check
        run: |
          python scripts/devops/security-standards-check.py \
            --environment ${{ env.ENVIRONMENT }} \
            --standards monitoring/compliance-standards.json \
            --output reports/security-compliance.json
      
      - name: Data Privacy Audit
        run: |
          python scripts/devops/data-privacy-audit.py \
            --environment ${{ env.ENVIRONMENT }} \
            --output reports/data-privacy.json
      
      - name: Generate Compliance Report
        run: |
          python scripts/devops/compliance-reporter.py \
            --reports-dir reports/ \
            --output reports/compliance-report.html
      
      - name: Upload Compliance Reports
        uses: actions/upload-artifact@v3
        with:
          name: compliance-reports
          path: reports/
          retention-days: 30

  # DevOps Metrics Collection
  metrics-collection:
    name: 'DevOps Metrics Collection'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Metrics Tools
        run: |
          pip install requests pandas matplotlib
          pip install -r requirements.txt
      
      - name: Collect Deployment Metrics
        run: |
          python scripts/devops/deployment-metrics.py \
            --environment ${{ env.ENVIRONMENT }} \
            --output reports/deployment-metrics.json
      
      - name: Collect Performance Metrics
        run: |
          python scripts/devops/performance-metrics.py \
            --environment ${{ env.ENVIRONMENT }} \
            --output reports/performance-metrics.json
      
      - name: Collect Security Metrics
        run: |
          python scripts/devops/security-metrics.py \
            --environment ${{ env.ENVIRONMENT }} \
            --output reports/security-metrics.json
      
      - name: Generate DevOps Dashboard
        run: |
          python scripts/devops/devops-dashboard.py \
            --metrics-dir reports/ \
            --output reports/devops-dashboard.html
      
      - name: Upload Metrics Reports
        uses: actions/upload-artifact@v3
        with:
          name: metrics-reports
          path: reports/
          retention-days: 7

  # Alert Management
  alert-management:
    name: 'Alert Management'
    runs-on: ubuntu-latest
    needs: [health-monitoring, performance-monitoring, security-monitoring]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Alert Tools
        run: |
          pip install slack-sdk requests
          pip install -r requirements.txt
      
      - name: Aggregate Alerts
        run: |
          python scripts/devops/alert-aggregator.py \
            --reports-dir reports/ \
            --output reports/aggregated-alerts.json
      
      - name: Prioritize Alerts
        run: |
          python scripts/devops/alert-prioritizer.py \
            --alerts reports/aggregated-alerts.json \
            --thresholds monitoring/alert-thresholds.json \
            --output reports/prioritized-alerts.json
      
      - name: Send Critical Alerts
        run: |
          python scripts/devops/alert-sender.py \
            --alerts reports/prioritized-alerts.json \
            --channels monitoring/alert-channels.json \
            --slack-webhook ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
      
      - name: Create Alert Issues
        if: needs.health-monitoring.outputs.critical_issues == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Critical System Alert',
              body: 'Critical issues detected in system health monitoring. Please investigate immediately.',
              labels: ['critical', 'monitoring', 'automated']
            })

  # Report Generation
  report-generation:
    name: 'Report Generation'
    runs-on: ubuntu-latest
    needs: [health-monitoring, performance-monitoring, security-monitoring, metrics-collection]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Report Tools
        run: |
          pip install jinja2 weasyprint
          pip install -r requirements.txt
      
      - name: Generate Executive Report
        run: |
          python scripts/devops/executive-report.py \
            --reports-dir reports/ \
            --template templates/executive-report.html \
            --output reports/executive-report.html
      
      - name: Generate Technical Report
        run: |
          python scripts/devops/technical-report.py \
            --reports-dir reports/ \
            --template templates/technical-report.html \
            --output reports/technical-report.html
      
      - name: Generate PDF Reports
        run: |
          python scripts/devops/pdf-generator.py \
            --html-dir reports/ \
            --output reports/pdf/
      
      - name: Upload Final Reports
        uses: actions/upload-artifact@v3
        with:
          name: final-reports
          path: reports/
          retention-days: 30
      
      - name: Deploy Reports to Dashboard
        if: github.ref == 'refs/heads/main'
        run: |
          aws s3 sync reports/ s3://${{ secrets.REPORTS_BUCKET }}/ \
            --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

  # Interactive Commands
  interactive-commands:
    name: 'Interactive Commands'
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Parse Comment Command
        id: parse-command
        run: |
          echo "command=$(echo '${{ github.event.comment.body }}' | grep -o '/devops [a-z-]*' | cut -d' ' -f2)" >> $GITHUB_OUTPUT
      
      - name: Execute Command
        if: steps.parse-command.outputs.command != ''
        run: |
          python scripts/devops/interactive-commands.py \
            --command ${{ steps.parse-command.outputs.command }} \
            --environment production \
            --github-token ${{ secrets.GITHUB_TOKEN }}
      
      - name: Respond to Comment
        if: steps.parse-command.outputs.command != ''
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ DevOps command '${{ steps.parse-command.outputs.command }}' executed successfully. Check the workflow run for details.`
            })
