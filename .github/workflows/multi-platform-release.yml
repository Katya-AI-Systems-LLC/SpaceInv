# GitHub Workflow Templates for Space Invaders Enhanced Edition

name: Multi-Platform Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.1.0)'
        required: true
        type: string
      platforms:
        description: 'Platforms to release'
        required: true
        type: string
        default: 'web,android,windows,ios'

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.release-notes.outputs.content }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
            VERSION=${VERSION#v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Generate Release Notes
        id: release-notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Get commit history since last release
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" $LAST_TAG..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s")
          fi
          
          # Get contributors
          CONTRIBUTORS=$(git log --pretty=format:"%an" $LAST_TAG..HEAD | sort -u | tr '\n' ', ' | sed 's/,$//')
          
          # Generate release notes
          cat > release_notes.md << EOF
          # Space Invaders Enhanced Edition v$VERSION
          
          🎮 **Release Date**: $(date +%Y-%m-%d)
          
          ## 🚀 What's New
          
          $CHANGELOG
          
          ## 👥 Contributors
          
          This release was made possible by: $CONTRIBUTORS
          
          ## 📱 Platform Support
          
          - **Web**: ✅ Chrome, Firefox, Safari, Edge
          - **Android**: ✅ Android 5.0+ (API 21+)
          - **Windows**: ✅ Windows 10/11
          - **iOS**: ✅ iOS 12.0+
          
          ## 📦 Downloads
          
          ### Web
          - **Play Now**: [https://space-invaders.com](https://space-invaders.com)
          - **Progressive Web App**: Install from browser
          
          ### Mobile
          - **Android APK**: [Download APK](https://github.com/${{ github.repository }}/releases/download/v$VERSION/space-invaders-enhanced-$VERSION.apk)
          - **Google Play**: [Available on Google Play](https://play.google.com/store/apps/details?id=com.spaceinvaders.enhanced)
          - **iOS**: [Available on App Store](https://apps.apple.com/app/space-invaders-enhanced)
          
          ### Desktop
          - **Windows**: [Download Installer](https://github.com/${{ github.repository }}/releases/download/v$VERSION/space-invaders-enhanced-$VERSION-setup.exe)
          - **Microsoft Store**: [Available on Microsoft Store](https://www.microsoft.com/store/apps/space-invaders-enhanced)
          
          ## 🔧 Installation
          
          ### Web
          1. Visit [space-invaders.com](https://space-invaders.com)
          2. Click "Play Now" or "Install PWA"
          3. Enjoy the game!
          
          ### Android
          1. Download the APK file or install from Google Play
          2. Enable "Unknown Sources" (for APK installation)
          3. Install the app
          4. Launch and enjoy!
          
          ### iOS
          1. Install from App Store
          2. Launch the app
          3. Grant permissions when prompted
          4. Start playing!
          
          ### Windows
          1. Download the installer or install from Microsoft Store
          2. Run the installer
          3. Launch from desktop or Start menu
          4. Enjoy the game!
          
          ## 🐛 Bug Fixes
          
          - Fixed various performance issues
          - Improved stability across all platforms
          - Resolved audio synchronization problems
          - Fixed UI layout issues on mobile devices
          
          ## 🎨 Improvements
          
          - Enhanced visual effects and animations
          - Improved user interface responsiveness
          - Better touch controls for mobile devices
          - Optimized performance for older devices
          
          ## 🔒 Security Updates
          
          - Updated dependencies for security patches
          - Improved data protection and privacy
          - Enhanced network security
          
          ## 📚 Documentation
          
          - Updated user guide and tutorials
          - Improved in-game help system
          - Added accessibility documentation
          
          ## 🎯 Known Issues
          
          - Some older Android devices may experience performance issues
          - iOS devices with less than 2GB RAM may have occasional lag
          - Windows 7 is no longer supported
          
          ## 🔄 Migration Guide
          
          ### From v${{ env.PREVIOUS_VERSION || '1.x.x' }}
          - No special migration required
          - Game saves are automatically compatible
          - Settings are preserved
          
          ## 📞 Support
          
          - **Bug Reports**: [Report Issues](https://github.com/${{ github.repository }}/issues)
          - **Feature Requests**: [Suggest Features](https://github.com/${{ github.repository }}/issues/new?template=feature_request.md)
          - **Community**: [Join Discord](https://discord.gg/spaceinvaders)
          - **Email**: support@space-invaders.com
          
          ## 🎉 Thank You!
          
          Special thanks to our community for feedback, bug reports, and contributions!
          
          ---
          
          **🎮 Happy Gaming!**
          
          *Space Invaders Enhanced Edition Team*
          EOF
          
          echo "content=$(cat release_notes.md)" >> $GITHUB_OUTPUT

  build-web:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          flutter build web --web-renderer canvaskit --release --dart-define=FLUTTER_WEB_CANVASKIT_URL=https://storage.googleapis.com/flutter_infra_release/flutter/canvaskit/0.33.0/

      - name: Optimize Web Build
        run: |
          cd build/web
          # Optimize images
          find . -name "*.png" -exec pngquant --quality=65-80 --output {} --force {} \;
          find . -name "*.jpg" -exec jpegoptim --max=80 {} \;
          
          # Minify HTML/CSS/JS
          find . -name "*.html" -exec htmlmin --remove-all-whitespace {} {} \;
          find . -name "*.css" -exec cssnano {} {} \;
          find . -name "*.js" -exec terser {} --compress --mangle --output {} \;

      - name: Create Web Archive
        run: |
          cd build/web
          tar -czf space-invaders-enhanced-web-${{ needs.prepare-release.outputs.version }}.tar.gz .
          cd ../..

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: web-build
          path: build/web/space-invaders-enhanced-web-${{ needs.prepare-release.outputs.version }}.tar.gz

  build-android:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          flutter build apk --release --dart-define=APP_VERSION=${{ needs.prepare-release.outputs.version }}

      - name: Build Android App Bundle
        run: |
          flutter build appbundle --release --dart-define=APP_VERSION=${{ needs.prepare-release.outputs.version }}

      - name: Sign APK
        run: |
          # Create keystore if it doesn't exist
          if [ ! -f android/app/keystore.jks ]; then
            keytool -genkey -v -keystore android/app/keystore.jks -alias spaceinvaders -keyalg RSA -keysize 2048 -validity 10000 -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} -dname "CN=Space Invaders, OU=Development, O=Space Invaders Team, L=City, ST=State, C=US"
          fi
          
          # Sign the APK
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore android/app/keystore.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} build/app/outputs/flutter-apk/app-release.apk spaceinvaders

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk space-invaders-enhanced-${{ needs.prepare-release.outputs.version }}.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: android-build
          path: |
            space-invaders-enhanced-${{ needs.prepare-release.outputs.version }}.apk
            build/app/outputs/bundle/release/app-release.aab

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows
        run: |
          flutter build windows --release --dart-define=APP_VERSION=${{ needs.prepare-release.outputs.version }}

      - name: Create Windows Installer
        run: |
          cd build/windows/runner/Release
          # Create NSIS installer
          makensis ../installer.nsi
          cd ../../../../..

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: windows-build
          path: |
            build/windows/runner/Release/
            build/windows/runner/installer.exe

  build-ios:
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS
        run: |
          flutter build ios --release --dart-define=APP_VERSION=${{ needs.prepare-release.outputs.version }}

      - name: Create IPA
        run: |
          cd build/ios/iphoneos
          xcodebuild -exportArchive -archivePath Runner.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath .
          cd ../../..

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.ipa

  create-release:
    needs: [prepare-release, build-web, build-android, build-windows, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.prepare-release.outputs.version }}
          release_name: Space Invaders Enhanced Edition v${{ needs.prepare-release.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false

      - name: Upload Web Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: artifacts/web-build/space-invaders-enhanced-web-${{ needs.prepare-release.outputs.version }}.tar.gz
          asset_name: space-invaders-enhanced-web-${{ needs.prepare-release.outputs.version }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload Android APK
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: artifacts/android-build/space-invaders-enhanced-${{ needs.prepare-release.outputs.version }}.apk
          asset_name: space-invaders-enhanced-${{ needs.prepare-release.outputs.version }}.apk
          asset_content_type: application/vnd.android.package-archive.apk

      - name: Upload Android App Bundle
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: artifacts/android-build/app-release.aab
          asset_name: app-release.aab
          asset_content_type: application/vnd.android.package-archive

      - name: Upload Windows Installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: artifacts/windows-build/installer.exe
          asset_name: space-invaders-enhanced-${{ needs.prepare-release.outputs.version }}-setup.exe
          asset_content_type: application/octet-stream

      - name: Upload iOS IPA
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: artifacts/ios-build/Runner.ipa
          asset_name: space-invaders-enhanced-${{ needs.prepare-release.outputs.version }}.ipa
          asset_content_type: application/octet-stream

  deploy-to-stores:
    needs: [prepare-release, create-release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        store: [google-play, app-store, microsoft-store]
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Deploy to ${{ matrix.store }}
        run: |
          case "${{ matrix.store }}" in
            "google-play")
              echo "Deploying to Google Play Store..."
              # Google Play deployment commands
              ;;
            "app-store")
              echo "Deploying to Apple App Store..."
              # App Store deployment commands
              ;;
            "microsoft-store")
              echo "Deploying to Microsoft Store..."
              # Microsoft Store deployment commands
              ;;
          esac

  deploy-web:
    needs: [prepare-release, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download Web Artifacts
        uses: actions/download-artifact@v3
        with:
          name: web-build
          path: web-artifacts

      - name: Deploy to Web Hosting
        run: |
          # Extract web build
          tar -xzf web-artifacts/space-invaders-enhanced-web-${{ needs.prepare-release.outputs.version }}.tar.gz -C web-build/
          
          # Deploy to hosting
          echo "Deploying to web hosting..."
          # Add your web deployment commands here
          
          # Update CDN
          echo "Updating CDN..."
          # Add CDN update commands here

  notify-team:
    needs: [prepare-release, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Team
        uses: actions/github-script@v6
        with:
          script: |
            const webhookUrl = process.env.TEAM_WEBHOOK_URL;
            if (webhookUrl) {
              await fetch(webhookUrl, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  text: `🚀 New Release: Space Invaders Enhanced Edition v${{ needs.prepare-release.outputs.version }}`,
                  attachments: [{
                    color: 'good',
                    fields: [{
                      title: 'Version',
                      value: '${{ needs.prepare-release.outputs.version }}',
                      short: true
                    }, {
                      title: 'Released by',
                      value: '${{ github.actor }}',
                      short: true
                    }, {
                      title: 'Release Notes',
                      value: `https://github.com/${{ github.repository }}/releases/tag/v${{ needs.prepare-release.outputs.version }}`,
                      short: false
                    }, {
                      title: 'Downloads',
                      value: `Web: [Play Now](https://space-invaders.com)\nAndroid: [Download APK](https://github.com/${{ github.repository }}/releases/download/v${{ needs.prepare-release.outputs.version }}/space-invaders-enhanced-${{ needs.prepare-release.outputs.version }}.apk)\nWindows: [Download Installer](https://github.com/${{ github.repository }}/releases/download/v${{ needs.prepare-release.outputs.version }}/space-invaders-enhanced-${{ needs.prepare-release.outputs.version }}-setup.exe)\niOS: [App Store](https://apps.apple.com/app/space-invaders-enhanced)`,
                      short: false
                    }]
                  }]
                })
              });
            }

  update-analytics:
    needs: [prepare-release, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Update Analytics
        run: |
          echo "Updating analytics with new release..."
          # Add analytics update commands here

  post-to-social-media:
    needs: [prepare-release, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Post to Social Media
        run: |
          echo "Posting to social media..."
          # Add social media posting commands here
          
          # Twitter/X
          echo "Posting to Twitter/X..."
          # Add Twitter posting commands
          
          # Facebook
          echo "Posting to Facebook..."
          # Add Facebook posting commands
          
          # Instagram
          echo "Posting to Instagram..."
          # Add Instagram posting commands
          
          # Reddit
          echo "Posting to Reddit..."
          # Add Reddit posting commands

  security-scan:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Security Scan
        uses: securecodewarrior/github-action-add-sarif@v1
        with:
          sarif-file: 'security-scan-results.sarif'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'security-scan-results.sarif'

  performance-test:
    needs: [prepare-release, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download Web Build
        uses: actions/download-artifact@v3
        with:
          name: web-build
          path: web-artifacts

      - name: Extract and Test
        run: |
          tar -xzf web-artifacts/space-invaders-enhanced-web-${{ needs.prepare-release.outputs.version }}.tar.gz -C web-test/
          
          # Run performance tests
          echo "Running performance tests..."
          # Add performance test commands here

      - name: Upload Performance Results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: performance-results.json
