name: Yandex Cloud CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Run tests
      run: flutter test --coverage
    
    - name: Analyze code
      run: flutter analyze
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: coverage/lcov.info

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Build web version
      run: flutter build web --web-renderer canvaskit --release
    
    - name: Setup Yandex Cloud CLI
      run: |
        curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
        echo 'export PATH=$PATH:$HOME/yandex-cloud/bin' >> $HOME/.bashrc
        source $HOME/.bashrc
        yc config profile create sa-profile
        yc config set service-account-key ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}
        yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
    
    - name: Deploy to Yandex Cloud Storage
      run: |
        source $HOME/.bashrc
        yc storage s3 cp --recursive build/web/ s3://${{ secrets.YC_BUCKET_NAME }}/ --endpoint-url=https://storage.yandexcloud.net
    
    - name: Setup CDN
      run: |
        source $HOME/.bashrc
        yc cdn cache invalidate --folder-id ${{ secrets.YC_FOLDER_ID }} --path "/*"

  deploy-to-app-platform:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Build web version
      run: flutter build web --web-renderer canvaskit --release
    
    - name: Deploy to Yandex App Platform
      run: |
        # Install Yandex Cloud CLI
        curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
        echo 'export PATH=$PATH:$HOME/yandex-cloud/bin' >> $HOME/.bashrc
        source $HOME/.bashrc
        
        # Configure Yandex Cloud
        yc config profile create sa-profile
        yc config set service-account-key ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}
        yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
        
        # Deploy to App Platform
        yc serverless app create \
          --name space-invaders-app \
          --runtime nodejs16 \
          --entrypoint index.js \
          --memory 512m \
          --execution-timeout 10s
        
        yc serverless app version create \
          --app-name space-invaders-app \
          --runtime nodejs16 \
          --entrypoint index.js \
          --memory 512m \
          --execution-timeout 10s \
          --source-path build/web/
