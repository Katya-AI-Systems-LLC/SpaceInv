name: Performance and Scalability Testing Workflow

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docker-compose*.yml'
      - 'k8s/**'
      - 'terraform/**'
      - '.github/workflows/performance-scalability.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docker-compose*.yml'
      - 'k8s/**'
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Performance test type'
        required: true
        default: 'load'
        type: choice
        options:
        - load
        - stress
        - spike
        - endurance
        - scalability
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
        - development
      concurrent_users:
        description: 'Number of concurrent users'
        required: false
        default: '100'
        type: string
      test_duration:
        description: 'Test duration in seconds'
        required: false
        default: '300'
        type: string
      ramp_up_time:
        description: 'Ramp up time in seconds'
        required: false
        default: '60'
        type: string
      create_report:
        description: 'Create performance report'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC

env:
  TEST_TYPE: ${{ github.event.inputs.test_type || 'load' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
  CONCURRENT_USERS: ${{ github.event.inputs.concurrent_users || '100' }}
  TEST_DURATION: ${{ github.event.inputs.test_duration || '300' }}
  RAMP_UP_TIME: ${{ github.event.inputs.ramp_up_time || '60' }}
  CREATE_REPORT: ${{ github.event.inputs.create_report || 'true' }}

jobs:
  # Performance Testing Setup
  performance-setup:
    name: Performance Testing Setup
    runs-on: ubuntu-latest
    outputs:
      test-environment: ${{ steps.setup.outputs.test-environment }}
      target-url: ${{ steps.setup.outputs.target-url }}
      test-config: ${{ steps.setup.outputs.test-config }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install performance testing tools
        run: |
          pip install locust pytest pytest-html pytest-benchmark
          pip install k6 influxdb-client prometheus-client
          pip install matplotlib seaborn pandas
          pip install -r requirements.txt || true

      - name: Setup test environment
        id: setup
        run: |
          # Determine target URL based on environment
          if [ "$ENVIRONMENT" = "production" ]; then
            TARGET_URL="https://space-invaders.com"
          elif [ "$ENVIRONMENT" = "staging" ]; then
            TARGET_URL="https://staging.space-invaders.com"
          else
            TARGET_URL="http://localhost:8080"
          fi
          
          # Create test configuration
          cat > performance-test-config.json << EOF
          {
            "test_type": "$TEST_TYPE",
            "environment": "$ENVIRONMENT",
            "target_url": "$TARGET_URL",
            "concurrent_users": $CONCURRENT_USERS,
            "test_duration": $TEST_DURATION,
            "ramp_up_time": $RAMP_UP_TIME,
            "endpoints": [
              {
                "name": "home_page",
                "url": "$TARGET_URL/",
                "method": "GET",
                "weight": 30
              },
              {
                "name": "api_health",
                "url": "$TARGET_URL/api/health",
                "method": "GET",
                "weight": 20
              },
              {
                "name": "api_users",
                "url": "$TARGET_URL/api/users",
                "method": "GET",
                "weight": 25
              },
              {
                "name": "api_games",
                "url": "$TARGET_URL/api/games",
                "method": "GET",
                "weight": 25
              }
            ],
            "thresholds": {
              "response_time_p95": 2000,
              "response_time_p99": 5000,
              "error_rate": 0.01,
              "throughput_min": 100
            }
          }
          EOF
          
          echo "test-environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "target-url=$TARGET_URL" >> $GITHUB_OUTPUT
          echo "test-config=performance-test-config.json" >> $GITHUB_OUTPUT

      - name: Upload test configuration
        uses: actions/upload-artifact@v3
        with:
          name: performance-config
          path: performance-test-config.json
          retention-days: 7

  # Load Testing
  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest
    needs: performance-setup
    if: env.TEST_TYPE == 'load' || env.TEST_TYPE == 'scalability'
    outputs:
      load-test-results: ${{ steps.locust.outputs.results-path }}
      performance-metrics: ${{ steps.locust.outputs.metrics }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install performance testing tools
        run: |
          pip install locust pytest matplotlib seaborn pandas

      - name: Download test configuration
        uses: actions/download-artifact@v3
        with:
          name: performance-config

      - name: Start application services
        run: |
          # Start services for testing
          docker-compose -f docker-compose.test.yml up -d
          sleep 30

      - name: Run Locust load testing
        id: locust
        run: |
          # Create Locustfile
          cat > locustfile.py << 'EOF'
          from locust import HttpUser, task, between
          import json
          import random
          
          # Load test configuration
          with open('performance-test-config.json', 'r') as f:
              config = json.load(f)
          
          class SpaceInvadersUser(HttpUser):
              wait_time = between(1, 3)
              
              def on_start(self):
                  """Called when a user starts"""
                  self.endpoints = config['endpoints']
              
              @task(30)
              def home_page(self):
                  """Load home page"""
                  endpoint = random.choice([e for e in self.endpoints if e['name'] == 'home_page'])
                  self.client.get(endpoint['url'])
              
              @task(20)
              def api_health(self):
                  """Check API health"""
                  endpoint = random.choice([e for e in self.endpoints if e['name'] == 'api_health'])
                  self.client.get(endpoint['url'])
              
              @task(25)
              def api_users(self):
                  """Load users API"""
                  endpoint = random.choice([e for e in self.endpoints if e['name'] == 'api_users'])
                  self.client.get(endpoint['url'])
              
              @task(25)
              def api_games(self):
                  """Load games API"""
                  endpoint = random.choice([e for e in self.endpoints if e['name'] == 'api_games'])
                  self.client.get(endpoint['url'])
          EOF
          
          # Run Locust
          locust -f locustfile.py \
            --host ${{ needs.performance-setup.outputs.target-url }} \
            --users $CONCURRENT_USERS \
            --spawn-rate ${{ fromJson(needs.performance-setup.outputs.test-config).concurrent_users / 10 }} \
            --run-time $TEST_DURATION \
            --html load-test-report.html \
            --csv load-test-results.csv \
            --headless \
            --exit-code-on-error 1 || true
          
          echo "results-path=load-test-results.csv" >> $GITHUB_OUTPUT
          
          # Extract metrics
          python scripts/performance/extract-locust-metrics.py \
            --csv-file load-test-results.csv \
            --output load-test-metrics.json
          
          echo "metrics=load-test-metrics.json" >> $GITHUB_OUTPUT

      - name: Stop application services
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down

      - name: Upload load test artifacts
        uses: actions/upload-artifact@v3
        with:
          name: load-test-results
          path: |
            load-test-report.html
            load-test-results.csv
            load-test-metrics.json
          retention-days: 30

  # Stress Testing
  stress-testing:
    name: Stress Testing
    runs-on: ubuntu-latest
    needs: performance-setup
    if: env.TEST_TYPE == 'stress'
    outputs:
      stress-test-results: ${{ steps.stress.outputs.results-path }}
      performance-metrics: ${{ steps.stress.outputs.metrics }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install performance testing tools
        run: |
          pip install locust pytest matplotlib seaborn pandas

      - name: Download test configuration
        uses: actions/download-artifact@v3
        with:
          name: performance-config

      - name: Start application services
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30

      - name: Run stress testing
        id: stress
        run: |
          # Create stress test Locustfile
          cat > stress-locustfile.py << 'EOF'
          from locust import HttpUser, task, between
          import json
          import random
          
          with open('performance-test-config.json', 'r') as f:
              config = json.load(f)
          
          class StressTestUser(HttpUser):
              wait_time = between(0.1, 0.5)  # Very short wait time for stress
              
              def on_start(self):
                  self.endpoints = config['endpoints']
              
              @task(40)
              def heavy_requests(self):
                  """Heavy API requests"""
                  for endpoint in self.endpoints:
                      self.client.get(endpoint['url'])
              
              @task(30)
              def concurrent_requests(self):
                  """Concurrent requests"""
                  import concurrent.futures
                  with concurrent.futures.ThreadPoolExecutor(max_workers=5) as executor:
                      futures = []
                      for endpoint in self.endpoints:
                          futures.append(executor.submit(self.client.get, endpoint['url']))
                      for future in concurrent.futures.as_completed(futures):
                          future.result()
              
              @task(30)
              def resource_intensive(self):
                  """Resource intensive operations"""
                  endpoint = random.choice(self.endpoints)
                  # Large payload requests
                  payload = {"data": "x" * 10000}  # 10KB payload
                  self.client.post(endpoint['url'].replace('/api/', '/api/heavy/'), json=payload)
          EOF
          
          # Run stress test with higher user count
          STRESS_USERS=$(($CONCURRENT_USERS * 2))
          locust -f stress-locustfile.py \
            --host ${{ needs.performance-setup.outputs.target-url }} \
            --users $STRESS_USERS \
            --spawn-rate ${{ fromJson(needs.performance-setup.outputs.test-config).concurrent_users / 5 }} \
            --run-time $TEST_DURATION \
            --html stress-test-report.html \
            --csv stress-test-results.csv \
            --headless \
            --exit-code-on-error 1 || true
          
          echo "results-path=stress-test-results.csv" >> $GITHUB_OUTPUT
          
          # Extract metrics
          python scripts/performance/extract-locust-metrics.py \
            --csv-file stress-test-results.csv \
            --output stress-test-metrics.json
          
          echo "metrics=stress-test-metrics.json" >> $GITHUB_OUTPUT

      - name: Stop application services
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down

      - name: Upload stress test artifacts
        uses: actions/upload-artifact@v3
        with:
          name: stress-test-results
          path: |
            stress-test-report.html
            stress-test-results.csv
            stress-test-metrics.json
          retention-days: 30

  # Spike Testing
  spike-testing:
    name: Spike Testing
    runs-on: ubuntu-latest
    needs: performance-setup
    if: env.TEST_TYPE == 'spike'
    outputs:
      spike-test-results: ${{ steps.spike.outputs.results-path }}
      performance-metrics: ${{ steps.spike.outputs.metrics }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install performance testing tools
        run: |
          pip install locust pytest matplotlib seaborn pandas

      - name: Download test configuration
        uses: actions/download-artifact@v3
        with:
          name: performance-config

      - name: Start application services
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30

      - name: Run spike testing
        id: spike
        run: |
          # Create spike test Locustfile
          cat > spike-locustfile.py << 'EOF'
          from locust import HttpUser, task, between
          import json
          import random
          
          with open('performance-test-config.json', 'r') as f:
              config = json.load(f)
          
          class SpikeTestUser(HttpUser):
              wait_time = between(0.5, 2)
              
              def on_start(self):
                  self.endpoints = config['endpoints']
              
              @task(50)
              def normal_load(self):
                  """Normal load"""
                  endpoint = random.choice(self.endpoints)
                  self.client.get(endpoint['url'])
              
              @task(50)
              def spike_load(self):
                  """Spike load - more aggressive"""
                  for endpoint in self.endpoints:
                      self.client.get(endpoint['url'])
                      self.client.post(endpoint['url'].replace('/api/', '/api/create/'), json={"test": "data"})
          EOF
          
          # Run spike test with varying user count
          echo "Starting baseline load..."
          locust -f spike-locustfile.py \
            --host ${{ needs.performance-setup.outputs.target-url }} \
            --users 50 \
            --spawn-rate 10 \
            --run-time 60 \
            --html spike-baseline.html \
            --csv spike-baseline.csv \
            --headless \
            --exit-code-on-error 1 || true
          
          echo "Starting spike load..."
          SPIKE_USERS=$(($CONCURRENT_USERS * 3))
          locust -f spike-locustfile.py \
            --host ${{ needs.performance-setup.outputs.target-url }} \
            --users $SPIKE_USERS \
            --spawn-rate ${{ fromJson(needs.performance-setup.outputs.test-config).concurrent_users }} \
            --run-time 120 \
            --html spike-spike.html \
            --csv spike-spike.csv \
            --headless \
            --exit-code-on-error 1 || true
          
          echo "Returning to baseline..."
          locust -f spike-locustfile.py \
            --host ${{ needs.performance-setup.outputs.target-url }} \
            --users 50 \
            --spawn-rate 10 \
            --run-time 60 \
            --html spike-recovery.html \
            --csv spike-recovery.csv \
            --headless \
            --exit-code-on-error 1 || true
          
          # Combine results
          python scripts/performance/combine-spike-results.py \
            --baseline-file spike-baseline.csv \
            --spike-file spike-spike.csv \
            --recovery-file spike-recovery.csv \
            --output spike-test-results.csv
          
          echo "results-path=spike-test-results.csv" >> $GITHUB_OUTPUT
          
          # Extract metrics
          python scripts/performance/extract-locust-metrics.py \
            --csv-file spike-test-results.csv \
            --output spike-test-metrics.json
          
          echo "metrics=spike-test-metrics.json" >> $GITHUB_OUTPUT

      - name: Stop application services
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down

      - name: Upload spike test artifacts
        uses: actions/upload-artifact@v3
        with:
          name: spike-test-results
          path: |
            spike-*.html
            spike-*.csv
            spike-test-metrics.json
          retention-days: 30

  # Endurance Testing
  endurance-testing:
    name: Endurance Testing
    runs-on: ubuntu-latest
    needs: performance-setup
    if: env.TEST_TYPE == 'endurance'
    outputs:
      endurance-test-results: ${{ steps.endurance.outputs.results-path }}
      performance-metrics: ${{ steps.endurance.outputs.metrics }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install performance testing tools
        run: |
          pip install locust pytest matplotlib seaborn pandas

      - name: Download test configuration
        uses: actions/download-artifact@v3
        with:
          name: performance-config

      - name: Start application services
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30

      - name: Run endurance testing
        id: endurance
        run: |
          # Create endurance test Locustfile
          cat > endurance-locustfile.py << 'EOF'
          from locust import HttpUser, task, between
          import json
          import random
          import time
          
          with open('performance-test-config.json', 'r') as f:
              config = json.load(f)
          
          class EnduranceTestUser(HttpUser):
              wait_time = between(2, 5)  # Longer wait time for endurance
              
              def on_start(self):
                  self.endpoints = config['endpoints']
                  self.session_start = time.time()
              
              @task(25)
              def sustained_load(self):
                  """Sustained load"""
                  endpoint = random.choice(self.endpoints)
                  self.client.get(endpoint['url'])
              
              @task(25)
              def mixed_operations(self):
                  """Mixed operations"""
                  endpoint = random.choice(self.endpoints)
                  method = random.choice(['GET', 'POST'])
                  if method == 'GET':
                      self.client.get(endpoint['url'])
                  else:
                      self.client.post(endpoint['url'].replace('/api/', '/api/create/'), json={"test": "data"})
              
              @task(25)
              def resource_usage(self):
                  """Resource usage patterns"""
                  endpoint = random.choice(self.endpoints)
                  # Simulate real user behavior
                  self.client.get(endpoint['url'])
                  time.sleep(random.uniform(0.5, 2))
                  self.client.get(endpoint['url'] + '/details')
              
              @task(25)
              def memory_stress(self):
                  """Memory stress patterns"""
                  endpoint = random.choice(self.endpoints)
                  # Large data requests
                  self.client.get(endpoint['url'] + '?limit=1000')
          EOF
          
          # Run endurance test for extended period
          ENDURANCE_DURATION=3600  # 1 hour
          locust -f endurance-locustfile.py \
            --host ${{ needs.performance-setup.outputs.target-url }} \
            --users $CONCURRENT_USERS \
            --spawn-rate ${{ fromJson(needs.performance-setup.outputs.test-config).concurrent_users / 20 }} \
            --run-time $ENDURANCE_DURATION \
            --html endurance-test-report.html \
            --csv endurance-test-results.csv \
            --headless \
            --exit-code-on-error 1 || true
          
          echo "results-path=endurance-test-results.csv" >> $GITHUB_OUTPUT
          
          # Extract metrics
          python scripts/performance/extract-locust-metrics.py \
            --csv-file endurance-test-results.csv \
            --output endurance-test-metrics.json
          
          echo "metrics=endurance-test-metrics.json" >> $GITHUB_OUTPUT

      - name: Stop application services
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down

      - name: Upload endurance test artifacts
        uses: actions/upload-artifact@v3
        with:
          name: endurance-test-results
          path: |
            endurance-test-report.html
            endurance-test-results.csv
            endurance-test-metrics.json
          retention-days: 30

  # Scalability Testing
  scalability-testing:
    name: Scalability Testing
    runs-on: ubuntu-latest
    needs: performance-setup
    if: env.TEST_TYPE == 'scalability'
    outputs:
      scalability-results: ${{ steps.scalability.outputs.results-path }}
      performance-metrics: ${{ steps.scalability.outputs.metrics }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install performance testing tools
        run: |
          pip install locust pytest matplotlib seaborn pandas

      - name: Download test configuration
        uses: actions/download-artifact@v3
        with:
          name: performance-config

      - name: Start application services
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30

      - name: Run scalability testing
        id: scalability
        run: |
          # Create scalability test with multiple user levels
          cat > scalability-locustfile.py << 'EOF'
          from locust import HttpUser, task, between
          import json
          import random
          
          with open('performance-test-config.json', 'r') as f:
              config = json.load(f)
          
          class ScalabilityTestUser(HttpUser):
              wait_time = between(1, 3)
              
              def on_start(self):
                  self.endpoints = config['endpoints']
              
              @task(30)
              def basic_operations(self):
                  """Basic operations"""
                  endpoint = random.choice(self.endpoints)
                  self.client.get(endpoint['url'])
              
              @task(30)
              def data_intensive(self):
                  """Data intensive operations"""
                  endpoint = random.choice([e for e in self.endpoints if 'api' in e['url']])
                  self.client.get(endpoint['url'] + '?limit=100')
              
              @task(20)
              def concurrent_operations(self):
                  """Concurrent operations"""
                  import concurrent.futures
                  with concurrent.futures.ThreadPoolExecutor(max_workers=3) as executor:
                      futures = []
                      for endpoint in self.endpoints[:3]:
                          futures.append(executor.submit(self.client.get, endpoint['url']))
                      for future in concurrent.futures.as_completed(futures):
                          future.result()
              
              @task(20)
              def write_operations(self):
                  """Write operations"""
                  endpoint = random.choice([e for e in self.endpoints if 'api' in e['url']])
                  self.client.post(endpoint['url'].replace('/api/', '/api/create/'), json={"test": "data"})
          EOF
          
          # Test with different user levels
          USER_LEVELS=(50 100 200 500 1000)
          
          for users in $USER_LEVELS; do
            echo "Testing with $users users..."
            locust -f scalability-locustfile.py \
              --host ${{ needs.performance-setup.outputs.target-url }} \
              --users $users \
              --spawn-rate ${{ fromJson(needs.performance-setup.outputs.test-config).concurrent_users / 10 }} \
              --run-time 300 \
              --html scalability-report-$users.html \
              --csv scalability-results-$users.csv \
              --headless \
              --exit-code-on-error 1 || true
          done
          
          # Combine scalability results
          python scripts/performance/combine-scalability-results.py \
            --user-levels 50 100 200 500 1000 \
            --output scalability-test-results.csv
          
          echo "results-path=scalability-test-results.csv" >> $GITHUB_OUTPUT
          
          # Extract metrics
          python scripts/performance/extract-locust-metrics.py \
            --csv-file scalability-test-results.csv \
            --output scalability-test-metrics.json
          
          echo "metrics=scalability-test-metrics.json" >> $GITHUB_OUTPUT

      - name: Stop application services
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down

      - name: Upload scalability test artifacts
        uses: actions/upload-artifact@v3
        with:
          name: scalability-test-results
          path: |
            scalability-*.html
            scalability-*.csv
            scalability-test-metrics.json
          retention-days: 30

  # Performance Analysis
  performance-analysis:
    name: Performance Analysis
    runs-on: ubuntu-latest
    needs: [load-testing, stress-testing, spike-testing, endurance-testing, scalability-testing]
    if: always()
    outputs:
      analysis-report: ${{ steps.analysis.outputs.report-path }}
      performance-summary: ${{ steps.analysis.outputs.summary }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install analysis tools
        run: |
          pip install matplotlib seaborn pandas jinja2 weasyprint
          pip install -r requirements.txt || true

      - name: Download all test results
        uses: actions/download-artifact@v3
        with:
          path: test-results/

      - name: Analyze performance results
        id: analysis
        run: |
          python scripts/performance/analyze-performance-results.py \
            --results-dir test-results/ \
            --test-type $TEST_TYPE \
            --output performance-analysis.json
          
          echo "report-path=performance-analysis.json" >> $GITHUB_OUTPUT
          
          # Generate summary
          python scripts/performance/generate-performance-summary.py \
            --analysis-file performance-analysis.json \
            --output performance-summary.json
          
          echo "summary=performance-summary.json" >> $GITHUB_OUTPUT

      - name: Generate performance report
        run: |
          python scripts/performance/generate-performance-report.py \
            --analysis-file performance-analysis.json \
            --template templates/performance-report.html \
            --output performance-report.html

      - name: Generate PDF report
        run: |
          python scripts/performance/generate-pdf-report.py \
            --html-file performance-report.html \
            --output performance-report.pdf

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v3
        with:
          name: performance-analysis
          path: |
            performance-analysis.json
            performance-summary.json
            performance-report.html
            performance-report.pdf
          retention-days: 90

  # Performance Gate
  performance-gate:
    name: Performance Gate
    runs-on: ubuntu-latest
    needs: performance-analysis
    if: always()
    steps:
      - name: Download performance analysis
        uses: actions/download-artifact@v3
        with:
          name: performance-analysis

      - name: Evaluate performance gate
        run: |
          python scripts/performance/evaluate-performance-gate.py \
            --analysis-file performance-analysis.json \
            --thresholds performance-thresholds.json \
            --output performance-gate-result.json
          
          GATE_STATUS=$(python -c "import json; print(json.load(open('performance-gate-result.json')).get('gate_status', 'FAILED'))")
          if [ "$GATE_STATUS" != "PASSED" ]; then
            echo "Performance gate failed!"
            cat performance-gate-result.json
            exit 1
          fi
          
          echo "Performance gate passed!"

  # Notification
  notification:
    name: Performance Notification
    runs-on: ubuntu-latest
    needs: [performance-analysis, performance-gate]
    if: always()
    steps:
      - name: Download performance results
        uses: actions/download-artifact@v3
        with:
          path: performance-results/

      - name: Send Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#performance'
          text: |
            Performance Test Results (${{ env.TEST_TYPE }}):
            - Environment: ${{ env.ENVIRONMENT }}
            - Concurrent Users: ${{ env.CONCURRENT_USERS }}
            - Test Duration: ${{ env.TEST_DURATION }}s
            - Performance Gate: ${{ needs.performance-gate.result }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_PERFORMANCE_WEBHOOK }}

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Performance Test Results - ${{ github.repository }}"
          body: |
            Performance Test Results (${{ env.TEST_TYPE }}):
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            
            Test Configuration:
            - Environment: ${{ env.ENVIRONMENT }}
            - Test Type: ${{ env.TEST_TYPE }}
            - Concurrent Users: ${{ env.CONCURRENT_USERS }}
            - Test Duration: ${{ env.TEST_DURATION }}s
            - Ramp Up Time: ${{ env.RAMP_UP_TIME }}s
            
            Results:
            - Performance Gate: ${{ needs.performance-gate.result }}
            
            Reports are available in the artifacts.
          to: ${{ secrets.PERFORMANCE_EMAIL }}
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>

      - name: Create GitHub Issue for performance issues
        if: needs.performance-gate.result == 'failure'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const gateResult = JSON.parse(fs.readFileSync('performance-gate-result.json', 'utf8'));
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Performance Gate Failed - ${new Date().toISOString()}`,
              body: `
            ## Performance Gate Failed
            
            **Repository**: ${{ github.repository }}
            **Branch**: ${{ github.ref_name }}
            **Commit**: ${{ github.sha }}
            
            ### Test Configuration:
            - **Test Type**: ${{ env.TEST_TYPE }}
            - **Environment**: ${{ env.ENVIRONMENT }}
            - **Concurrent Users**: ${{ env.CONCURRENT_USERS }}
            - **Test Duration**: ${{ env.TEST_DURATION }}s
            - **Ramp Up Time**: ${{ env.RAMP_UP_TIME }}s
            
            ### Performance Results:
            \`\`\`json
            ${JSON.stringify(gateResult, null, 2)}
            \`\`\`
            
            ### Action Required:
            Please review the performance results and address the performance issues before merging.
            
            **Performance Reports**: Available in the workflow artifacts.
              `,
              labels: ['performance', 'scalability', 'high-priority']
            });
