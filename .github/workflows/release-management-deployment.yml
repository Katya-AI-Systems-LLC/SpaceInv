# GitHub Workflow Templates for Space Invaders Enhanced Edition

name: Release Management and Deployment
on:
  push:
    tags:
      - 'v*'
    branches: [main, develop, release/*]
  pull_request:
    branches: [main, develop]
    types: [closed, opened, synchronize]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release to perform'
        required: true
        type: choice
        options:
          - 'major'
          - 'minor'
          - 'patch'
          - 'hotfix'
          - 'beta'
          - 'rc'
          - 'rolling'
      target_environment:
        description: 'Target deployment environment'
        required: true
        type: choice
        options:
          - 'staging'
          - 'production'
          - 'all'
          - 'web'
          - 'mobile'
          - 'api'
      create_release:
        description: 'Create GitHub release'
        required: false
        type: boolean
        default: true
      deploy_app_stores:
        description: 'Deploy to app stores'
        required: false
        type: boolean
        default: false

jobs:
  release-planning:
    runs-on: ubuntu-latest
    if: github.event.inputs.release_type || startsWith(github.ref, 'refs/tags/')
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_type: ${{ steps.version.outputs.release_type }}
      previous_version: ${{ steps.version.outputs.previous_version }}
      next_version: ${{ steps.version.outputs.next_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install release tools
        run: |
          pip install semver
          pip install gitpython
          pip install -r requirements.txt

      - name: Determine version information
        id: version
        run: |
          python scripts/determine_release_version.py \
            --tag "${{ github.ref }}" \
            --release-type "${{ github.event.inputs.release_type || 'auto' }}" \
            --output version-info.json

      - name: Read version information
        id: read_version
        run: |
          VERSION_INFO=$(cat version-info.json)
          echo "version=$(echo $VERSION_INFO | jq -r '.version')" >> $GITHUB_OUTPUT
          echo "release_type=$(echo $VERSION_INFO | jq -r '.release_type')" >> $GITHUB_OUTPUT
          echo "previous_version=$(echo $VERSION_INFO | jq -r '.previous_version')" >> $GITHUB_OUTPUT
          echo "next_version=$(echo $VERSION_INFO | jq -r '.next_version')" >> $GITHUB_OUTPUT
          echo "is_prerelease=$(echo $VERSION_INFO | jq -r '.is_prerelease')" >> $GITHUB_OUTPUT

      - name: Generate release plan
        run: |
          python scripts/generate_release_plan.py \
            --version "${{ steps.read_version.outputs.version }}" \
            --release-type "${{ steps.read_version.outputs.release_type }}" \
            --previous-version "${{ steps.read_version.outputs.previous_version }}" \
            --output release-plan.json

      - name: Upload release plan
        uses: actions/upload-artifact@v3
        with:
          name: release-plan
          path: |
            version-info.json
            release-plan.json

  build-artifacts:
    needs: release-planning
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: web
            build_target: web
          - os: ubuntu-latest
            platform: api
            build_target: api
          - os: windows-latest
            platform: windows
            build_target: windows
          - os: macos-latest
            platform: macos
            build_target: macos
          - os: macos-latest
            platform: ios
            build_target: ios
          - os: ubuntu-latest
            platform: android
            build_target: android
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Setup Node.js
        if: matrix.platform == 'web' || matrix.platform == 'api'
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Python
        if: matrix.platform == 'api'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          flutter pub get
          if [ "${{ matrix.platform }}" = "web" ]; then
            npm install
          elif [ "${{ matrix.platform }}" = "api" ]; then
            pip install -r requirements.txt
            npm install
          fi

      - name: Build web application
        if: matrix.platform == 'web'
        run: |
          flutter build web --release --web-renderer canvaskit
          npm run build:prod

      - name: Build API
        if: matrix.platform == 'api'
        run: |
          npm run build:api
          pip install -r requirements.txt
          python -m PyInstaller --onefile api/main.py

      - name: Build Windows application
        if: matrix.platform == 'windows'
        run: |
          flutter build windows --release

      - name: Build macOS application
        if: matrix.platform == 'macos'
        run: |
          flutter build macos --release

      - name: Build iOS application
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign

      - name: Build Android application
        if: matrix.platform == 'android'
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Package artifacts
        run: |
          python scripts/package_release_artifacts.py \
            --platform "${{ matrix.platform }}" \
            --version "${{ needs.release-planning.outputs.version }}" \
            --build-dir build/ \
            --output-dir artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts-${{ matrix.platform }}
          path: artifacts/

  security-and-quality-checks:
    needs: release-planning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install security and quality tools
        run: |
          pip install bandit safety semgrep
          npm install -g audit-ci
          flutter pub get

      - name: Run security scans
        run: |
          bandit -r . -f json -o bandit-release-scan.json
          safety check --json --output safety-release-scan.json
          semgrep --config=auto --json --output=semgrep-release-scan.json .
          npm audit --json > npm-audit-release-scan.json || true

      - name: Run quality checks
        run: |
          flutter analyze --format=json > flutter-release-analysis.json
          python scripts/analyze_release_quality.py \
            --version "${{ needs.release-planning.outputs.version }}" \
            --output release-quality-report.json

      - name: Upload security and quality reports
        uses: actions/upload-artifact@v3
        with:
          name: security-quality-reports
          path: |
            bandit-release-scan.json
            safety-release-scan.json
            semgrep-release-scan.json
            npm-audit-release-scan.json
            flutter-release-analysis.json
            release-quality-report.json

  integration-testing:
    needs: [release-planning, build-artifacts]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: space_invaders_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts-web
          path: artifacts/

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio
          pip install httpx aiohttp
          pip install -r requirements.txt
          flutter pub get

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          until redis-cli ping; do
            echo "Waiting for Redis..."
            sleep 2
          done

      - name: Setup test environment
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/space_invaders_test"
          export REDIS_URL="redis://localhost:6379"
          export RELEASE_VERSION="${{ needs.release-planning.outputs.version }}"

      - name: Start API server
        run: |
          export DATABASE_URL=$DATABASE_URL
          export REDIS_URL=$REDIS_URL
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: Start web server
        run: |
          cd artifacts/web && python -m http.server 8080 &
          sleep 5

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --junitxml=integration-test-results.xml \
            --html=integration-test-report.html \
            --self-contained-html \
            --tb=short \
            -v

      - name: Run end-to-end tests
        run: |
          pytest tests/e2e/ \
            --junitxml=e2e-test-results.xml \
            --html=e2e-test-report.html \
            --self-contained-html \
            --tb=short \
            -v

      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: |
            integration-test-results.xml
            integration-test-report.html
            e2e-test-results.xml
            e2e-test-report.html

  create-github-release:
    needs: [release-planning, build-artifacts, security-and-quality-checks, integration-testing]
    runs-on: ubuntu-latest
    if: github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download all build artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Download release plan
        uses: actions/download-artifact@v3
        with:
          name: release-plan
          path: release-plan/

      - name: Generate release notes
        run: |
          python scripts/generate_release_notes.py \
            --version "${{ needs.release-planning.outputs.version }}" \
            --release-plan release-plan/release-plan.json \
            --output release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ needs.release-planning.outputs.version }}"
          name: "Space Invaders v${{ needs.release-planning.outputs.version }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ needs.release-planning.outputs.is_prerelease }}
          files: |
            artifacts/**/*
            release-plan/**
          generate_release_notes: true

  deploy-staging:
    needs: [release-planning, build-artifacts, integration-testing]
    runs-on: ubuntu-latest
    if: github.event.inputs.target_environment == 'staging' || github.event.inputs.target_environment == 'all'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Setup deployment tools
        run: |
          pip install ansible
          pip install -r requirements.txt

      - name: Deploy to staging environment
        run: |
          python scripts/deploy_to_staging.py \
            --version "${{ needs.release-planning.outputs.version }}" \
            --artifacts-dir artifacts/ \
            --environment staging

      - name: Run smoke tests
        run: |
          python scripts/run_smoke_tests.py \
            --environment staging \
            --version "${{ needs.release-planning.outputs.version }}"

      - name: Update staging documentation
        run: |
          python scripts/update_staging_docs.py \
            --version "${{ needs.release-planning.outputs.version }}"

  deploy-production:
    needs: [release-planning, build-artifacts, integration-testing, deploy-staging]
    runs-on: ubuntu-latest
    if: github.event.inputs.target_environment == 'production' || github.event.inputs.target_environment == 'all'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Setup deployment tools
        run: |
          pip install ansible
          pip install -r requirements.txt

      - name: Deploy to production environment
        run: |
          python scripts/deploy_to_production.py \
            --version "${{ needs.release-planning.outputs.version }}" \
            --artifacts-dir artifacts/ \
            --environment production

      - name: Run production smoke tests
        run: |
          python scripts/run_smoke_tests.py \
            --environment production \
            --version "${{ needs.release-planning.outputs.version }}"

      - name: Update production documentation
        run: |
          python scripts/update_production_docs.py \
            --version "${{ needs.release-planning.outputs.version }}"

  deploy-app-stores:
    needs: [release-planning, build-artifacts, integration-testing]
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_app_stores == 'true'
    strategy:
      matrix:
        store: [google-play, apple-app-store, microsoft-store]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Deploy to ${{ matrix.store }}
        run: |
          python scripts/deploy_to_app_store.py \
            --store "${{ matrix.store }}" \
            --version "${{ needs.release-planning.outputs.version }}" \
            --artifacts-dir artifacts/ \
            --release-notes release-notes.md

      - name: Monitor app store submission
        run: |
          python scripts/monitor_app_store_submission.py \
            --store "${{ matrix.store }}" \
            --version "${{ needs.release-planning.outputs.version }}"

  notify-teams:
    needs: [create-github-release, deploy-staging, deploy-production, deploy-app-stores]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download release plan
        uses: actions/download-artifact@v3
        with:
          name: release-plan
          path: release-plan/

      - name: Notify release team
        uses: actions/github-script@v6
        with:
          script: |
            const webhookUrl = process.env.RELEASE_WEBHOOK_URL;
            const releaseType = '${{ needs.release-planning.outputs.release_type }}';
            const version = '${{ needs.release-planning.outputs.version }}';
            const environment = '${{ github.event.inputs.target_environment || 'production' }}';
            
            if (webhookUrl) {
              await fetch(webhookUrl, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  text: `🚀 Release Completed: v${version}`,
                  attachments: [{
                    color: 'good',
                    fields: [{
                      title: 'Release Type',
                      value: releaseType,
                      short: true
                    }, {
                      title: 'Version',
                      value: version,
                      short: true
                    }, {
                      title: 'Environment',
                      value: environment,
                      short: true
                    }, {
                      title: 'Repository',
                      value: '${{ github.repository }}',
                      short: true
                    }, {
                      title: 'Release URL',
                      value: `https://github.com/${{ github.repository }}/releases/tag/v${version}`,
                      short: false
                    }]
                  }]
                })
              });
            }

  update-documentation:
    needs: [create-github-release, deploy-production]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download release plan
        uses: actions/download-artifact@v3
        with:
          name: release-plan
          path: release-plan/

      - name: Update documentation
        run: |
          python scripts/update_documentation.py \
            --version "${{ needs.release-planning.outputs.version }}" \
            --release-plan release-plan/release-plan.json

      - name: Deploy documentation
        run: |
          python scripts/deploy_documentation.py \
            --version "${{ needs.release-planning.outputs.version }}"

  post-release-analysis:
    needs: [create-github-release, deploy-production, deploy-app-stores]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download all reports
        uses: actions/download-artifact@v3
        with:
          path: reports/

      - name: Generate post-release analysis
        run: |
          python scripts/generate_post_release_analysis.py \
            --version "${{ needs.release-planning.outputs.version }}" \
            --reports-dir reports/ \
            --output post-release-analysis.json

      - name: Upload post-release analysis
        uses: actions/upload-artifact@v3
        with:
          name: post-release-analysis
          path: post-release-analysis.json

  cleanup:
    needs: [create-github-release, deploy-production, deploy-app-stores, post-release-analysis]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Cleanup release artifacts
        run: |
          echo "Cleaning up release artifacts..."
          # Add cleanup logic here
