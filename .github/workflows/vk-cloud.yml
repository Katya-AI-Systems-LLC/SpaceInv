name: VK Cloud CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Run tests
      run: flutter test --coverage
    
    - name: Analyze code
      run: flutter analyze
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: coverage/lcov.info

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Build web version
      run: flutter build web --web-renderer canvaskit --release
    
    - name: Setup VK Cloud CLI
      run: |
        # Install VK Cloud CLI
        curl -L https://vk.com/cloud/cli/install.sh | bash
        export PATH=$PATH:$HOME/vk-cloud/bin
        
        # Configure VK Cloud
        vk-cloud auth login \
          --token ${{ secrets.VK_CLOUD_TOKEN }} \
          --project-id ${{ secrets.VK_CLOUD_PROJECT_ID }}
    
    - name: Deploy to VK Cloud Storage
      run: |
        export PATH=$PATH:$HOME/vk-cloud/bin
        vk-cloud storage upload \
          --bucket ${{ secrets.VK_CLOUD_BUCKET }} \
          --source build/web/ \
          --destination / \
          --recursive
    
    - name: Setup CDN
      run: |
        export PATH=$PATH:$HOME/vk-cloud/bin
        vk-cloud cdn invalidate \
          --project-id ${{ secrets.VK_CLOUD_PROJECT_ID }} \
          --path "/*"

  deploy-to-containers:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Build web version
      run: flutter build web --web-renderer canvaskit --release
    
    - name: Setup Docker
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: |
        docker build -t space-invaders:latest .
        docker tag space-invaders:latest ${{ secrets.VK_CLOUD_REGISTRY }}/space-invaders:latest
    
    - name: Push to VK Cloud Registry
      run: |
        echo ${{ secrets.VK_CLOUD_TOKEN }} | docker login ${{ secrets.VK_CLOUD_REGISTRY }} -u _json_key --password-stdin
        docker push ${{ secrets.VK_CLOUD_REGISTRY }}/space-invaders:latest
    
    - name: Deploy to VK Cloud Containers
      run: |
        export PATH=$PATH:$HOME/vk-cloud/bin
        vk-cloud containers deploy \
          --name space-invaders \
          --image ${{ secrets.VK_CLOUD_REGISTRY }}/space-invaders:latest \
          --port 80 \
          --memory 512 \
          --cpu 0.5
