# GitHub Workflow Templates for Space Invaders Enhanced Edition

name: Advanced Testing and Quality Assurance
on:
  push:
    branches: [main, develop, feature/*, hotfix/*]
    paths:
      - '**/*.py'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.dart'
      - '**/*.java'
      - '**/*.kt'
      - '**/*.swift'
      - 'tests/**'
      - 'test/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.dart'
      - '**/*.java'
      - '**/*.kt'
      - '**/*.swift'
      - 'tests/**'
      - 'test/**'
  schedule:
    - cron: '0 1 * * *'  # Daily at 1 AM
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of testing to perform'
        required: true
        type: choice
        options:
          - 'comprehensive'
          - 'unit'
          - 'integration'
          - 'e2e'
          - 'performance'
          - 'security'
          - 'accessibility'
          - 'localization'
          - 'all'
      test_environment:
        description: 'Test environment'
        required: true
        type: choice
        options:
          - 'all'
          - 'local'
          - 'staging'
          - 'production'
          - 'mobile'
          - 'web'
          - 'api'

jobs:
  unit-testing:
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'comprehensive' || github.event.inputs.test_type == 'unit' || github.event.inputs.test_type == 'all' || github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      matrix:
        language: [python, javascript, dart, java]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Node.js
        if: matrix.language == 'javascript'
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Flutter
        if: matrix.language == 'dart'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Setup Java
        if: matrix.language == 'java'
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install test dependencies
        run: |
          if [ "${{ matrix.language }}" = "python" ]; then
            pip install pytest pytest-cov pytest-mock pytest-asyncio
            pip install pytest-xdist pytest-html
            pip install -r requirements.txt
            pip install -r requirements-test.txt
          elif [ "${{ matrix.language }}" = "javascript" ]; then
            npm install
            npm install --save-dev jest @types/jest
            npm install --save-dev eslint jest-junit
          elif [ "${{ matrix.language }}" = "dart" ]; then
            flutter pub get
            flutter pub add dev:test
            flutter pub add dev:integration_test
          elif [ "${{ matrix.language }}" = "java" ]; then
            ./gradlew testClasses
          fi

      - name: Run Python unit tests
        if: matrix.language == 'python'
        run: |
          pytest tests/unit/ \
            --cov=. \
            --cov-report=json \
            --cov-report=html \
            --cov-report=xml \
            --junitxml=python-unit-test-results.xml \
            --html=python-unit-test-report.html \
            --self-contained-html \
            --tb=short \
            -v

      - name: Run JavaScript unit tests
        if: matrix.language == 'javascript'
        run: |
          npm test -- --coverage --coverageReporters=json --coverageReporters=html
          npm test -- --reporter=junit --outputFile=javascript-unit-test-results.xml

      - name: Run Flutter unit tests
        if: matrix.language == 'dart'
        run: |
          flutter test --coverage \
            --coverage-json=flutter-unit-coverage.json \
            --coverage-html=flutter-unit-coverage.html \
            --reporter=json \
            --reporter=html \
            --junit-report=flutter-unit-test-results.xml

      - name: Run Java unit tests
        if: matrix.language == 'java'
        run: |
          ./gradlew test jacocoTestReport

      - name: Upload unit test results
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-results-${{ matrix.language }}
          path: |
            python-unit-test-results.xml
            javascript-unit-test-results.xml
            flutter-unit-test-results.xml
            build/test-results/test/
            build/reports/jacoco/
            coverage.json
            coverage.html
            flutter-unit-coverage.json
            flutter-unit-coverage.html
            python-unit-test-report.html

  integration-testing:
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'comprehensive' || github.event.inputs.test_type == 'integration' || github.event.inputs.test_type == 'all'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: space_invaders_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Install integration test dependencies
        run: |
          pip install pytest pytest-asyncio
          pip install httpx aiohttp
          pip install -r requirements.txt
          npm install
          flutter pub get

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          until redis-cli ping; do
            echo "Waiting for Redis..."
            sleep 2
          done

      - name: Setup test environment
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/space_invaders_test"
          export REDIS_URL="redis://localhost:6379"
          export TEST_ENVIRONMENT="integration"

      - name: Run Python integration tests
        run: |
          pytest tests/integration/ \
            --junitxml=python-integration-test-results.xml \
            --html=python-integration-test-report.html \
            --self-contained-html \
            --tb=short \
            -v

      - name: Run JavaScript integration tests
        run: |
          npm run test:integration \
            -- --reporter=junit \
            --outputFile=javascript-integration-test-results.xml

      - name: Run Flutter integration tests
        run: |
          flutter test integration_test/ \
            --reporter=json \
            --reporter=html \
            --junit-report=flutter-integration-test-results.xml

      - name: Start API server for integration tests
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/space_invaders_test"
          export REDIS_URL="redis://localhost:6379"
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: Run API integration tests
        run: |
          pytest tests/api/integration/ \
            --junitxml=api-integration-test-results.xml \
            --html=api-integration-test-report.html \
            --self-contained-html \
            --tb=short \
            -v

      - name: Upload integration test results
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: |
            python-integration-test-results.xml
            javascript-integration-test-results.xml
            flutter-integration-test-results.xml
            api-integration-test-results.xml
            python-integration-test-report.html
            api-integration-test-report.html

  end-to-end-testing:
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'comprehensive' || github.event.inputs.test_type == 'e2e' || github.event.inputs.test_type == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Install E2E test dependencies
        run: |
          npm install
          npm install --save-dev cypress
          flutter pub get

      - name: Build web application
        run: |
          flutter build web --release

      - name: Start web server
        run: |
          cd build/web && python -m http.server 8080 &
          sleep 5

      - name: Run Cypress E2E tests
        run: |
          npx cypress run \
            --browser chrome \
            --headless \
            --reporter junit \
            --reporter-options mochaFile=cypress-e2e-test-results.xml

      - name: Run Flutter E2E tests
        run: |
          flutter test integration_test/ \
            --reporter=json \
            --reporter=html \
            --junit-report=flutter-e2e-test-results.xml

      - name: Upload E2E test results
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-results
          path: |
            cypress-e2e-test-results.xml
            flutter-e2e-test-results.xml
            cypress/videos/
            cypress/screenshots/

  performance-testing:
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'comprehensive' || github.event.inputs.test_type == 'performance' || github.event.inputs.test_type == 'all'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: space_invaders_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install performance test dependencies
        run: |
          pip install locust pytest pytest-asyncio
          pip install httpx aiohttp
          pip install -r requirements.txt
          npm install
          npm install --save-dev lighthouse

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          until redis-cli ping; do
            echo "Waiting for Redis..."
            sleep 2
          done

      - name: Setup test environment
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/space_invaders_test"
          export REDIS_URL="redis://localhost:6379"

      - name: Start application
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/space_invaders_test"
          export REDIS_URL="redis://localhost:6379"
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: Build web application
        run: |
          flutter build web --release

      - name: Start web server
        run: |
          cd build/web && python -m http.server 8080 &
          sleep 5

      - name: Run Locust performance tests
        run: |
          locust -f tests/performance/locustfile.py \
            --headless \
            --users 100 \
            --spawn-rate 10 \
            --run-time 60s \
            --host http://localhost:8000 \
            --html locust-performance-report.html \
            --csv locust-performance-results.csv

      - name: Run Lighthouse performance tests
        run: |
          npx lighthouse http://localhost:8080 \
            --output=json \
            --output-path=lighthouse-performance-report.json \
            --chrome-flags="--headless"

      - name: Run API performance tests
        run: |
          pytest tests/performance/api/ \
            --junitxml=api-performance-test-results.xml \
            --html=api-performance-test-report.html \
            --self-contained-html \
            --tb=short \
            -v

      - name: Upload performance test results
        uses: actions/upload-artifact@v3
        with:
          name: performance-test-results
          path: |
            locust-performance-report.html
            locust-performance-results.csv
            lighthouse-performance-report.json
            api-performance-test-results.xml
            api-performance-test-report.html

  security-testing:
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'comprehensive' || github.event.inputs.test_type == 'security' || github.event.inputs.test_type == 'all'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: space_invaders_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install security test dependencies
        run: |
          pip install pytest pytest-asyncio
          pip install httpx aiohttp
          pip install -r requirements.txt

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          until redis-cli ping; do
            echo "Waiting for Redis..."
            sleep 2
          done

      - name: Setup test environment
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/space_invaders_test"
          export REDIS_URL="redis://localhost:6379"

      - name: Start application
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/space_invaders_test"
          export REDIS_URL="redis://localhost:6379"
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: Run OWASP ZAP security scan
        run: |
          docker run -t owasp/zap2docker-stable zap-baseline.py \
            -t http://localhost:8000 \
            -J zap-security-report.json \
            -I zap-security-report.html

      - name: Run security tests
        run: |
          pytest tests/security/ \
            --junitxml=security-test-results.xml \
            --html=security-test-report.html \
            --self-contained-html \
            --tb=short \
            -v

      - name: Run penetration tests
        run: |
          pytest tests/penetration/ \
            --junitxml=penetration-test-results.xml \
            --html=penetration-test-report.html \
            --self-contained-html \
            --tb=short \
            -v

      - name: Upload security test results
        uses: actions/upload-artifact@v3
        with:
          name: security-test-results
          path: |
            zap-security-report.json
            zap-security-report.html
            security-test-results.xml
            security-test-report.html
            penetration-test-results.xml
            penetration-test-report.html

  accessibility-testing:
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'comprehensive' || github.event.inputs.test_type == 'accessibility' || github.event.inputs.test_type == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Install accessibility test dependencies
        run: |
          npm install
          npm install --save-dev axe-core
          npm install --save-dev lighthouse
          flutter pub get

      - name: Build web application
        run: |
          flutter build web --release

      - name: Start web server
        run: |
          cd build/web && python -m http.server 8080 &
          sleep 5

      - name: Run axe accessibility tests
        run: |
          npm run test:accessibility \
            -- --reporter=json \
            --outputFile=axe-accessibility-report.json

      - name: Run Lighthouse accessibility tests
        run: |
          npx lighthouse http://localhost:8080 \
            --output=json \
            --output-path=lighthouse-accessibility-report.json \
            --chrome-flags="--headless" \
            --only-categories=accessibility

      - name: Run Flutter accessibility tests
        run: |
          flutter test integration_test/ \
            --reporter=json \
            --reporter=html \
            --junit-report=flutter-accessibility-test-results.xml

      - name: Upload accessibility test results
        uses: actions/upload-artifact@v3
        with:
          name: accessibility-test-results
          path: |
            axe-accessibility-report.json
            lighthouse-accessibility-report.json
            flutter-accessibility-test-results.xml

  localization-testing:
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'comprehensive' || github.event.inputs.test_type == 'localization' || github.event.inputs.test_type == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Install localization test dependencies
        run: |
          flutter pub get
          npm install
          npm install --save-dev i18next

      - name: Run localization tests
        run: |
          flutter test test/localization/ \
            --reporter=json \
            --reporter=html \
            --junit-report=flutter-localization-test-results.xml

      - name: Run internationalization tests
        run: |
          npm run test:i18n \
            -- --reporter=json \
            --outputFile=i18n-test-results.json

      - name: Upload localization test results
        uses: actions/upload-artifact@v3
        with:
          name: localization-test-results
          path: |
            flutter-localization-test-results.xml
            i18n-test-results.json

  comprehensive-test-report:
    needs: [unit-testing, integration-testing, end-to-end-testing, performance-testing, security-testing, accessibility-testing, localization-testing]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v3
        with:
          path: test-results

      - name: Generate comprehensive test report
        run: |
          python scripts/generate_comprehensive_test_report.py \
            --input-dir test-results \
            --output comprehensive-test-report.json

      - name: Generate test coverage report
        run: |
          python scripts/generate_test_coverage_report.py \
            --input-dir test-results \
            --output test-coverage-report.json

      - name: Upload comprehensive test reports
        uses: actions/upload-artifact@v3
        with:
          name: comprehensive-test-reports
          path: |
            comprehensive-test-report.json
            test-coverage-report.json

  notify-test-team:
    needs: [comprehensive-test-report]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download comprehensive report
        uses: actions/download-artifact@v3
        with:
          name: comprehensive-test-reports
          path: reports

      - name: Notify test team
        uses: actions/github-script@v6
        with:
          script: |
            const webhookUrl = process.env.TEST_WEBHOOK_URL;
            const testType = '${{ github.event.inputs.test_type || 'automated' }}';
            const testEnvironment = '${{ github.event.inputs.test_environment || 'all' }}';
            
            if (webhookUrl) {
              await fetch(webhookUrl, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  text: `🧪 Testing Completed: ${testType}`,
                  attachments: [{
                    color: 'good',
                    fields: [{
                      title: 'Test Type',
                      value: testType,
                      short: true
                    }, {
                      title: 'Test Environment',
                      value: testEnvironment,
                      short: true
                    }, {
                      title: 'Repository',
                      value: '${{ github.repository }}',
                      short: true
                    }, {
                      title: 'Commit',
                      value: '${{ github.sha }}',
                      short: true
                    }, {
                      title: 'Action URL',
                      value: `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
                      short: false
                    }]
                  }]
                })
              });
            }

  create-test-issues:
    needs: [comprehensive-test-report]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download comprehensive report
        uses: actions/download-artifact@v3
        with:
          name: comprehensive-test-reports
          path: reports

      - name: Create test issues for critical failures
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('reports/comprehensive-test-report.json', 'utf8'));
            
            // Create issues for critical test failures
            if (report.critical_failures && report.critical_failures.length > 0) {
              for (const failure of report.critical_failures) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `🧪 Test Failure: ${failure.test_name}`,
                  body: `## Test Failure\n\n**Test**: ${failure.test_name}\n\n**Type**: ${failure.test_type}\n\n**Environment**: ${failure.environment}\n\n**Error**: ${failure.error}\n\n**Stack Trace**: \`\`\`\n${failure.stack_trace}\n\`\`\`\n\n**Test Report**: [View Full Report](${context.payload.html_url})`,
                  labels: ['testing', 'critical', 'test-failure']
                });
              }
            }

  update-test-dashboard:
    needs: [comprehensive-test-report]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download comprehensive report
        uses: actions/download-artifact@v3
        with:
          name: comprehensive-test-reports
          path: reports

      - name: Update test dashboard
        run: |
          echo "Updating test dashboard with latest test results..."
          # Add dashboard update logic here

      - name: Update test metrics
        run: |
          echo "Updating test metrics..."
          # Add metrics update logic here

  cleanup:
    needs: [unit-testing, integration-testing, end-to-end-testing, performance-testing, security-testing, accessibility-testing, localization-testing]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Cleanup test artifacts
        run: |
          echo "Cleaning up test artifacts..."
          # Add cleanup logic here
