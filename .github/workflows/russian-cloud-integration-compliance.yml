            --output selectel-servers-deployment.json

      - name: Monitor Selectel
        if: github.event.inputs.cloud_action == 'monitor' || github.event.inputs.cloud_action == 'all'
        run: |
          echo "📊 Monitoring Selectel..."
          
          # Monitor Selectel Storage
          python scripts/monitor_selectel_storage.py \
            --environment "${{ github.event.inputs.environment || 'development' }}" \
            --output selectel-storage-monitoring.json

          # Monitor Selectel Servers
          python scripts/monitor_selectel_servers.py \
            --environment "${{ github.event.inputs.environment || 'development' }}" \
            --output selectel-servers-monitoring.json

          # Generate Selectel monitoring report
          python scripts/generate_selectel_monitoring_report.py \
