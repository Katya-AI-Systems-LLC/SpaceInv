    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Selectel tools
        run: |
          pip install -r requirements.txt
          # Add Selectel specific tools installation

      - name: Configure Selectel credentials
        run: |
          echo "Configuring Selectel credentials..."
          export SELECTEL_TOKEN="${{ secrets.SELECTEL_TOKEN }}"
          export SELECTEL_PROJECT_ID="${{ secrets.SELECTEL_PROJECT_ID }}"

      - name: Deploy to Selectel
        if: github.event.inputs.cloud_action == 'deploy' || github.event.inputs.cloud_action == 'all'
