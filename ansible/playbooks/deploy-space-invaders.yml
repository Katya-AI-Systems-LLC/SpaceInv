---
# Advanced Ansible Playbook for Space Invaders Deployment
# Provides comprehensive deployment automation with security, monitoring, and scaling

- name: Deploy Space Invaders Game Infrastructure
  hosts: all
  become: yes
  vars:
    app_name: space-invaders
    app_version: "{{ lookup('env', 'APP_VERSION') | default('latest') }}"
    environment: "{{ lookup('env', 'ENVIRONMENT') | default('development') }}"
    domain: "{{ lookup('env', 'DOMAIN') | default('space-invaders.local') }}"
    ssl_enabled: "{{ lookup('env', 'SSL_ENABLED') | default('false') }}"
    monitoring_enabled: "{{ lookup('env', 'MONITORING_ENABLED') | default('true') }}"
    backup_enabled: "{{ lookup('env', 'BACKUP_ENABLED') | default('true') }}"
    
    # Database configuration
    db_host: "{{ lookup('env', 'DB_HOST') | default('localhost') }}"
    db_port: "{{ lookup('env', 'DB_PORT') | default('5432') }}"
    db_name: "{{ lookup('env', 'DB_NAME') | default('spaceinvaders') }}"
    db_user: "{{ lookup('env', 'DB_USER') | default('spaceinvaders') }}"
    db_password: "{{ lookup('env', 'DB_PASSWORD') }}"
    
    # Redis configuration
    redis_host: "{{ lookup('env', 'REDIS_HOST') | default('localhost') }}"
    redis_port: "{{ lookup('env', 'REDIS_PORT') | default('6379') }}"
    redis_password: "{{ lookup('env', 'REDIS_PASSWORD') }}"
    
    # Security configuration
    ssh_public_key: "{{ lookup('env', 'SSH_PUBLIC_KEY') }}"
    firewall_enabled: "{{ lookup('env', 'FIREWALL_ENABLED') | default('true') }}"
    fail2ban_enabled: "{{ lookup('env', 'FAIL2BAN_ENABLED') | default('true') }}"
    
    # Performance configuration
    worker_processes: "{{ ansible_processor_cores }}"
    worker_connections: "{{ ansible_processor_cores * 1024 }}"
    
    # Paths
    app_path: "/opt/{{ app_name }}"
    config_path: "/etc/{{ app_name }}"
    log_path: "/var/log/{{ app_name }}"
    data_path: "/var/lib/{{ app_name }}"
    backup_path: "/opt/backups/{{ app_name }}"

  pre_tasks:
    - name: Validate required variables
      assert:
        that:
          - db_password is defined
          - ssh_public_key is defined
        fail_msg: "Required variables are not defined"
    
    - name: Check system requirements
      assert:
        that:
          - ansible_distribution_version is version('18.04', '>=')
          - ansible_memtotal_mb >= 2048
          - ansible_processor_cores >= 2
        fail_msg: "System does not meet minimum requirements"

  tasks:
    # System Setup
    - name: Update system packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"
    
    - name: Update system packages
      yum:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"
    
    - name: Install required system packages
      package:
        name:
          - curl
          - wget
          - git
          - unzip
          - htop
          - vim
          - nginx
          - docker.io
          - docker-compose
          - python3
          - python3-pip
          - python3-venv
          - postgresql-client
          - redis-tools
          - certbot
          - python3-certbot-nginx
          - ufw
          - fail2ban
          - logrotate
          - cron
        state: present
    
    - name: Create application directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: "{{ app_name }}"
        group: "{{ app_name }}"
      loop:
        - "{{ app_path }}"
        - "{{ config_path }}"
        - "{{ log_path }}"
        - "{{ data_path }}"
        - "{{ backup_path }}"
    
    # User Management
    - name: Create application user
      user:
        name: "{{ app_name }}"
        shell: /bin/bash
        home: "{{ app_path }}"
        create_home: no
        groups: docker
        append: yes
        system: yes
    
    - name: Create SSH directory for application user
      file:
        path: "{{ app_path }}/.ssh"
        state: directory
        mode: '0700'
        owner: "{{ app_name }}"
        group: "{{ app_name }}"
    
    - name: Add SSH public key
      copy:
        content: "{{ ssh_public_key }}"
        dest: "{{ app_path }}/.ssh/authorized_keys"
        mode: '0600'
        owner: "{{ app_name }}"
        group: "{{ app_name }}"
    
    # Docker Setup
    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes
    
    - name: Add application user to docker group
      user:
        name: "{{ app_name }}"
        groups: docker
        append: yes
    
    # Security Setup
    - name: Configure firewall
      ufw:
        state: enabled
        policy: deny
        rule: allow
        name: OpenSSH
        port: 22
        proto: tcp
      when: firewall_enabled
    
    - name: Allow HTTP/HTTPS traffic
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - 80
        - 443
      when: firewall_enabled
    
    - name: Configure fail2ban
      template:
        src: fail2ban.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: '0644'
      notify: restart fail2ban
      when: fail2ban_enabled
    
    # SSL Certificate Setup
    - name: Generate SSL certificate
      command: >
        certbot certonly --nginx
        --non-interactive
        --agree-tos
        --email admin@{{ domain }}
        --domains {{ domain }}
      when: ssl_enabled and domain != "space-invaders.local"
      register: cert_result
    
    # Application Deployment
    - name: Clone application repository
      git:
        repo: "https://github.com/Katya-AI-Systems-LLC/SpaceInv.git"
        dest: "{{ app_path }}/source"
        version: "{{ app_version }}"
        force: yes
      become_user: "{{ app_name }}"
    
    - name: Create Python virtual environment
      pip:
        requirements: "{{ app_path }}/source/requirements.txt"
        virtualenv: "{{ app_path }}/venv"
        virtualenv_command: python3 -m venv
      become_user: "{{ app_name }}"
    
    - name: Install application dependencies
      pip:
        requirements: "{{ app_path }}/source/requirements.txt"
        virtualenv: "{{ app_path }}/venv"
      become_user: "{{ app_name }}"
    
    # Configuration Management
    - name: Create application configuration
      template:
        src: app-config.j2
        dest: "{{ config_path }}/app.conf"
        mode: '0644'
        owner: "{{ app_name }}"
        group: "{{ app_name }}"
      notify: restart application
    
    - name: Create environment file
      template:
        src: environment.j2
        dest: "{{ config_path }}/.env"
        mode: '0600'
        owner: "{{ app_name }}"
        group: "{{ app_name }}"
      notify: restart application
    
    # Database Setup
    - name: Install PostgreSQL
      package:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present
      when: db_host == "localhost"
    
    - name: Start and enable PostgreSQL
      systemd:
        name: postgresql
        state: started
        enabled: yes
      when: db_host == "localhost"
    
    - name: Create database
      postgresql_db:
        name: "{{ db_name }}"
        state: present
      become_user: postgres
      when: db_host == "localhost"
    
    - name: Create database user
      postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        priv: "{{ db_name }}:ALL"
        state: present
      become_user: postgres
      when: db_host == "localhost"
    
    # Redis Setup
    - name: Install Redis
      package:
        name: redis-server
        state: present
      when: redis_host == "localhost"
    
    - name: Configure Redis
      template:
        src: redis.conf.j2
        dest: /etc/redis/redis.conf
        mode: '0644'
        owner: root
        group: root
      notify: restart redis
      when: redis_host == "localhost"
    
    - name: Start and enable Redis
      systemd:
        name: redis-server
        state: started
        enabled: yes
      when: redis_host == "localhost"
    
    # Nginx Configuration
    - name: Create Nginx configuration
      template:
        src: nginx.conf.j2
        dest: "/etc/nginx/sites-available/{{ app_name }}"
        mode: '0644'
        owner: root
        group: root
      notify: restart nginx
    
    - name: Enable Nginx site
      file:
        src: "/etc/nginx/sites-available/{{ app_name }}"
        dest: "/etc/nginx/sites-enabled/{{ app_name }}"
        state: link
      notify: restart nginx
    
    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: restart nginx
    
    # Application Service
    - name: Create systemd service for application
      template:
        src: app-service.j2
        dest: "/etc/systemd/system/{{ app_name }}.service"
        mode: '0644'
        owner: root
        group: root
      notify:
        - reload systemd
        - restart application
    
    - name: Start and enable application service
      systemd:
        name: "{{ app_name }}"
        state: started
        enabled: yes
        daemon_reload: yes
    
    # Monitoring Setup
    - name: Install monitoring tools
      package:
        name:
          - prometheus-node-exporter
          - grafana
          - collectd
        state: present
      when: monitoring_enabled
    
    - name: Configure Prometheus node exporter
      template:
        src: node-exporter.j2
        dest: /etc/prometheus-node-exporter.env
        mode: '0644'
        owner: root
        group: root
      notify: restart prometheus-node-exporter
      when: monitoring_enabled
    
    - name: Start and enable monitoring services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - prometheus-node-exporter
        - grafana
      when: monitoring_enabled
    
    # Backup Setup
    - name: Create backup script
      template:
        src: backup.sh.j2
        dest: "{{ backup_path }}/backup.sh"
        mode: '0755'
        owner: root
        group: root
      when: backup_enabled
    
    - name: Setup backup cron job
      cron:
        name: "{{ app_name }} backup"
        job: "{{ backup_path }}/backup.sh"
        minute: "0"
        hour: "2"
        user: root
      when: backup_enabled
    
    # Log Rotation
    - name: Configure log rotation
      template:
        src: logrotate.j2
        dest: "/etc/logrotate.d/{{ app_name }}"
        mode: '0644'
        owner: root
        group: root
    
    # Health Checks
    - name: Create health check script
      template:
        src: health-check.sh.j2
        dest: "{{ app_path }}/health-check.sh"
        mode: '0755'
        owner: "{{ app_name }}"
        group: "{{ app_name }}"
    
    - name: Setup health check cron job
      cron:
        name: "{{ app_name }} health check"
        job: "{{ app_path }}/health-check.sh"
        minute: "*/5"
        user: "{{ app_name }}"
    
    # Performance Optimization
    - name: Optimize system parameters
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { name: "net.core.somaxconn", value: "65536" }
        - { name: "net.ipv4.tcp_max_syn_backlog", value: "65536" }
        - { name: "net.core.netdev_max_backlog", value: "5000" }
        - { name: "net.ipv4.tcp_fin_timeout", value: "30" }
        - { name: "net.ipv4.tcp_keepalive_time", value: "1200" }
        - { name: "net.ipv4.tcp_max_tw_buckets", value: "5000" }
        - { name: "vm.swappiness", value: "10" }
        - { name: "vm.dirty_ratio", value: "15" }
        - { name: "vm.dirty_background_ratio", value: "5" }
    
    # Security Hardening
    - name: Secure SSH configuration
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: "^#?PermitRootLogin", line: "PermitRootLogin no" }
        - { regexp: "^#?PasswordAuthentication", line: "PasswordAuthentication no" }
        - { regexp: "^#?PubkeyAuthentication", line: "PubkeyAuthentication yes" }
        - { regexp: "^#?Protocol", line: "Protocol 2" }
        - { regexp: "^#?MaxAuthTries", line: "MaxAuthTries 3" }
        - { regexp: "^#?ClientAliveInterval", line: "ClientAliveInterval 300" }
      notify: restart ssh
    
    - name: Create security monitoring script
      template:
        src: security-monitor.sh.j2
        dest: "{{ app_path }}/security-monitor.sh"
        mode: '0755'
        owner: root
        group: root
    
    - name: Setup security monitoring cron job
      cron:
        name: "{{ app_name }} security monitor"
        job: "{{ app_path }}/security-monitor.sh"
        minute: "*/10"
        user: root
    
    # Documentation
    - name: Create deployment documentation
      template:
        src: deployment-docs.j2
        dest: "{{ config_path }}/DEPLOYMENT.md"
        mode: '0644'
        owner: "{{ app_name }}"
        group: "{{ app_name }}"
    
    - name: Create operations manual
      template:
        src: operations-manual.j2
        dest: "{{ config_path }}/OPERATIONS.md"
        mode: '0644'
        owner: "{{ app_name }}"
        group: "{{ app_name }}"

  handlers:
    - name: restart application
      systemd:
        name: "{{ app_name }}"
        state: restarted
    
    - name: restart nginx
      systemd:
        name: nginx
        state: restarted
    
    - name: restart redis
      systemd:
        name: redis-server
        state: restarted
    
    - name: restart fail2ban
      systemd:
        name: fail2ban
        state: restarted
    
    - name: restart prometheus-node-exporter
      systemd:
        name: prometheus-node-exporter
        state: restarted
    
    - name: restart ssh
      systemd:
        name: sshd
        state: restarted
    
    - name: reload systemd
      systemd:
        daemon_reload: yes

  post_tasks:
    - name: Verify application is running
      uri:
        url: "http://localhost:8080/health"
        method: GET
        status_code: 200
      retries: 5
      delay: 10
    
    - name: Verify database connection
      postgresql_query:
        db: "{{ db_name }}"
        login_host: "{{ db_host }}"
        login_user: "{{ db_user }}"
        login_password: "{{ db_password }}"
        query: "SELECT 1"
      when: db_host == "localhost"
    
    - name: Verify Redis connection
      redis_info:
        login_host: "{{ redis_host }}"
        login_port: "{{ redis_port }}"
        login_password: "{{ redis_password }}"
      when: redis_host == "localhost"
    
    - name: Display deployment summary
      debug:
        msg:
          - "Deployment completed successfully!"
          - "Application URL: http://{{ domain }}"
          - "Application user: {{ app_name }}"
          - "Application path: {{ app_path }}"
          - "Configuration path: {{ config_path }}"
          - "Log path: {{ log_path }}"
          - "Backup path: {{ backup_path }}"
          - "Monitoring: {{ 'enabled' if monitoring_enabled else 'disabled' }}"
          - "SSL: {{ 'enabled' if ssl_enabled else 'disabled' }}"
          - "Firewall: {{ 'enabled' if firewall_enabled else 'disabled' }}"

  rescue:
    - name: Display error information
      debug:
        msg: "Deployment failed! Check the logs for more details."
    
    - name: Collect system information for debugging
      setup:
        gather_facts: yes
    
    - name: Create debug report
      copy:
        dest: "/tmp/deployment-debug-{{ ansible_date_time.iso8601 }}.txt"
        content: |
          Deployment Debug Report
          =====================
          
          Timestamp: {{ ansible_date_time.iso8601 }}
          Hostname: {{ ansible_hostname }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Memory: {{ ansible_memtotal_mb }}MB
          CPU: {{ ansible_processor_cores }} cores
          Disk: {{ ansible_mounts[0].size_available }}
          
          Variables:
          - app_name: {{ app_name }}
          - app_version: {{ app_version }}
          - environment: {{ environment }}
          - domain: {{ domain }}
          - db_host: {{ db_host }}
          - redis_host: {{ redis_host }}
          
          Last Task Status: {{ ansible_failed_task.name if ansible_failed_task is defined else 'Unknown' }}
          Error Message: {{ ansible_failed_result.msg if ansible_failed_result is defined else 'Unknown' }}
    
    - name: Fail the playbook
      fail:
        msg: "Deployment failed. Debug report saved to /tmp/deployment-debug-*.txt"
