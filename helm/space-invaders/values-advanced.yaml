# Advanced Values for Space Invaders Helm Chart
# Comprehensive configuration for production-ready Kubernetes deployment

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  commonLabels: {}
  commonAnnotations: {}

# Main application configuration
replicaCount: 3

image:
  registry: docker.io
  repository: spaceinvaders/space-invaders
  tag: "latest"
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
    - ALL
    add:
    - NET_BIND_SERVICE

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
    - ALL

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}
  labels: {}

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: space-invaders.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: space-invaders-tls
      hosts:
        - space-invaders.example.com

# Resource configuration
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

# Node selector and affinity
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - space-invaders
        topologyKey: kubernetes.io/hostname

# Persistence
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  annotations: {}

# Environment variables
env: []
envFrom: []

# ConfigMaps and Secrets
configMaps:
  enabled: true
  data:
    APP_ENV: production
    LOG_LEVEL: info
    API_BASE_URL: https://api.space-invaders.example.com
    GAME_SETTINGS: |
      {
        "difficulty": "normal",
        "soundEnabled": true,
        "graphicsQuality": "high"
      }

secrets:
  enabled: true
  data:
    DATABASE_URL: postgresql://user:password@postgresql:5432/spaceinvaders
    REDIS_URL: redis://redis:6379
    JWT_SECRET: your-jwt-secret-here
    API_KEY: your-api-key-here

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1

# Lifecycle hooks
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 15"]
  postStart:
    exec:
      command: ["/bin/sh", "-c", "echo 'Application started'"]

# Volumes
volumes: []
volumeMounts: []

# Init containers
initContainers: []
sidecars: []

# Monitoring and observability
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: ""
    labels: {}
    annotations: {}
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: true
    namespace: ""
    labels: {}
    annotations: {}
    rules: []
  grafanaDashboard:
    enabled: true
    namespace: ""
    labels: {}
    annotations: {}

# Logging
logging:
  enabled: true
  level: info
  format: json
  output: stdout
  collectors:
    enabled: true
    resources:
      enabled: true

# Network policies
networkPolicy:
  enabled: true
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
      ports:
      - protocol: TCP
        port: 8080
  egress:
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: postgresql
      ports:
      - protocol: TCP
        port: 5432
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: redis
      ports:
      - protocol: TCP
        port: 6379

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""

# Horizontal Pod Autoscaler
horizontalPodAutoscaler:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

# Vertical Pod Autoscaler
verticalPodAutoscaler:
  enabled: false
  updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: space-invaders
      maxAllowed:
        cpu: 1
        memory: 1Gi
      minAllowed:
        cpu: 100m
        memory: 128Mi

# Pod security policy
podSecurityPolicy:
  enabled: false
  spec:
    privileged: false
    allowPrivilegeEscalation: false
    requiredDropCapabilities:
    - ALL
    volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
    runAsUser:
      rule: 'MustRunAsNonRoot'
    seLinux:
      rule: 'RunAsAny'
    fsGroup:
      rule: 'RunAsAny'

# RBAC
rbac:
  create: true
  rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]

# Service mesh (Istio)
serviceMesh:
  enabled: false
  gateway:
    enabled: true
    annotations: {}
  virtualService:
    enabled: true
    annotations: {}
  destinationRule:
    enabled: true
    annotations: {}

# Backup and restore
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention: 7
  storageClass: ""
  storageSize: 5Gi
  annotations: {}

# Security scanning
security:
  enabled: true
  trivy:
    enabled: true
    imageRef: "aquasec/trivy:latest"
    scanInterval: 86400
    severity: "HIGH,CRITICAL"
  falco:
    enabled: true
    imageRef: "falcosecurity/falco:latest"
    rules: []

# Custom resource definitions
customResources: []

# Additional labels and annotations
additionalLabels: {}
additionalAnnotations: {}

# Tests
tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: latest
    pullPolicy: IfNotPresent
  annotations: {}

# Documentation
docs:
  enabled: true
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false

# Development settings
development:
  enabled: false
  debug: false
  hotReload: false
  profiling: false

# Production optimizations
production:
  enabled: true
  optimizations:
    - resourceLimits
    - healthChecks
    - autoscaling
    - monitoring
    - security
    - backup

# Multi-tenancy
multiTenant:
  enabled: false
  tenantId: ""
  isolation: namespace

# Compliance and auditing
compliance:
  enabled: true
  standards:
    - SOC2
    - GDPR
    - ISO27001
  auditing:
    enabled: true
    logLevel: info
    retention: 90

# Cost optimization
costOptimization:
  enabled: true
  spotInstances: false
  resourceQuotas: true
  namespaceQuota:
    requests.cpu: "2"
    requests.memory: "4Gi"
    limits.cpu: "4"
    limits.memory: "8Gi"

# Disaster recovery
disasterRecovery:
  enabled: true
  rto: 300  # Recovery Time Objective in seconds
  rpo: 900  # Recovery Point Objective in seconds
  backupStrategy: snapshot
  failoverStrategy: activePassive

# Performance tuning
performance:
  enabled: true
  tuning:
    - optimizeImageSize
    - optimizeResourceUsage
    - optimizeNetwork
    - optimizeStorage

# Feature flags
featureFlags:
  enabled: false
  flags: {}
  configMap: ""
  secret: ""

# A/B testing
abTesting:
  enabled: false
  experiments: []
  trafficSplitting: {}

# Canary deployment
canary:
  enabled: false
  steps: 10
  weight: 10
  interval: 10m
  analysis:
    enabled: true
    templates: {}
    args: {}

# Blue-green deployment
blueGreen:
  enabled: false
  activeService: ""
  previewService: ""
  autoPromotionEnabled: false
  scaleDownDelaySeconds: 30
  prePromotionAnalysis:
    templates: []
    args: {}
  postPromotionAnalysis:
    templates: []
    args: {}

# Rolling update strategy
rollingUpdate:
  enabled: true
  maxUnavailable: 25%
  maxSurge: 25%
  partition: 0

# Custom hooks
hooks: {}
preInstall: {}
postInstall: {}
preUpgrade: {}
postUpgrade: {}
preDelete: {}
postDelete: {}

# Experimental features
experimental:
  enabled: false
  features: []

# Vendor-specific configurations
vendor:
  aws:
    enabled: false
    region: ""
    account: ""
  gcp:
    enabled: false
    project: ""
    region: ""
  azure:
    enabled: false
    subscription: ""
    resourceGroup: ""
  yandex:
    enabled: false
    folder: ""
    cloud: ""
